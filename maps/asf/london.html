ogies from the W3C.", "members": [], "x": 326.1, "y": 195.0}, {"i": 94, "name": "JMeter", "kind": "tick", "lines": [7], "desc": "Apache JMeter may be used to test performance both on static and dynamic resources (files, Servlets, Perl scripts, Java Objects, Data Bases and Queries, FTP Servers and more). It can be used to simulate a heavy load on a server, network or object to test its strength or to analyze overall performance under different load types. You can use it to make a graphical analysis of performance or to test your server/script/object behavior under heavy concurrent load.", "members": [], "x": -240.3, "y": 643.3}, {"i": 95, "name": "JSPWiki", "kind": "tick", "lines": [6], "desc": "Apache JSPWiki is a feature-rich and extensible WikiWiki engine built around the standard JEE components (Java, servlets, JSP). It features: - WikiMarkup/Structured Text - File attachments - Templates support - Data storage through 2 WikiPage Providers, with the capability to plug new ones - Security: Authorization and authentication fine grain control - Easy plugin and page filter interfaces - UTF-8 support - JSP-based - Easy-ish installation - Page locking to prevent editing conflicts - Support for Multiple Wikis - Custom User Preferences", "members": [], "x": -78.0, "y": -234.0}, {"i": 96, "name": "Kafka", "kind": "tick", "lines": [0], "desc": "A single Kafka broker can handle hundreds of megabytes of reads and writes per second from thousands of clients. Kafka is designed to allow a single cluster to serve as the central data backbone for a large organization. It can be elastically and transparently expanded without downtime. Data streams are partitioned and spread over a cluster of machines to allow data streams larger than the capability of any single machine and to allow clusters of co-ordinated consumers. Kafka has a modern cluster-centric design that offers strong durability and fault-tolerance guarantees. Messages are persisted on disk and replicated within the cluster to prevent data loss. Each broker can handle terabytes of messages without performance impact.", "members": [], "x": -447.7, "y": 189.3}, {"i": 97, "name": "Karaf", "kind": "hub", "lines": [2, 4], "desc": "Apache Karaf is a small OSGi based runtime which provides a lightweight container onto which various components and applications can be deployed.", "members": [], "x": 78.0, "y": -247.0}, {"i": 98, "name": "Kerby", "kind": "tick", "lines": [2], "desc": "Apache Kerby, as an Apache Directory sub project, is a Java Kerberos binding. It provides a rich, intuitive and interoperable implementation, library, KDC and various facilities that integrates PKI, OTP and token (OAuth2) as desired in modern environments such as cloud, Hadoop and mobile.", "members": [], "x": 302.3, "y": -139.7}, {"i": 99, "name": "Knox", "kind": "tick", "lines": [0], "desc": "The Apache Knox Gateway is a REST API Gateway for interacting with Hadoop clusters. The Knox Gateway provides a single access point for all REST interactions with Hadoop clusters. In this capacity, the Knox Gateway is able to provide valuable functionality to aid in the control, integration, monitoring and automation of critical administrative and analytical needs of the enterprise. Authentication (LDAP and Active Directory Authentication Provider) Federation/SSO (HTTP Header Based Identity Federation) Authorization (Service Level Authorization) Auditing While there are a number of benefits for unsecured Hadoop clusters, the Knox Gateway also complements the kerberos secured cluster quite nicely. Coupled with proper network isolation of a Kerberos secured Hadoop cluster, the Knox Gateway provides the enterprise with a solution that: Integrates well with enterprise identity management solutions Protects the details of the Hadoop cluster deployment (hosts and ports are hidden from endusers) Simplifies the number of services that clients need to interact with", "members": [], "x": -468.0, "y": 138.5}, {"i": 100, "name": "Kudu", "kind": "tick", "lines": [0], "desc": "Apache Kudu is a columnar storage manager developed for the Apache Hadoop platform.", "members": [], "x": -468.0, "y": 79.4}, {"i": 101, "name": "Kylin", "kind": "tick", "lines": [0], "desc": "Apache Kylin is an open source, distributed Analytical Data Warehouse for Big Data; it was designed to provide OLAP (Online Analytical Processing) capability in the big data era. By renovating the multi-dimensional cube and precalculation technology on Hadoop and Spark, Kylin is able to achieve near constant query speed regardless of the ever-growing data volume. Reducing query latency from minutes to sub-second, Kylin brings online analytics back to big data.", "members": [], "x": -468.0, "y": 20.2}, {"i": 102, "name": "Libcloud", "kind": "hub", "lines": [1, 8], "desc": "Apache Libcloud is a standard Python library that abstracts away differences among multiple cloud provider APIs. It allows users to manage cloud servers, cloud storage and load-balancers.", "members": [], "x": -195.0, "y": 65.0}, {"i": 103, "name": "Linkis", "kind": "tick", "lines": [0], "desc": "Apache Linkis is a computation middleware project, which decouples the upper applications and the underlying data engines, provides standardized interfaces (REST, JDBC etc.) to easily connect to various underlying engines (Spark, Presto, Flink, etc.).", "members": [], "x": -842.8, "y": -145.2}, {"i": 104, "name": "log4cxx", "kind": "tick", "lines": [1], "desc": "Apache log4cxx provides logging services for C++.", "members": [], "x": 13.0, "y": 351.0}, {"i": 105, "name": "Log4j", "kind": "tick", "lines": [1], "desc": "Log4j is a versatile, feature-rich, efficient logging API and backend for Java.", "members": [], "x": -52.0, "y": 292.5}, {"i": 106, "name": "log4net", "kind": "tick", "lines": [1], "desc": "Apache log4net provides logging services for .NET.", "members": [], "x": -117.0, "y": 2.7}, {"i": 107, "name": "log4php", "kind": "tick", "lines": [1], "desc": "Apache log4php is a logging framework for PHP.", "members": [], "x": -162.5, "y": 84.5}, {"i": 108, "name": "Lucene", "kind": "hub", "lines": [1, 3, 6], "desc": "Apache Lucene is a high-performance, full-featured text search engine library written entirely in Java. It is a technology suitable for nearly any application that requires full-text search, especially cross-platform.", "members": [], "x": -91.0, "y": 169.0}, {"i": 109, "name": "Lucene.Net", "kind": "tick", "lines": [3], "desc": "Lucene.Net is a port of the Lucene search engine library, written in C# and targeted at .NET runtime users. The Lucene search library is based on an inverted index. Lucene.Net has three primary goals: 1. Maintain the existing line-by-line port from Java to C#, fully automating and commoditizing the process such that the project can easily synchronize with the Java Lucene release schedule; 2. Maintaining the high-performance requirements expected of a first class C# search engine library; 3. Maximize usability and power when used within the .NET runtime. To that end, it will present a highly idiomatic, carefully tailored API that takes advantage of many of the special features of the .NET runtime.", "members": [], "x": -769.2, "y": -218.8}, {"i": 110, "name": "Magpie", "kind": "tick", "lines": [7], "desc": "Apache Magpie is a project-agnostic, agent-assisted maintainership and development framework that any open-source project — ASF or not — can adopt. It ships independently-toggleable modes (Triage, Mentoring, Drafting, Pairing, and Auto-merge) as reusable agent skills, so each project picks the automation level that fits its culture and risk tolerance. Magpie covers security-issue handling, contributor mentoring, agent-drafted remediation under human review, and developer-side development-cycle workflows, with a privacy-aware model-routing posture for sensitive content.", "members": [], "x": -104.0, "y": 351.0}, {"i": 111, "name": "Mahout", "kind": "tick", "lines": [1], "desc": "Scalable machine learning library", "members": [], "x": -195.0, "y": 117.0}, {"i": 112, "name": "ManifoldCF", "kind": "tick", "lines": [6], "desc": "ManifoldCF is an effort to provide an open source framework for connecting source content repositories like Microsoft Sharepoint and EMC Documentum, to target repositories or indexes, such as Apache Solr , OpenSearchServer or ElasticSearch. ManifoldCF also defines a security model for target repositories that permits them to enforce source-repository security policies.", "members": [], "x": -78.0, "y": -182.0}, {"i": 113, "name": "Maven", "kind": "tick", "lines": [7], "desc": "Maven is a project development management and comprehension tool. Based on the concept of a project object model: builds, dependency management, documentation creation, site publication, and distribution publication are all controlled from the declarative file. Maven can be extended by plugins to utilise a number of other development tools for reporting or the build process.", "members": [], "x": -52.0, "y": 403.0}, {"i": 114, "name": "Maven Doxia", "kind": "tick", "lines": [7], "desc": "Doxia is a content generation framework which aims to provide its users with powerful techniques for generating static and dynamic content: Doxia can be used in web-based publishing context to generate static sites, in addition to being incorporated into dynamic content generation systems like blogs, wikis and content management systems.", "members": [], "x": -52.0, "y": 455.0}, {"i": 115, "name": "MINA", "kind": "tick", "lines": [2], "desc": "Apache MINA is a network application framework which helps users develop high performance and high scalability network applications easily. It provides an abstract, event-driven, asynchronous API over various transports such as TCP/IP and UDP/IP via Java NIO.", "members": [], "x": 286.0, "y": -183.5}, {"i": 116, "name": "mod_ftp", "kind": "tick", "lines": [2], "desc": "mod_ftp is an FTP Protocol module to serve httpd content over the FTP protocol (whereever the HTTP protocol could also be used). It provides both RETR/REST retrieval and STOR/APPE upload, using the same user/permissions model as httpd (so it shares the same security considerations as mod_dav plus mod_dav_fs).", "members": [], "x": 249.5, "y": -270.5}, {"i": 117, "name": "mod_perl", "kind": "tick", "lines": [2], "desc": "mod_perl is a unique piece of software that integrates the power of Perl with the flexibility and stability of the Apache Web server. With mod_perl, you can harness the power of the full Apache API with Perl and develop Web applications quickly, without sacrificing performance.", "members": [], "x": 169.0, "y": -46.2}, {"i": 118, "name": "MyFaces", "kind": "tick", "lines": [4], "desc": "MyFaces is the free open source implementation of Jakarta Server Faces, a web application framework that accomplishes the MVC paradigm. It is comparable to the well-known Struts Framework but has features and concepts that are beyond those of Struts - especially the component orientation.", "members": [], "x": -2.2, "y": 140.8}, {"i": 119, "name": "Mynewt", "kind": "tick", "lines": [8], "desc": "Apache Mynewt is a community-driven module OS for constrained, embedded applications. Mynewt provides a real-time operating system, flash file system, network stacks, and support utilities for real-world embedded systems. Its goal is to make it easy to develop applications for microcontroller environments where power and cost are driving factors.", "members": [], "x": -474.3, "y": 383.3}, {"i": 120, "name": "Neethi", "kind": "tick", "lines": [5], "desc": "Apache Neethi is a Java implementation of the WS-Policy Specification.", "members": [], "x": -403.0, "y": -78.0}, {"i": 121, "name": "NetBeans", "kind": "tick", "lines": [7], "desc": "Apache NetBeans is and IDE for many language (java, php, ...). Apache NetBeans is a platform that can be extended by third party developer.", "members": [], "x": -292.3, "y": 643.3}, {"i": 122, "name": "NiFi", "kind": "tick", "lines": [0], "desc": "The mission of NiFi is the creation and maintenance of software related to providing an easy to use, powerful, and reliable system to process and distribute data. Apache NiFi MiNiFi is an edge data collection agent built to seamlessly integrate with and leverage the command and control of NiFi. Apache NiFi Registry is a centralized registry for key configuration items including flow versions, assets, and extensions for Apache NiFi and Apache MiNiFi.", "members": [], "x": -879.5, "y": -108.5}, {"i": 123, "name": "Nutch", "kind": "tick", "lines": [4], "desc": "Apache Nutch is a highly extensible and scalable open source web crawler software project. Stemming from Apache Lucene, Nutch is a well matured, production ready batch crawler relying on Apache Hadoop data structures, which are great for batch processing. Nutch has a modular architecture and provides pluggable and extensible interfaces such as Parse, Index and ScoringFilter's for custom implementations e.g. Apache Tika for parsing. Additionally, pluggable indexers exists for Apache Solr, Elastic Search, etc. Nutch can run on a single machine, but gains a lot of its strength from running in a Hadoop cluster. The now retired branch Nutch 2.x differed from 1.x in one key area: storage is abstracted away from any specific underlying data store by using Apache Gora for handling object to persistent mappings and to store fetch time, status, content, parsed text, outlinks, inlinks, etc. into a number of NoSQL storage solutions.", "members": [], "x": 36.0, "y": -120.0}, {"i": 124, "name": "OFBiz", "kind": "hub", "lines": [2, 3, 4, 5, 6], "desc": "Apache OFBiz is an open source product for the automation of enterprise processes that includes framework components and business applications for ERP (Enterprise Resource Planning), CRM (Customer Relationship Management), E-Business / E-Commerce, SCM (Supply Chain Management), MRP (Manufacturing Resource Planning), MMS/EAM (Maintenance Management System/Enterprise Asset Management). Apache OFBiz provides a foundation and starting point for reliable, secure and scalable enterprise solutions, see https://ofbiz.apache.org/ for more.", "members": [], "x": 39.0, "y": -52.0}, {"i": 125, "name": "OpenDAL", "kind": "tick", "lines": [0], "desc": "Apache OpenDAL is a data access layer that allows users to easily and efficiently retrieve data from various storage services in a unified way.", "members": [], "x": -767.9, "y": 286.5}, {"i": 126, "name": "OpenJPA", "kind": "hub", "lines": [1, 3, 4], "desc": "Apache OpenJPA is a Java persistence project at The Apache Software Foundation that can be used as a stand-alone POJO persistence layer or integrated into any Java EE compliant container and many other lightweight frameworks, such as Tomcat and Spring. The 1.x releases are a production ready, feature-rich, compliant implementation of the Java Persistence API (JPA) 1.0 part of the JSR-220 Enterprise Java Beans 3.0 specification, which pass the Sun JPA 1.0b Technology Compatibility Kit. The 2.x releases are a production ready, compliant implement of the JSR-317 Java Persistence 2.0 specification, which is backwards compatible to the JPA 1.0 specification and passes the Sun JPA 2.0 Technology Compatibility Kit.", "members": [], "x": -39.0, "y": 104.0}, {"i": 127, "name": "OpenMeetings", "kind": "tick", "lines": [2], "desc": "The Apache OpenMeetings provides video conferencing, instant messaging, white board, collaborative document editing and other groupware tools. Kurento Media Server is used or audio/video communication.", "members": [], "x": 213.1, "y": -239.1}, {"i": 128, "name": "OpenNLP", "kind": "tick", "lines": [1], "desc": "Apache OpenNLP software supports the most common NLP tasks, such as tokenization, sentence segmentation, part-of-speech tagging, named entity extraction, chunking, parsing, and coreference resolution. These tasks are usually required to build more advanced text processing services. OpenNLP also includes maximum entropy and perceptron based machine learning.", "members": [], "x": -263.0, "y": 166.0}, {"i": 129, "name": "OpenOffice", "kind": "tick", "lines": [6], "desc": "Apache OpenOffice is a leading open-source, office-document productivity suite providing six productivity applications (Writer, Calc, Impress, Draw, Math, Base) based around the OpenDocument Format (ODF). OpenOffice is released on Windows, macOS (OS X), Linux 32-bit DEB+RPM, Linux 64-bit DEB+RPM and in 41 languages.", "members": [], "x": 93.2, "y": 0.0}, {"i": 130, "name": "OpenWebBeans", "kind": "tick", "lines": [4], "desc": "OpenWebBeans is an ALv2-licensed implementation of the \"Contexts and Dependency Injection for the Java EE platform\" specification which is defined as JSR-299.", "members": [], "x": 598.0, "y": 195.0}, {"i": 131, "name": "ORC", "kind": "hub", "lines": [0, 1, 3], "desc": "ORC is a self-describing type-aware columnar file format designed for Hadoop workloads. It is optimized for large streaming reads, but with integrated support for finding required rows quickly. Storing data in a columnar format lets the reader read, decompress, and process only the values that are required for the current query.", "members": [], "x": -351.0, "y": -13.0}, {"i": 132, "name": "Ozone", "kind": "tick", "lines": [0], "desc": "Apache Ozone is a highly scalable, distributed storage for Analytics, Big data and Cloud Native applications. Ozone supports S3 compatible object APIs as well as a Hadoop Compatible File System implementation. It is optimized for both efficient object store and file system operations. It is built on a highly available, replicated block storage layer called Hadoop Distributed Data Store (HDDS). Applications using frameworks like Apache Spark, YARN and Hive work natively without any modifications.", "members": [], "x": -916.3, "y": -71.7}, {"i": 133, "name": "Parquet", "kind": "tick", "lines": [0], "desc": "Apache Parquet is an open source, column-oriented data file format designed for efficient data storage and retrieval. It provides high performance compression and encoding schemes to handle complex data in bulk and is supported in many programming language and analytics tools.", "members": [], "x": -953.1, "y": -34.9}, {"i": 134, "name": "PDFBox", "kind": "hub", "lines": [1, 6], "desc": "The Apache PDFBox library is an open source Java tool for working with PDF documents.", "members": [], "x": 234.0, "y": 247.0}, {"i": 135, "name": "Phoenix", "kind": "hub", "lines": [0, 3], "desc": "Apache Phoenix enables OLTP and operational analytics for Apache Hadoop by providing a relational database layer leveraging Apache HBase as its backing store. It includes integration with Apache Spark, Pig, Flume, Map Reduce, and other products in the Hadoop ecosystem. It is accessed as a JDBC driver and enables querying, updating, and managing HBase tables through standard SQL.", "members": [], "x": -468.0, "y": -39.0}, {"i": 136, "name": "Pig", "kind": "tick", "lines": [3], "desc": "Apache Pig is a platform for analyzing large data sets that consists of a high-level language for expressing data analysis programs, coupled with infrastructure for evaluating these programs. The salient property of Pig programs is that their structure is amenable to substantial parallelization, which in turns enables them to handle very large data sets. Pig's infrastructure layer consists of a compiler that produces sequences of Map-Reduce programs. Pig's language layer consists of a textual language called Pig Latin, which has the following key properties: * Ease of programming. It is trivial to achieve parallel execution of simple, \"embarrassingly parallel\" data analysis tasks. Complex tasks comprised of multiple interrelated data transformations are explicitly encoded as data flow sequences, making them easy to write, understand, and maintain. * Optimization opportunities. The way in which tasks are encoded permits the system to optimize their execution automatically, allowing the user to focus on semantics rather than efficiency. * Extensibility. Users can create their own functions to do special-purpose processing.", "members": [], "x": -732.5, "y": -255.5}, {"i": 137, "name": "Pinot", "kind": "tick", "lines": [0], "desc": "Apache Pinot is a real-time distributed online analytical processing (OLAP) datastore. Use Pinot to ingest and immediately query data from streaming or batch data sources (including, Apache Kafka, Amazon Kinesis, Hadoop HDFS, Amazon S3, Azure ADLS, and Google Cloud Storage). Apache Pinot includes the following: Ultra low-latency analytics even at extremely high throughput. Columnar data store with several smart indexing and pre-aggregation techniques. Scaling up and out with no upper bound. Consistent performance based on the size of your cluster and an expected query per second (QPS) threshold. It's perfect for user-facing real-time analytics and other analytical use cases, including internal dashboards, anomaly detection, and ad hoc data exploration.", "members": [], "x": -989.8, "y": 1.8}, {"i": 138, "name": "PLC4X", "kind": "hub", "lines": [1, 2, 8], "desc": "PLC4X is a set of libraries for communicating with industrial programmable logic controllers (PLCs) using a variety of protocols but with a shared API.", "members": [], "x": -156.0, "y": -13.0}, {"i": 139, "name": "POI", "kind": "hub", "lines": [1, 6], "desc": "APIs for manipulating various file formats based upon Open Office XML (ECMA-376) and Microsoft's OLE 2 Compound Document formats using pure Java. Apache POI is your Java Excel, Word and PowerPoint solution. We have a complete API for porting other OOXML and OLE 2 Compound Document formats and welcome others to participate.", "members": [], "x": 91.0, "y": 312.0}, {"i": 140, "name": "Polaris", "kind": "hub", "lines": [0, 3], "desc": "Apache Polaris implements the Apache Iceberg REST API, enabling seamless multi-engine interoperability across a wide range of platforms, including Apache Doris, Apache Flink, Apache Spark, ...", "members": [], "x": -546.0, "y": -65.0}, {"i": 141, "name": "Pony Mail", "kind": "hub", "lines": [2, 6], "desc": "Apache Pony Mail is a web-based mail archive browser and interaction platform for mailing lists. It provides full-text search, threading, and real-time interaction with archived mailing lists, and is the engine behind lists.apache.org.", "members": [], "x": 169.0, "y": 0.0}, {"i": 142, "name": "PouchDB", "kind": "hub", "lines": [2, 3, 6], "desc": "PouchDB is an open-source JavaScript database inspired by Apache CouchDB that is designed to run well within the browser. PouchDB was created to help web developers build applications that work as well offline as they do online. It enables applications to store data locally while offline, then synchronize it with CouchDB and compatible servers when the application is back online, keeping the user's data in sync no matter where they next log in.", "members": [], "x": -13.0, "y": -104.0}, {"i": 143, "name": "Props Ant", "kind": "tick", "lines": [7], "desc": "The Apache Props Antlib is a library of supplementary handlers for Apache Ant properties resolution. The types provided are instances of org.apache.tools.ant.PropertyHelper.Delegate and can be invoked using the <propertyhelper> task provided in Ant 1.8.0.", "members": [], "x": -52.0, "y": 507.0}, {"i": 144, "name": "Pulsar", "kind": "tick", "lines": [0], "desc": "Apache Pulsar is an all-in-one messaging and streaming platform. Messages can be consumed and acknowledged individually or consumed as streams with less than 10ms of latency. Its layered architecture allows rapid scaling across hundreds of nodes, without data reshuffling. Its features include multi-tenancy with resource separation and access control, geo-replication across regions, tiered storage and support for six official client languages. It supports up to one million unique topics and is designed to simplify your application architecture.", "members": [], "x": -1008.2, "y": 46.2}, {"i": 145, "name": "PyLucene", "kind": "hub", "lines": [1, 6], "desc": "PyLucene is a Python extension for accessing Java Lucene TM. Its goal is to allow you to use Lucene's text indexing and searching capabilities from Python.", "members": [], "x": 273.0, "y": 169.0}, {"i": 146, "name": "Qpid", "kind": "tick", "lines": [2], "desc": "Apache Qpid implements the latest AMQP specification, the first open standard for enterprise messaging, and provides transaction management, queuing, distribution, security, management, clustering, federation and heterogeneous multi-platform support and a lot more.", "members": [], "x": 42.8, "y": -282.2}, {"i": 147, "name": "Ranger", "kind": "hub", "lines": [0, 2], "desc": "Apache Ranger is a framework to enable, monitor and manage comprehensive data security - consistently across various data processing services. Integrated with most of the Big-Data technologies (Hadoop, Hive, HBase, Spark, Trino, ...)", "members": [], "x": -39.0, "y": -325.0}, {"i": 148, "name": "Rat", "kind": "tick", "lines": [7], "desc": "Apache Rat improves accuracy and efficiency when reviewing and auditing releases. It is heuristic in nature: making guesses about possible problems. It will produce false positives and cannot find every possible issue with a release. It's reports require interpretation. Apache Rat was developed in response to a need felt in the Apache Incubator to be able to review releases for the most common faults less labour intensively. It is therefore highly tuned to the Apache style of releases.", "members": [], "x": -70.4, "y": 551.4}, {"i": 149, "name": "rivet", "kind": "tick", "lines": [6], "desc": "Apache Rivet is a system for creating dynamic web content via the Tcl programming language integrated with Apache Web Server. It is designed to be fast, powerful and extensible, consume few system resources, be easy to learn, and to provide the user with a platform that can also be used for other programming tasks outside the web (GUI's, system administration tasks, text processing, database manipulation, XML, and so on). In order to meet these goals Tcl programming language was chosen to combine with the Apache HTTP Server.", "members": [], "x": -208.0, "y": 117.0}, {"i": 150, "name": "Roller", "kind": "tick", "lines": [6], "desc": "Apache Roller is a full-featured, multi-user and group-blog server suitable for blog sites large and small. It runs as a Java web application that should be able to run on most any Java EE server and relational database. Roller's installation guide covers deployment on Tomcat, GlassFish, and JBoss application servers using a MySQL, Derby, or PostgreSQL database. Users however have reported success running Roller on other app servers and databases. - Multi-user blogging: can support tens of thousands of users and blogs - Group blogging with three permisson levels (editor, author and limited) - Support for comment moderation and comment spam prevention measures - Bloggers have complete control over blog layout/style via Apache Velocity-driven templates - Built-in search engine indexes weblog entry content - Pluggable cache and rendering system - Support for blog clients that support MetaWeblog API - All blogs have entry and comment feeds in both RSS 2.0 and Atom 1.0 formats", "members": [], "x": -260.0, "y": 117.0}, {"i": 151, "name": "Royale", "kind": "tick", "lines": [4], "desc": "Apache Royale implements the principles of Apache Flex to support development of applications designed for JavaScript instead of Adobe Flash/AIR runtimes. Apache Royale improves developer productivity in creating applications to run wherever JavaScript runs, including on browsers, in Apache Cordova applications, on Node, and on other platforms.", "members": [], "x": 34.4, "y": -203.4}, {"i": 152, "name": "Samza", "kind": "tick", "lines": [0], "desc": "Apache Samza provides a system for processing stream data from publish-subscribe systems such as Apache Kafka. The developer writes a stream processing task, and executes it as a Samza job. Samza then routes messages between stream processing tasks and the publish-subscribe systems that the messages are addressed to.", "members": [], "x": -1008.2, "y": 98.2}, {"i": 153, "name": "Sandesha2", "kind": "tick", "lines": [5], "desc": "Apache Sandesha2 is an Axis2 module that implements the WS-ReliableMessaging specification. It can be used both on the client side and on the server side.", "members": [], "x": -351.0, "y": -78.0}, {"i": 154, "name": "Santuario", "kind": "hub", "lines": [1, 2, 5], "desc": "Library implementing XML Digital Signature Specification & XML Encryption Specification", "members": [], "x": 455.0, "y": -143.0}, {"i": 155, "name": "SeaTunnel", "kind": "tick", "lines": [0], "desc": "SeaTunnel is a next-generation super high-performance, distributed, massive data integration tool. It can synchronize tens of billions of data stably and efficiently every day, and has been used in the production of many companies.", "members": [], "x": -1008.2, "y": 150.2}, {"i": 156, "name": "Serf", "kind": "tick", "lines": [1], "desc": "The serf library is a high performance C-based HTTP client library built upon the Apache Portable Runtime (APR) library", "members": [], "x": -205.8, "y": -192.8}, {"i": 157, "name": "Shiro", "kind": "hub", "lines": [1, 4], "desc": "Apache Shiro is a powerful and flexible open-source security framework that cleanly handles authentication, authorization, enterprise session management, single sign-on and cryptography services.", "members": [], "x": 390.0, "y": 195.0}, {"i": 158, "name": "SIS", "kind": "hub", "lines": [1, 3], "desc": "Apache SIS provides data structures for geographic data and associated metadata along with methods to manipulate those data structures. The library is an implementation of GeoAPI interfaces and can be used for desktop or server applications.", "members": [], "x": -195.0, "y": 169.0}, {"i": 159, "name": "SkyWalking", "kind": "tick", "lines": [8], "desc": "Use Apache SkyWalking when you need an application performance monitor tool for distributed systems, especially designed for microservices, cloud native and container-based (Docker, K8s, Mesos) architectures.", "members": [], "x": -511.1, "y": 420.1}, {"i": 160, "name": "Solr", "kind": "hub", "lines": [2, 4, 6], "desc": "Solr is an open source enterprise search server based on the Lucene Java search library, with Rest-like JSON/HTTP APIs, high performance, high availability, powerful analytics, hit highlighting, faceted search, caching, replication, and a web administration interface.", "members": [], "x": 247.0, "y": 13.0}, {"i": 161, "name": "Solr Operator", "kind": "hub", "lines": [6, 8], "desc": "Manages Solr resources in Kubernetes", "members": [], "x": -156.0, "y": 117.0}, {"i": 162, "name": "Spark", "kind": "tick", "lines": [0], "desc": "Apache Spark is a fast and general engine for large-scale data processing. It offers high-level APIs in Java, Scala, Python and R, as well as a rich set of libraries including stream processing, machine learning, and graph analytics.", "members": [], "x": -989.8, "y": 194.6}, {"i": 163, "name": "SSHD", "kind": "tick", "lines": [2], "desc": "Apache SSHD is a 100% pure java library to support the SSH protocols on both the client and server side. This library is based on Apache MINA, a scalable and high performance asynchronous IO library. SSHD does not really aim at being a replacement for the SSH client or SSH server from Unix operating systems, but rather provides support for Java based applications requiring SSH support.", "members": [], "x": 7.6, "y": -317.4}, {"i": 164, "name": "STeVe", "kind": "tick", "lines": [1], "desc": "Apache STeVe is a collection of online voting tools, used by the ASF, to handle STV and other voting methods.", "members": [], "x": -242.5, "y": -229.5}, {"i": 165, "name": "Storm", "kind": "tick", "lines": [0], "desc": "Apache Storm is a distributed real-time computation system. Similar to how Hadoop provides a set of general primitives for doing batch processing, Storm provides a set of general primitives for doing real-time computation.", "members": [], "x": -953.1, "y": 231.4}, {"i": 166, "name": "Struts", "kind": "tick", "lines": [4], "desc": "The Apache Struts Project offers the Apache Struts 2 web framework which is a comprehensive and modular tooling stack for creating web-based Java applications. Struts 2, emerged from the WebWork 2 framework, is an excellent choice for teams who value elegant solutions to difficult problems.", "members": [], "x": 240.5, "y": -149.5}, {"i": 167, "name": "Subversion", "kind": "tick", "lines": [7], "desc": "Subversion exists to be universally recognized and adopted as an open-source, centralized version control system characterized by its reliability as a safe haven for valuable data; the simplicity of its model and usage; and its ability to support the needs of a wide variety of users and projects, from individuals to large-scale enterprise operations.", "members": [], "x": -107.2, "y": 588.2}, {"i": 168, "name": "Superset", "kind": "hub", "lines": [0, 3], "desc": "Superset is a fast, lightweight, intuitive, business intelligence platform. Loaded with options, Superset makes it easy for users of all skill sets to explore and visualize their data, from simple line charts to highly detailed geospatial charts. * Powerful yet easy to use: Superset makes it easy to explore your data, using either our simple no-code viz builder or state-of-the-art SQL IDE. * Integrates with modern databases Superset can connect to any SQL-based databases including modern cloud-native databases and engines at petabyte scale. * Modern architecture Superset is lightweight and highly scalable, leveraging the power of your existing data infrastructure without requiring yet another ingestion layer. * Rich visualizations and dashboards Superset ships with 40+ pre-installed visualization types. Our plug-in architecture makes it easy to build custom visualizations.", "members": [], "x": -741.0, "y": -156.0}, {"i": 169, "name": "Synapse", "kind": "hub", "lines": [2, 5], "desc": "Apache Synapse is a simple and highly effective ESB, Web Services intermediary and SOA framework. It can be added to your existing network very simply either as a services gateway or as an HTTP proxy. Once Apache Synapse is mediating your service requests it can perform many functions including routing, load-balancing, transformation and protocol switching. Apache Synapse can be used to build an Enterprise Service Bus (ESB) or Service Oriented Architecture (SOA). Apache Synapse has been designed to support very fast XML routing with a streaming XML design based upon Apache Axiom. in addition, the use of a completely asynchronous architecture and non-blocking IO based on Java NIO ensures that Synapse has very low overhead and can scale to support thousands of concurrent clients without dropping messages.", "members": [], "x": 286.0, "y": -234.0}, {"i": 170, "name": "Syncope", "kind": "tick", "lines": [2], "desc": "Apache Syncope is an Open Source system for managing digital identities in enterprise environments, implemented in Java EE technology and released under Apache 2.0 license. Identity management (or IdM) represents the joint result of business process and IT to manage user data on systems and applications. IdM involves considering user attributes, roles, resources and entitlements in trying to give a decent answer to the question bumping at every time in IT administrators' mind: Who has access to What, When, How, and Why?", "members": [], "x": 99.9, "y": 160.1}, {"i": 171, "name": "Tapestry", "kind": "tick", "lines": [4], "desc": "Tapestry is a component-oriented Java web application framework. Its design emphasizes ease of use and developer productivity. Component classes are simple POJOs, with Tapestry using byte code manipulation to enhance classes at runtime. Configuration is via annotations and naming conventions rather than XML. Web page and component templates use regular (X)HTML that can be edited by any web designer. Live Class Reloading enables you to edit Java code and immediately see results by reloading the page in the web browser, resulting in a very fast \"code it - see it - fix it\" loop.", "members": [], "x": 247.0, "y": -53.6}, {"i": 172, "name": "Tentacles", "kind": "tick", "lines": [7], "desc": "Apache Tentacles helps the reviewer by automating interactions with the repository containing the artifacts comprising the release.", "members": [], "x": -143.9, "y": 624.9}, {"i": 173, "name": "Texen", "kind": "tick", "lines": [1], "desc": "Texen is a general purpose text generating utility. It is capable of producing almost any sort of text output. Driven by Ant, essentially an Ant Task, Texen uses a control template, an optional set of worker templates, and control context to govern the generated output. Although TexenTask can be used directly, it is usually subclassed to initialize your control context before generating any output.", "members": [], "x": -279.3, "y": -266.3}, {"i": 174, "name": "Tez", "kind": "tick", "lines": [0], "desc": "Apache Tez is an effort to develop a generic application framework which can be used to process arbitrarily complex directed-acyclic graphs (DAGs) of data-processing tasks and also a re-usable set of data-processing primitives which can be used by other projects.", "members": [], "x": -916.3, "y": 268.2}, {"i": 175, "name": "Thrift", "kind": "hub", "lines": [1, 2], "desc": "Apache Thrift allows you to define data types and service interfaces in a simple definition file. Taking that file as input, the compiler generates code to be used to easily build RPC clients and servers that communicate seamlessly across programming languages. Instead of writing a load of boilerplate code to serialize and transport your objects and invoke remote methods, you can get right down to business.", "members": [], "x": 520.0, "y": 104.0}, {"i": 176, "name": "Tika", "kind": "hub", "lines": [1, 6], "desc": "The Apache Tika toolkit is an ASFv2 licensed open source tool for extracting information from digital documents. Tika allows search engines, content management systems and other applications that work with various kinds of digital documents to easily detect and extract metadata and content from all major file formats.", "members": [], "x": 169.0, "y": 286.0}, {"i": 177, "name": "Tobago", "kind": "tick", "lines": [4], "desc": "The goal of Tobago is to provide the community with a well designed set of user interface components based on JSF.", "members": [], "x": 349.9, "y": 91.0}, {"i": 178, "name": "Tomcat", "kind": "hub", "lines": [2, 4], "desc": "Apache Tomcat is a web server that is an open source software implementation of the Java Servlet, JavaServer Pages, Java Expression Language and Java WebSocket technologies. The Java Servlet, JavaServer Pages, Java Expression Language and Java WebSocket specifications are developed under the Java Community Process. Apache Tomcat is developed in an open and participatory environment and released under the Apache License version 2. Apache Tomcat is intended to be a collaboration of the best-of-breed developers from around the world. We invite you to participate in this open development project. Apache Tomcat powers numerous large-scale, mission-critical web applications across a diverse range of industries and organizations. Some of these users and their stories are listed on the PoweredBy wiki page.", "members": [], "x": 195.0, "y": -195.0}, {"i": 179, "name": "TomEE", "kind": "tick", "lines": [2], "desc": "Apache TomEE Web Profile delivers Servlets, JSP, JSF, JTA, JPA, CDI, Bean Validation and EJB Lite. Apache TomEE Plus has all the features of TomEE with the addition of JAX-RS (RESTfull Services), JAX-WS (Web Services), JMS (Java Message Service) and JCA (the Java Connector Architecture). The additional functionality is delivered via Apache CXF, Apache ActiveMQ and the Geronimo Connector library", "members": [], "x": -198.8, "y": -94.8}, {"i": 180, "name": "Torque", "kind": "tick", "lines": [3], "desc": "Torque is an object-relational mapper for Java. In other words, Torque lets you access and manipulate data in a relational database using java objects. Unlike most other object-relational mappers, Torque does not use reflection to access user-provided classes, but it generates the necessary classes (including the Data Objects) from an XML schema describing the database layout (which can either be written by hand or generated from an existing database). The XML schema can also be used to generate and execute a SQL script which creates all the tables in the database.", "members": [], "x": -695.7, "y": -292.3}, {"i": 181, "name": "Traffic Server", "kind": "tick", "lines": [2], "desc": "Apache Traffic Server is fast, scalable and extensible HTTP/1.1 compliant caching proxy server. ATS can be used as a reverse, forward or even transparent HTTP proxy.", "members": [], "x": 136.7, "y": -71.3}, {"i": 182, "name": "TsFile", "kind": "hub", "lines": [0, 8], "desc": "TsFile is a high-performance columnar storage file format designed for industrial time-series data, featuring multi-language interfaces, high compression ratios, high read/write throughput, and fast random access capabilities. It is ideal for scenarios such as building high-quality datasets, managing data assets, conducting data analytics, and training AI models.", "members": [], "x": -299.0, "y": 247.0}, {"i": 183, "name": "Turbine", "kind": "tick", "lines": [4], "desc": "Turbine is a servlet based framework that allows experienced Java developers to quickly build web applications. Turbine allows you to use personalize the web sites and to use user logins to restrict access to parts of your application. Turbine is a matured and well established framework that is used as the base of many other projects (like e.g. the excellent Jetspeed 1 Portals framework. Turbine is an excellent choice for developing applications that make use of a services-oriented architecture. Some of the functionality provided with Turbine includes a security management system, a scheduling service, XML-defined form validation server, and an XML-RPC service for web services. It is a simple task to create new services particular to your application. The Turbine core is free of any dependency on a presentation layer technology. Both JavaServer Pages (JSP) and Velocity are supported inside Turbine. For developers already familiar with JSP, or have existing JSP tag libraries, Turbine offers support for the Sun standard. Velocity is the favorite view technology of most users of the Turbine framework; try it out and see if Velocity can help you develop your web applications faster and work more easily with non-programming designers. Turbine is developed in an open, participatory environment and released under the Apache Software License. Turbine is intended to be a collaboration of the best-of-breed developers from around the world. We invite you to participate in this open development project. To learn more about getting involved, look at our \"How to Help\" pages.", "members": [], "x": 442.0, "y": 195.0}, {"i": 184, "name": "TVM", "kind": "tick", "lines": [0], "desc": "Apache TVM is an open source machine learning compiler framework for CPUs, GPUs, and machine learning accelerators. It aims to enable machine learning engineers to optimize and run computations efficiently on any hardware backend.", "members": [], "x": -871.9, "y": 286.5}, {"i": 185, "name": "Unomi", "kind": "tick", "lines": [6], "desc": "Apache Unomi is a REST server that manages user profiles and events related to the profiles. It can be used to integrate personalization and profile management within very different systems such as CMS, CRMs, Issue Trackers, native mobile application. It was designed to be easy to integrate with external systems, promoting profile sharing and re-use in very different applications. Basically the server tracks users using different mechanisms (by default cookies), builds a progressively populated profile and associates events that are performed by a user with his profile. Events may range from a click on a page, to a file being downloaded, a native mobile application button being clicked, or anything that can be sent to the server. The server has a built-in rule system that makes it possible to perform any action when an event is collected for a profile. It also has the notion of user segments, making it possible to classify user profiles into dynamic sub-groups, notably to build personalized experiences for specific segments.", "members": [], "x": -341.2, "y": 61.8}, {"i": 186, "name": "VCL", "kind": "tick", "lines": [8], "desc": "VCL is a modular cloud computing platform which dynamically provisions and brokers remote access to compute resources including virtual machines, bare-metal computers, and resources in other cloud platforms. A self-service web portal is used to request resources and for administration.", "members": [], "x": -400.8, "y": 309.8}, {"i": 187, "name": "Velocity", "kind": "tick", "lines": [1], "desc": "", "members": ["Velocity", "Velocity DVSL", "Velocity Tools"], "x": -316.1, "y": -303.1}, {"i": 188, "name": "Vysper", "kind": "tick", "lines": [2], "desc": "Apache Vysper aims to be a modular, full featured XMPP (Jabber) server. Vysper is implemented in Java.", "members": [], "x": -163.6, "y": -59.6}, {"i": 189, "name": "Websh", "kind": "hub", "lines": [2, 4], "desc": "Websh is a rapid development environment for building powerful, fast, and reliable web applications in Tcl. Websh is versatile and handles everything from HTML generation to data-base driven one-to-one page customization. Websh can be run in CGI environments and as Apache module.", "members": [], "x": 143.0, "y": -247.0}, {"i": 190, "name": "Whimsy", "kind": "tick", "lines": [6], "desc": "The production Whimsy server also has a number of tools that automate some organizational processes, like adding PMC members to official corporate rosters or reading, updating, and approving the monthly board agenda.", "members": [], "x": -304.4, "y": 98.6}, {"i": 191, "name": "Whisker", "kind": "tick", "lines": [7], "desc": "Apache Whisker allows an application to models the licensing characteristics of the contents of its distributions. Use cases are auditing the model against the contents of a distribution, reporting on the contents of a distribution and generation licensing documents (LICENSE, NOTICE and so on) for a distribution. Whisker distributes tooling for the command line and build system such as Maven.", "members": [], "x": -188.3, "y": 643.3}, {"i": 192, "name": "Wicket", "kind": "tick", "lines": [4], "desc": "Write maintainable, secure and scalable web applications using just Java and HTML. Invented in 2004, Wicket is one of the few survivors of the Java serverside web framework wars of the mid 2000's, and a proud member of the Apache Software Foundation.", "members": [], "x": 494.0, "y": 195.0}, {"i": 193, "name": "Woden", "kind": "tick", "lines": [5], "desc": "The Woden project is a subproject of the Apache Web Services Project to develop a Java class library for reading, manipulating, creating and writing WSDL documents, initially to support WSDL 2.0 but with the longer term aim of supporting past, present and future versions of WSDL. There are two main deliverables: an API and an implementation. The Woden API will consist of a set of Java interfaces. The WSDL 2.0-specific portion of the Woden API will conform to the W3C WSDL 2.0 specification. The implementation will be a high performance implementation directly usable in other Apache projects such as Axis2.", "members": [], "x": -182.5, "y": -0.5}, {"i": 194, "name": "WSS4J", "kind": "tick", "lines": [5], "desc": "The Apache WSS4J project provides a Java implementation of the primary security standards for Web Services, namely the OASIS Web Services Security (WS-Security) specifications from the OASIS Web Services Security TC.", "members": [], "x": -235.1, "y": -53.1}, {"i": 195, "name": "Xalan C++", "kind": "tick", "lines": [5], "desc": "Xalan-C++ is an XSLT processor for transforming XML documents into HTML, text, or other XML document types. It implements XSL Transformations (XSLT) Version 1.0 and XML Path Language (XPath) Version 1.0 and can be used from the command line.", "members": [], "x": -89.5, "y": 26.0}, {"i": 196, "name": "Xalan Java", "kind": "tick", "lines": [5], "desc": "Xalan-J is an XSLT processor for transforming XML documents into HTML, text, or other XML document types. It implements XSL Transformations (XSLT) Version 1.0 and XML Path Language (XPath) Version 1.0 and can be used from the command line, in an applet or a servlet, or as a module in other program. Xalan-J implements the javax.xml.transform interface in Java API for XML Processing (JAXP) 1.3. This interface provides a modular framework and a standard API for performing XML transformations, and utilizes system properties to determine which Transformer and which XML parser to use.", "members": [], "x": -38.3, "y": 26.0}, {"i": 197, "name": "Xerces C++", "kind": "tick", "lines": [5], "desc": "Xerces-C++ is a validating XML parser written in a portable subset of C++. Xerces-C++ makes it easy to give your application the ability to read and write XML data. A shared library is provided for parsing, generating, manipulating, and validating XML documents. Xerces-C++ is faithful to the XML 1.0 and 1.1 recommendations and many associated standards. The parser provides high performance, modularity, and scalability. Source code, samples and API documentation are provided with the parser. For portability, care has been taken to make minimal use of templates, no RTTI, and minimal use of #ifdefs.", "members": [], "x": 174.8, "y": -122.8}, {"i": 198, "name": "Xerces Java", "kind": "tick", "lines": [5], "desc": "Xerces-J is a high performance, fully compliant validating XML parser written in Java. It is a fully conforming XML Schema processor that includes a complete implementation of the Document Object Model Level 3 Core and Load/Save W3C Recommendations and provides a complete implementation of the XML Inclusions (XInclude) W3C Recommendation. It also provides support for OASIS XML Catalogs v1.1. Xerces 2.x introduced the Xerces Native Interface (XNI), a complete framework for building parser components and configurations that is extremely modular and easy to program. XNI is merely an internal set of interfaces. There is no need for an XML application programmer to learn XNI if they only intend to interface to the Xerces2 parser using standard interfaces like JAXP, DOM, and SAX. Xerces developers and application developers that need more power and flexibility than that provided by the standard interfaces should read and understand XNI. The latest Xerces-J version released is, 2.12.2.", "members": [], "x": 230.4, "y": -178.4}, {"i": 199, "name": "Xerces Perl", "kind": "tick", "lines": [5], "desc": "XML::Xerces is the Perl API to the Apache project's Xerces XML parser. It is implemented using the Xerces C++ API, and it provides access to most of the C++ API from Perl. Because it is based on Xerces-C, XML::Xerces provides a validating XML parser that makes it easy to give your application the ability to read and write XML data. Classes are provided for parsing, generating, manipulating, and validating XML documents. XML::Xerces is faithful to the XML 1.0 and 1.1 recommendations and associated standards (DOM levels 1, 2, and 3, SAX 1 and 2, Namespaces, and W3C XML Schema). The parser provides high performance, modularity, and scalability, and provides full support for Unicode. XML::Xerces implements the vast majority of the Xerces-C API (if you notice any discrepancies please mail the list). The exception is some functions in the C++ API which either have better Perl counterparts (such as file I/O) or which manipulate internal C++ information that has no role in the Perl module. The majority of the API is created automatically using Simplified Wrapper Interface Generator (SWIG). However, care has been taken to make most method invocations natural to perl programmers, so a number of rough C++ edges have been smoothed over (See the Special Perl API Features section).", "members": [], "x": 386.4, "y": -208.0}, {"i": 200, "name": "XG Commons", "kind": "tick", "lines": [5], "desc": "Apache XML Graphics Commons is a library that consists of several reusable components used by Apache Batik and Apache FOP. Many of these components can easily be used separately outside the domains of SVG and XSL-FO. You will find components such as a PDF library, an RTF library, Graphics2D implementations that let you generate PDF and PostScript files and much more.", "members": [], "x": 455.0, "y": 65.0}, {"i": 201, "name": "XML Commons Ext", "kind": "tick", "lines": [5], "desc": "The External components portion of Apache XML Commons contains interfaces that are defined by external standards organizations. For DOM, that's the W3C; for SAX it's David Megginson (http://www.saxproject.org); for JAXP it's Sun. While we could send users to each of the primary sources for these deliverables, keeping our own versions of these in the XML Commons repository gives us a number of advantages: 1) Simplicity of downloads; users get the whole product from one place, 2) Better version control; we can only take fixes we want and add Apache-specific changes, 3) Better overview documentation of how these interfaces fit into the XML processing world, 4) More chance for cross-project community building within Apache projects.", "members": [], "x": 330.8, "y": -208.0}, {"i": 202, "name": "XML Commons Res", "kind": "tick", "lines": [5], "desc": "The XML Commons Resolver can be used in a wide variety of XML parsing, processing and related programs to resolve various public or system identifiers into accessible URLs for use by your application. The resolver supports several catalog types for mapping, including OASIS XML, OASIS TR 9401 and XCatalog styles.", "members": [], "x": 455.0, "y": -91.0}, {"i": 203, "name": "XMLBeans", "kind": "tick", "lines": [5], "desc": "XMLBeans is a tool that allows you to access the full power of XML in a Java friendly way. The idea is that you can take advantage of the richness and features of XML and XML Schema and have these features mapped as naturally as possible to the equivalent Java language and typing constructs. XMLBeans uses XML Schema to compile Java interfaces and classes that you can then use to access and modify XML instance data. Using XMLBeans is similar to using any other Java interface/class, you will see things like getFoo or setFoo just as you would expect when working with Java. While a major use of XMLBeans is to access your XML instance data with strongly typed Java classes there are also API's that allow you access to the full XML infoset (XMLBeans keeps XML Infoset fidelity) as well as to allow you to reflect into the XML schema itself through an XML Schema Object model. For more details on XMLBeans see the XMLBeans Wiki pages or the XMLBeans documentation (the Documentation tab on this website). What Makes XMLBeans Different There are at least two major things that make XMLBeans unique from other XML-Java binding options. 1. Full XML Schema support. XMLBeans fully supports XML Schema and the corresponding java classes provide constructs for all of the major functionality of XML Schema. This is critical since often times you do not have control over the features of XML Schema that you need to work with in Java. Also, XML Schema oriented applications can take full advantage of the power of XML Schema and not have to restrict themselvs to a subset. 2. Full XML Infoset fidelity.When unmarshalling an XML instance the full XML infoset is kept and is available to the developer. This is critical because because of the subset of XML that is not easily represented in java. For example, order of the elements or comments might be needed in a particular application. A major objective of XMLBeans has been to be applicable in all non-streaming (in memory) XML programming situations. You should be able to compile your XML Schema into a set of java classes and know that 1) you will be able to use XMLBeans for all of the schemas you encounter (even the warped ones) and 2) that you will be able to get to the XML at whatever level is necessary - and not have to resort to multple tools to do this. To accomplish this XMLBeans provides three major APIs: * XmlObject The java classes that are generated from an XML Schema are all derived from XmlObject. These provide strongly typed getters and setters for each of the elements within the defined XML. Complex types are in turn XmlObjects. For example getCustomer might return a CustomerType (which is an XmlObject). Simple types turn into simple getters and setters with the correct java type. For example getName might return a String. * XmlCursor From any XmlObject you can get an XmlCursor. This provides efficient, low level access to the XML Infoset. A cursor represents a position in the XML instance. You can move the cursor around the XML instance at any level of granularity you need from individual characters to Tokens. * SchemaType XMLBeans provides a full XML Schema object model that you can use to reflect on the underlying schema meta information. For example, you might want to generate a sample XML instance for an XML schema or perhaps find the enumerations for an element so that you can display them. All of this was built with performance in mind. Informal benchmarks and user feedback indicate that XMLBeans is extremely fast.", "members": [], "x": 455.0, "y": -39.0}, {"i": 204, "name": "XMLSchema", "kind": "tick", "lines": [5], "desc": "Apache XMLSchema is a lightweight Java object model that can be used to manipulate and generate XML schema representations.", "members": [], "x": 455.0, "y": 13.0}, {"i": 205, "name": "Yetus", "kind": "hub", "lines": [1, 7], "desc": "A collection of libraries and tools that enable contribution and release processes for software projects.", "members": [], "x": -52.0, "y": 351.0}, {"i": 206, "name": "YuniKorn", "kind": "tick", "lines": [8], "desc": "A light-weight universal resource scheduler for container orchestrator systems.", "members": [], "x": -437.5, "y": 346.5}, {"i": 207, "name": "Zeppelin", "kind": "tick", "lines": [0], "desc": "Zeppelin is a modern web-based tool for the data scientists to collaborate over large-scale data exploration and visualization projects.", "members": [], "x": -819.9, "y": 286.5}, {"i": 208, "name": "ZooKeeper", "kind": "tick", "lines": [3], "desc": "Apache ZooKeeper is an effort to develop and maintain an open-source server which enables highly reliable distributed coordination.", "members": [], "x": -658.9, "y": -329.1}], "stats": {"stations": 209, "hubs": 57, "crossings": 5, "void": 4.39, "longest_run": 5.6, "labels_overlapping": 0, "aspect": 1.31, "score": 3977.3}}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('map-data').textContent);
  const stage = document.getElementById('stage');
  const svg = stage.querySelector('svg.map');
  const panel = document.getElementById('panel');
  const tip = document.getElementById('tip');
  const qIn = document.getElementById('q');

  // ---- index the SVG --------------------------------------------------
  const els = {}, lineEls = {}, legEls = {};
  svg.querySelectorAll('[data-s]').forEach(e => (els[e.dataset.s] ||= []).push(e));
  svg.querySelectorAll('.line').forEach(e => (lineEls[e.dataset.l] ||= []).push(e));
  svg.querySelectorAll('.leg').forEach(e => (legEls[e.dataset.l] = e));
  const byName = new Map(D.stations.map(s => [s.name.toLowerCase(), s]));
  document.getElementById('names').innerHTML =
    D.stations.map(s => `<option value="${s.name.replace(/"/g, '&quot;')}">`).join('');

  const state = { lines: new Set(), sel: null, q: '' };

  // ---- state -> classes -----------------------------------------------
  function apply() {
    const hl = state.lines.size ? state.lines
      : state.sel != null ? new Set(D.stations[state.sel].lines) : null;
    const q = state.q.trim().toLowerCase();
    D.stations.forEach(s => {
      const match = !!q && s.name.toLowerCase().includes(q);
      let dim = (hl && !s.lines.some(l => hl.has(l))) || (q && !match);
      (els[s.i] || []).forEach(e => {
        e.classList.toggle('dim', !!dim);
        e.classList.toggle('sel', state.sel === s.i);
        e.classList.toggle('match', match);
      });
    });
    D.lines.forEach((_, i) => {
      (lineEls[i] || []).forEach(e => e.classList.toggle('dim', !!(hl && !hl.has(i))));
      if (legEls[i]) legEls[i].classList.toggle('off', state.lines.size > 0 && !state.lines.has(i));
    });
    renderPanel();
    syncHash();
  }

  // ---- detail panel ---------------------------------------------------
  const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const chip = i => `<button class="chip${state.lines.has(i) ? ' active' : ''}" data-chip="${i}" ` +
    `title="Show only this line"><i style="background:${D.lines[i].color}"></i>${esc(D.lines[i].name)}</button>`;
  function renderPanel() {
    if (state.sel == null) {
      panel.innerHTML = `<p class="help"><b>${D.stats.stations}</b> projects on <b>${D.lines.length}</b> lines, ` +
        `<b>${D.stats.hubs}</b> of them interchanges. Click a station for details, or pick a line:</p>` +
        `<div class="chips">${D.lines.map((_, i) => chip(i)).join('')}</div>`;
      return;
    }
    const s = D.stations[state.sel];
    const kind = s.lines.length > 1 ? `Interchange · ${s.lines.length} lines` : 'Station';
    panel.innerHTML =
      `<button class="x" data-clear aria-label="Close">×</button><h2>${esc(s.name)}</h2>` +
      `<div class="kind">${kind}</div><div class="chips">${s.lines.map(chip).join('')}</div>` +
      (s.desc ? `<p>${esc(s.desc)}</p>` : '') +
      (s.members.length ? `<div class="members">Includes: ${s.members.map(esc).join(', ')}</div>` : '');
  }
  panel.addEventListener('click', e => {
    const c = e.target.closest('[data-chip]');
    if (c) { toggleLine(+c.dataset.chip); return; }
    if (e.target.closest('[data-clear]')) { state.sel = null; apply(); }
  });

  // ---- actions --------------------------------------------------------
  function toggleLine(i) {
    state.lines.has(i) ? state.lines.delete(i) : state.lines.add(i);
    apply();
  }
  function select(i, zoom) {
    state.sel = i;
    apply();
    if (zoom != null && i != null) zoomTo(D.stations[i].x, D.stations[i].y, zoom);
  }
  function resetAll() {
    state.lines.clear(); state.sel = null; state.q = ''; qIn.value = '';
    setVB({ ...full }); apply();
  }

  // ---- pan / zoom -----------------------------------------------------
  const v0 = svg.viewBox.baseVal;
  const full = { x: v0.x, y: v0.y, w: v0.width, h: v0.height };
  let vb = { ...full };
  function setVB(n) {
    vb = n;
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  }
  const toSvg = (cx, cy) => {
    const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  };
  function zoomAt(px, py, k) {
    const nw = Math.min(Math.max(vb.w * k, full.w / 14), full.w * 1.4);
    const f = nw / vb.w;
    setVB({ x: px - (px - vb.x) * f, y: py - (py - vb.y) * f, w: nw, h: vb.h * f });
  }
  function zoomTo(x, y, frac) {
    const w = full.w * frac, h = full.h * frac;
    setVB({ x: x - w / 2, y: y - h / 2, w, h });
  }
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const p = toSvg(e.clientX, e.clientY);
    zoomAt(p.x, p.y, Math.exp(e.deltaY * 0.0015));
  }, { passive: false });
  const mid = () => ({ x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
  document.getElementById('zin').onclick = () => { const m = mid(); zoomAt(m.x, m.y, 0.7); };
  document.getElementById('zout').onclick = () => { const m = mid(); zoomAt(m.x, m.y, 1 / 0.7); };
  document.getElementById('reset').onclick = resetAll;

  // pointer: drag to pan; click (no drag) to select
  const ptrs = new Map();
  let drag = null, pinch = null;
  stage.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      drag = { sx: e.clientX, sy: e.clientY, vb: { ...vb }, moved: false, target: e.target };
    } else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) };
      if (drag) drag.moved = true;
    }
  });
  stage.addEventListener('pointermove', e => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const p = toSvg((a.x + b.x) / 2, (a.y + b.y) / 2);
      zoomAt(p.x, p.y, pinch.d / d);
      pinch.d = d;
      return;
    }
    if (drag && ptrs.size === 1) {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) > 5) {
        drag.moved = true; stage.classList.add('dragging');
        try { stage.setPointerCapture(e.pointerId); } catch (_) {}
        hideTip();
      }
      if (drag.moved) {
        const r = svg.getBoundingClientRect();
        const k = Math.max(drag.vb.w / r.width, drag.vb.h / r.height);
        setVB({ x: drag.vb.x - dx * k, y: drag.vb.y - dy * k, w: vb.w, h: vb.h });
      }
    } else if (!drag || !drag.moved) {
      hover(e);
    }
  });
  const end = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (drag && ptrs.size === 0) {
      if (!drag.moved && e.type === 'pointerup') click(drag.target);
      drag = null; stage.classList.remove('dragging');
    }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('pointerleave', hideTip);

  function click(t) {
    const st = t.closest && t.closest('[data-s]');
    if (st) { select(state.sel === +st.dataset.s ? null : +st.dataset.s); return; }
    const lg = t.closest && (t.closest('.leg') || t.closest('.line'));
    if (lg) { toggleLine(+lg.dataset.l); return; }
    if (state.sel != null) { state.sel = null; apply(); }
  }

  // ---- tooltip --------------------------------------------------------
  function hideTip() { tip.classList.remove('on'); }
  function hover(e) {
    const el = e.target.closest && e.target.closest('[data-s]');
    if (!el) { hideTip(); return; }
    const s = D.stations[+el.dataset.s];
    const d = s.desc ? (s.desc.length > 220 ? s.desc.slice(0, 220) + '…' : s.desc) : '';
    tip.innerHTML = `<b>${esc(s.name)}</b>` +
      `<div class="chips">${s.lines.map(i => `<span class="chip"><i style="background:${D.lines[i].color}"></i>${esc(D.lines[i].name)}</span>`).join('')}</div>` +
      (d ? `<div class="d">${esc(d)}</div>` : '');
    tip.classList.add('on');
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + 'px';
    tip.style.top = Math.min(e.clientY + 16, innerHeight - h - 8) + 'px';
  }

  // ---- search, keyboard, URL hash --------------------------------------
  qIn.addEventListener('input', () => { state.q = qIn.value; apply(); });
  qIn.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = qIn.value.trim().toLowerCase();
    const hit = byName.get(q) || D.stations.find(s => s.name.toLowerCase().includes(q));
    if (hit) { state.q = ''; qIn.value = hit.name; select(hit.i, 0.28); }
  });
  addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== qIn) { e.preventDefault(); qIn.focus(); }
    else if (e.key === 'Escape') { resetAll(); qIn.blur(); }
  });
  function syncHash() {
    try {
      const parts = [];
      if (state.sel != null) parts.push('s=' + encodeURIComponent(D.stations[state.sel].name));
      if (state.lines.size) parts.push('l=' + [...state.lines].sort().join(','));
      history.replaceState(null, '', parts.length ? '#' + parts.join('&') : location.pathname + location.search);
    } catch (_) {}
  }
  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    (h.get('l') || '').split(',').filter(Boolean).forEach(n => {
      if (D.lines[+n]) state.lines.add(+n);
    });
    const s = h.get('s') && byName.get(h.get('s').toLowerCase());
    if (s) { state.sel = s.i; apply(); zoomTo(s.x, s.y, 0.35); } else apply();
  }
  readHash();
})();
</script>
</body>
</html>
