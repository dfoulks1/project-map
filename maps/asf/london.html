rm is a distributed real-time computation system. Similar to how Hadoop provides a set of general primitives for doing batch processing, Storm provides a set of general primitives for doing real-time computation.", "members": [], "x": -953.1, "y": 231.4}, {"i": 166, "name": "Struts", "kind": "tick", "lines": [4], "desc": "The Apache Struts Project offers the Apache Struts 2 web framework which is a comprehensive and modular tooling stack for creating web-based Java applications. Struts 2, emerged from the WebWork 2 framework, is an excellent choice for teams who value elegant solutions to difficult problems.", "members": [], "x": 240.5, "y": -149.5}, {"i": 167, "name": "Subversion", "kind": "tick", "lines": [7], "desc": "Subversion exists to be universally recognized and adopted as an open-source, centralized version control system characterized by its reliability as a safe haven for valuable data; the simplicity of its model and usage; and its ability to support the needs of a wide variety of users and projects, from individuals to large-scale enterprise operations.", "members": [], "x": -107.2, "y": 588.2}, {"i": 168, "name": "Superset", "kind": "hub", "lines": [0, 3], "desc": "Superset is a fast, lightweight, intuitive, business intelligence platform. Loaded with options, Superset makes it easy for users of all skill sets to explore and visualize their data, from simple line charts to highly detailed geospatial charts. * Powerful yet easy to use: Superset makes it easy to explore your data, using either our simple no-code viz builder or state-of-the-art SQL IDE. * Integrates with modern databases Superset can connect to any SQL-based databases including modern cloud-native databases and engines at petabyte scale. * Modern architecture Superset is lightweight and highly scalable, leveraging the power of your existing data infrastructure without requiring yet another ingestion layer. * Rich visualizations and dashboards Superset ships with 40+ pre-installed visualization types. Our plug-in architecture makes it easy to build custom visualizations.", "members": [], "x": -741.0, "y": -156.0}, {"i": 169, "name": "Synapse", "kind": "hub", "lines": [2, 5], "desc": "Apache Synapse is a simple and highly effective ESB, Web Services intermediary and SOA framework. It can be added to your existing network very simply either as a services gateway or as an HTTP proxy. Once Apache Synapse is mediating your service requests it can perform many functions including routing, load-balancing, transformation and protocol switching. Apache Synapse can be used to build an Enterprise Service Bus (ESB) or Service Oriented Architecture (SOA). Apache Synapse has been designed to support very fast XML routing with a streaming XML design based upon Apache Axiom. in addition, the use of a completely asynchronous architecture and non-blocking IO based on Java NIO ensures that Synapse has very low overhead and can scale to support thousands of concurrent clients without dropping messages.", "members": [], "x": 286.0, "y": -234.0}, {"i": 170, "name": "Syncope", "kind": "tick", "lines": [2], "desc": "Apache Syncope is an Open Source system for managing digital identities in enterprise environments, implemented in Java EE technology and released under Apache 2.0 license. Identity management (or IdM) represents the joint result of business process and IT to manage user data on systems and applications. IdM involves considering user attributes, roles, resources and entitlements in trying to give a decent answer to the question bumping at every time in IT administrators' mind: Who has access to What, When, How, and Why?", "members": [], "x": 99.9, "y": 160.1}, {"i": 171, "name": "Tapestry", "kind": "tick", "lines": [4], "desc": "Tapestry is a component-oriented Java web application framework. Its design emphasizes ease of use and developer productivity. Component classes are simple POJOs, with Tapestry using byte code manipulation to enhance classes at runtime. Configuration is via annotations and naming conventions rather than XML. Web page and component templates use regular (X)HTML that can be edited by any web designer. Live Class Reloading enables you to edit Java code and immediately see results by reloading the page in the web browser, resulting in a very fast \"code it - see it - fix it\" loop.", "members": [], "x": 247.0, "y": -53.6}, {"i": 172, "name": "Tentacles", "kind": "tick", "lines": [7], "desc": "Apache Tentacles helps the reviewer by automating interactions with the repository containing the artifacts comprising the release.", "members": [], "x": -143.9, "y": 624.9}, {"i": 173, "name": "Texen", "kind": "tick", "lines": [1], "desc": "Texen is a general purpose text generating utility. It is capable of producing almost any sort of text output. Driven by Ant, essentially an Ant Task, Texen uses a control template, an optional set of worker templates, and control context to govern the generated output. Although TexenTask can be used directly, it is usually subclassed to initialize your control context before generating any output.", "members": [], "x": -279.3, "y": -266.3}, {"i": 174, "name": "Tez", "kind": "tick", "lines": [0], "desc": "Apache Tez is an effort to develop a generic application framework which can be used to process arbitrarily complex directed-acyclic graphs (DAGs) of data-processing tasks and also a re-usable set of data-processing primitives which can be used by other projects.", "members": [], "x": -916.3, "y": 268.2}, {"i": 175, "name": "Thrift", "kind": "hub", "lines": [1, 2], "desc": "Apache Thrift allows you to define data types and service interfaces in a simple definition file. Taking that file as input, the compiler generates code to be used to easily build RPC clients and servers that communicate seamlessly across programming languages. Instead of writing a load of boilerplate code to serialize and transport your objects and invoke remote methods, you can get right down to business.", "members": [], "x": 520.0, "y": 104.0}, {"i": 176, "name": "Tika", "kind": "hub", "lines": [1, 6], "desc": "The Apache Tika toolkit is an ASFv2 licensed open source tool for extracting information from digital documents. Tika allows search engines, content management systems and other applications that work with various kinds of digital documents to easily detect and extract metadata and content from all major file formats.", "members": [], "x": 169.0, "y": 286.0}, {"i": 177, "name": "Tobago", "kind": "tick", "lines": [4], "desc": "The goal of Tobago is to provide the community with a well designed set of user interface components based on JSF.", "members": [], "x": 349.9, "y": 91.0}, {"i": 178, "name": "Tomcat", "kind": "hub", "lines": [2, 4], "desc": "Apache Tomcat is a web server that is an open source software implementation of the Java Servlet, JavaServer Pages, Java Expression Language and Java WebSocket technologies. The Java Servlet, JavaServer Pages, Java Expression Language and Java WebSocket specifications are developed under the Java Community Process. Apache Tomcat is developed in an open and participatory environment and released under the Apache License version 2. Apache Tomcat is intended to be a collaboration of the best-of-breed developers from around the world. We invite you to participate in this open development project. Apache Tomcat powers numerous large-scale, mission-critical web applications across a diverse range of industries and organizations. Some of these users and their stories are listed on the PoweredBy wiki page.", "members": [], "x": 195.0, "y": -195.0}, {"i": 179, "name": "TomEE", "kind": "tick", "lines": [2], "desc": "Apache TomEE Web Profile delivers Servlets, JSP, JSF, JTA, JPA, CDI, Bean Validation and EJB Lite. Apache TomEE Plus has all the features of TomEE with the addition of JAX-RS (RESTfull Services), JAX-WS (Web Services), JMS (Java Message Service) and JCA (the Java Connector Architecture). The additional functionality is delivered via Apache CXF, Apache ActiveMQ and the Geronimo Connector library", "members": [], "x": -198.8, "y": -94.8}, {"i": 180, "name": "Torque", "kind": "tick", "lines": [3], "desc": "Torque is an object-relational mapper for Java. In other words, Torque lets you access and manipulate data in a relational database using java objects. Unlike most other object-relational mappers, Torque does not use reflection to access user-provided classes, but it generates the necessary classes (including the Data Objects) from an XML schema describing the database layout (which can either be written by hand or generated from an existing database). The XML schema can also be used to generate and execute a SQL script which creates all the tables in the database.", "members": [], "x": -695.7, "y": -292.3}, {"i": 181, "name": "Traffic Server", "kind": "tick", "lines": [2], "desc": "Apache Traffic Server is fast, scalable and extensible HTTP/1.1 compliant caching proxy server. ATS can be used as a reverse, forward or even transparent HTTP proxy.", "members": [], "x": 136.7, "y": -71.3}, {"i": 182, "name": "TsFile", "kind": "hub", "lines": [0, 8], "desc": "TsFile is a high-performance columnar storage file format designed for industrial time-series data, featuring multi-language interfaces, high compression ratios, high read/write throughput, and fast random access capabilities. It is ideal for scenarios such as building high-quality datasets, managing data assets, conducting data analytics, and training AI models.", "members": [], "x": -299.0, "y": 247.0}, {"i": 183, "name": "Turbine", "kind": "tick", "lines": [4], "desc": "Turbine is a servlet based framework that allows experienced Java developers to quickly build web applications. Turbine allows you to use personalize the web sites and to use user logins to restrict access to parts of your application. Turbine is a matured and well established framework that is used as the base of many other projects (like e.g. the excellent Jetspeed 1 Portals framework. Turbine is an excellent choice for developing applications that make use of a services-oriented architecture. Some of the functionality provided with Turbine includes a security management system, a scheduling service, XML-defined form validation server, and an XML-RPC service for web services. It is a simple task to create new services particular to your application. The Turbine core is free of any dependency on a presentation layer technology. Both JavaServer Pages (JSP) and Velocity are supported inside Turbine. For developers already familiar with JSP, or have existing JSP tag libraries, Turbine offers support for the Sun standard. Velocity is the favorite view technology of most users of the Turbine framework; try it out and see if Velocity can help you develop your web applications faster and work more easily with non-programming designers. Turbine is developed in an open, participatory environment and released under the Apache Software License. Turbine is intended to be a collaboration of the best-of-breed developers from around the world. We invite you to participate in this open development project. To learn more about getting involved, look at our \"How to Help\" pages.", "members": [], "x": 442.0, "y": 195.0}, {"i": 184, "name": "TVM", "kind": "tick", "lines": [0], "desc": "Apache TVM is an open source machine learning compiler framework for CPUs, GPUs, and machine learning accelerators. It aims to enable machine learning engineers to optimize and run computations efficiently on any hardware backend.", "members": [], "x": -871.9, "y": 286.5}, {"i": 185, "name": "Unomi", "kind": "tick", "lines": [6], "desc": "Apache Unomi is a REST server that manages user profiles and events related to the profiles. It can be used to integrate personalization and profile management within very different systems such as CMS, CRMs, Issue Trackers, native mobile application. It was designed to be easy to integrate with external systems, promoting profile sharing and re-use in very different applications. Basically the server tracks users using different mechanisms (by default cookies), builds a progressively populated profile and associates events that are performed by a user with his profile. Events may range from a click on a page, to a file being downloaded, a native mobile application button being clicked, or anything that can be sent to the server. The server has a built-in rule system that makes it possible to perform any action when an event is collected for a profile. It also has the notion of user segments, making it possible to classify user profiles into dynamic sub-groups, notably to build personalized experiences for specific segments.", "members": [], "x": -341.2, "y": 61.8}, {"i": 186, "name": "VCL", "kind": "tick", "lines": [8], "desc": "VCL is a modular cloud computing platform which dynamically provisions and brokers remote access to compute resources including virtual machines, bare-metal computers, and resources in other cloud platforms. A self-service web portal is used to request resources and for administration.", "members": [], "x": -400.8, "y": 309.8}, {"i": 187, "name": "Velocity", "kind": "tick", "lines": [1], "desc": "", "members": ["Velocity", "Velocity DVSL", "Velocity Tools"], "x": -316.1, "y": -303.1}, {"i": 188, "name": "Vysper", "kind": "tick", "lines": [2], "desc": "Apache Vysper aims to be a modular, full featured XMPP (Jabber) server. Vysper is implemented in Java.", "members": [], "x": -163.6, "y": -59.6}, {"i": 189, "name": "Websh", "kind": "hub", "lines": [2, 4], "desc": "Websh is a rapid development environment for building powerful, fast, and reliable web applications in Tcl. Websh is versatile and handles everything from HTML generation to data-base driven one-to-one page customization. Websh can be run in CGI environments and as Apache module.", "members": [], "x": 143.0, "y": -247.0}, {"i": 190, "name": "Whimsy", "kind": "tick", "lines": [6], "desc": "The production Whimsy server also has a number of tools that automate some organizational processes, like adding PMC members to official corporate rosters or reading, updating, and approving the monthly board agenda.", "members": [], "x": -304.4, "y": 98.6}, {"i": 191, "name": "Whisker", "kind": "tick", "lines": [7], "desc": "Apache Whisker allows an application to models the licensing characteristics of the contents of its distributions. Use cases are auditing the model against the contents of a distribution, reporting on the contents of a distribution and generation licensing documents (LICENSE, NOTICE and so on) for a distribution. Whisker distributes tooling for the command line and build system such as Maven.", "members": [], "x": -188.3, "y": 643.3}, {"i": 192, "name": "Wicket", "kind": "tick", "lines": [4], "desc": "Write maintainable, secure and scalable web applications using just Java and HTML. Invented in 2004, Wicket is one of the few survivors of the Java serverside web framework wars of the mid 2000's, and a proud member of the Apache Software Foundation.", "members": [], "x": 494.0, "y": 195.0}, {"i": 193, "name": "Woden", "kind": "tick", "lines": [5], "desc": "The Woden project is a subproject of the Apache Web Services Project to develop a Java class library for reading, manipulating, creating and writing WSDL documents, initially to support WSDL 2.0 but with the longer term aim of supporting past, present and future versions of WSDL. There are two main deliverables: an API and an implementation. The Woden API will consist of a set of Java interfaces. The WSDL 2.0-specific portion of the Woden API will conform to the W3C WSDL 2.0 specification. The implementation will be a high performance implementation directly usable in other Apache projects such as Axis2.", "members": [], "x": -182.5, "y": -0.5}, {"i": 194, "name": "WSS4J", "kind": "tick", "lines": [5], "desc": "The Apache WSS4J project provides a Java implementation of the primary security standards for Web Services, namely the OASIS Web Services Security (WS-Security) specifications from the OASIS Web Services Security TC.", "members": [], "x": -235.1, "y": -53.1}, {"i": 195, "name": "Xalan C++", "kind": "tick", "lines": [5], "desc": "Xalan-C++ is an XSLT processor for transforming XML documents into HTML, text, or other XML document types. It implements XSL Transformations (XSLT) Version 1.0 and XML Path Language (XPath) Version 1.0 and can be used from the command line.", "members": [], "x": -89.5, "y": 26.0}, {"i": 196, "name": "Xalan Java", "kind": "tick", "lines": [5], "desc": "Xalan-J is an XSLT processor for transforming XML documents into HTML, text, or other XML document types. It implements XSL Transformations (XSLT) Version 1.0 and XML Path Language (XPath) Version 1.0 and can be used from the command line, in an applet or a servlet, or as a module in other program. Xalan-J implements the javax.xml.transform interface in Java API for XML Processing (JAXP) 1.3. This interface provides a modular framework and a standard API for performing XML transformations, and utilizes system properties to determine which Transformer and which XML parser to use.", "members": [], "x": -38.3, "y": 26.0}, {"i": 197, "name": "Xerces C++", "kind": "tick", "lines": [5], "desc": "Xerces-C++ is a validating XML parser written in a portable subset of C++. Xerces-C++ makes it easy to give your application the ability to read and write XML data. A shared library is provided for parsing, generating, manipulating, and validating XML documents. Xerces-C++ is faithful to the XML 1.0 and 1.1 recommendations and many associated standards. The parser provides high performance, modularity, and scalability. Source code, samples and API documentation are provided with the parser. For portability, care has been taken to make minimal use of templates, no RTTI, and minimal use of #ifdefs.", "members": [], "x": 174.8, "y": -122.8}, {"i": 198, "name": "Xerces Java", "kind": "tick", "lines": [5], "desc": "Xerces-J is a high performance, fully compliant validating XML parser written in Java. It is a fully conforming XML Schema processor that includes a complete implementation of the Document Object Model Level 3 Core and Load/Save W3C Recommendations and provides a complete implementation of the XML Inclusions (XInclude) W3C Recommendation. It also provides support for OASIS XML Catalogs v1.1. Xerces 2.x introduced the Xerces Native Interface (XNI), a complete framework for building parser components and configurations that is extremely modular and easy to program. XNI is merely an internal set of interfaces. There is no need for an XML application programmer to learn XNI if they only intend to interface to the Xerces2 parser using standard interfaces like JAXP, DOM, and SAX. Xerces developers and application developers that need more power and flexibility than that provided by the standard interfaces should read and understand XNI. The latest Xerces-J version released is, 2.12.2.", "members": [], "x": 230.4, "y": -178.4}, {"i": 199, "name": "Xerces Perl", "kind": "tick", "lines": [5], "desc": "XML::Xerces is the Perl API to the Apache project's Xerces XML parser. It is implemented using the Xerces C++ API, and it provides access to most of the C++ API from Perl. Because it is based on Xerces-C, XML::Xerces provides a validating XML parser that makes it easy to give your application the ability to read and write XML data. Classes are provided for parsing, generating, manipulating, and validating XML documents. XML::Xerces is faithful to the XML 1.0 and 1.1 recommendations and associated standards (DOM levels 1, 2, and 3, SAX 1 and 2, Namespaces, and W3C XML Schema). The parser provides high performance, modularity, and scalability, and provides full support for Unicode. XML::Xerces implements the vast majority of the Xerces-C API (if you notice any discrepancies please mail the list). The exception is some functions in the C++ API which either have better Perl counterparts (such as file I/O) or which manipulate internal C++ information that has no role in the Perl module. The majority of the API is created automatically using Simplified Wrapper Interface Generator (SWIG). However, care has been taken to make most method invocations natural to perl programmers, so a number of rough C++ edges have been smoothed over (See the Special Perl API Features section).", "members": [], "x": 386.4, "y": -208.0}, {"i": 200, "name": "XG Commons", "kind": "tick", "lines": [5], "desc": "Apache XML Graphics Commons is a library that consists of several reusable components used by Apache Batik and Apache FOP. Many of these components can easily be used separately outside the domains of SVG and XSL-FO. You will find components such as a PDF library, an RTF library, Graphics2D implementations that let you generate PDF and PostScript files and much more.", "members": [], "x": 455.0, "y": 65.0}, {"i": 201, "name": "XML Commons Ext", "kind": "tick", "lines": [5], "desc": "The External components portion of Apache XML Commons contains interfaces that are defined by external standards organizations. For DOM, that's the W3C; for SAX it's David Megginson (http://www.saxproject.org); for JAXP it's Sun. While we could send users to each of the primary sources for these deliverables, keeping our own versions of these in the XML Commons repository gives us a number of advantages: 1) Simplicity of downloads; users get the whole product from one place, 2) Better version control; we can only take fixes we want and add Apache-specific changes, 3) Better overview documentation of how these interfaces fit into the XML processing world, 4) More chance for cross-project community building within Apache projects.", "members": [], "x": 330.8, "y": -208.0}, {"i": 202, "name": "XML Commons Res", "kind": "tick", "lines": [5], "desc": "The XML Commons Resolver can be used in a wide variety of XML parsing, processing and related programs to resolve various public or system identifiers into accessible URLs for use by your application. The resolver supports several catalog types for mapping, including OASIS XML, OASIS TR 9401 and XCatalog styles.", "members": [], "x": 455.0, "y": -91.0}, {"i": 203, "name": "XMLBeans", "kind": "tick", "lines": [5], "desc": "XMLBeans is a tool that allows you to access the full power of XML in a Java friendly way. The idea is that you can take advantage of the richness and features of XML and XML Schema and have these features mapped as naturally as possible to the equivalent Java language and typing constructs. XMLBeans uses XML Schema to compile Java interfaces and classes that you can then use to access and modify XML instance data. Using XMLBeans is similar to using any other Java interface/class, you will see things like getFoo or setFoo just as you would expect when working with Java. While a major use of XMLBeans is to access your XML instance data with strongly typed Java classes there are also API's that allow you access to the full XML infoset (XMLBeans keeps XML Infoset fidelity) as well as to allow you to reflect into the XML schema itself through an XML Schema Object model. For more details on XMLBeans see the XMLBeans Wiki pages or the XMLBeans documentation (the Documentation tab on this website). What Makes XMLBeans Different There are at least two major things that make XMLBeans unique from other XML-Java binding options. 1. Full XML Schema support. XMLBeans fully supports XML Schema and the corresponding java classes provide constructs for all of the major functionality of XML Schema. This is critical since often times you do not have control over the features of XML Schema that you need to work with in Java. Also, XML Schema oriented applications can take full advantage of the power of XML Schema and not have to restrict themselvs to a subset. 2. Full XML Infoset fidelity.When unmarshalling an XML instance the full XML infoset is kept and is available to the developer. This is critical because because of the subset of XML that is not easily represented in java. For example, order of the elements or comments might be needed in a particular application. A major objective of XMLBeans has been to be applicable in all non-streaming (in memory) XML programming situations. You should be able to compile your XML Schema into a set of java classes and know that 1) you will be able to use XMLBeans for all of the schemas you encounter (even the warped ones) and 2) that you will be able to get to the XML at whatever level is necessary - and not have to resort to multple tools to do this. To accomplish this XMLBeans provides three major APIs: * XmlObject The java classes that are generated from an XML Schema are all derived from XmlObject. These provide strongly typed getters and setters for each of the elements within the defined XML. Complex types are in turn XmlObjects. For example getCustomer might return a CustomerType (which is an XmlObject). Simple types turn into simple getters and setters with the correct java type. For example getName might return a String. * XmlCursor From any XmlObject you can get an XmlCursor. This provides efficient, low level access to the XML Infoset. A cursor represents a position in the XML instance. You can move the cursor around the XML instance at any level of granularity you need from individual characters to Tokens. * SchemaType XMLBeans provides a full XML Schema object model that you can use to reflect on the underlying schema meta information. For example, you might want to generate a sample XML instance for an XML schema or perhaps find the enumerations for an element so that you can display them. All of this was built with performance in mind. Informal benchmarks and user feedback indicate that XMLBeans is extremely fast.", "members": [], "x": 455.0, "y": -39.0}, {"i": 204, "name": "XMLSchema", "kind": "tick", "lines": [5], "desc": "Apache XMLSchema is a lightweight Java object model that can be used to manipulate and generate XML schema representations.", "members": [], "x": 455.0, "y": 13.0}, {"i": 205, "name": "Yetus", "kind": "hub", "lines": [1, 7], "desc": "A collection of libraries and tools that enable contribution and release processes for software projects.", "members": [], "x": -52.0, "y": 351.0}, {"i": 206, "name": "YuniKorn", "kind": "tick", "lines": [8], "desc": "A light-weight universal resource scheduler for container orchestrator systems.", "members": [], "x": -437.5, "y": 346.5}, {"i": 207, "name": "Zeppelin", "kind": "tick", "lines": [0], "desc": "Zeppelin is a modern web-based tool for the data scientists to collaborate over large-scale data exploration and visualization projects.", "members": [], "x": -819.9, "y": 286.5}, {"i": 208, "name": "ZooKeeper", "kind": "tick", "lines": [3], "desc": "Apache ZooKeeper is an effort to develop and maintain an open-source server which enables highly reliable distributed coordination.", "members": [], "x": -658.9, "y": -329.1}], "stats": {"stations": 209, "hubs": 57, "crossings": 5, "void": 4.39, "longest_run": 5.6, "labels_overlapping": 0, "aspect": 1.31, "score": 3977.3}} (JSON) <svg xmlns="http://www.w3.org/2000/svg" class="map" role="img" aria-label="The Apache Projects Underground" viewBox="-1078.2 -772.5 1900.3 1658.7" font-family="Johnston, 'Gill Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">

<style>
:root {
  --bg: #ffffff; --fg: #1c1c1c; --mute: #5f6670; --panel: #ffffff;
  --rule: #d9dde3; --accent: #0019A8; --chip: #eef1f5; --shadow: 0 4px 18px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --fg: #eef0f3; --mute: #a0a9b4; --panel: #1d2128;
    --rule: #2c323b; --accent: #8aa6ff; --chip: #262c35; --shadow: 0 4px 18px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center;
  padding: .6rem 16px; border-bottom: 1px solid var(--rule); background: var(--panel);
}
header h1 { margin: 0; font-size: 1.1rem; color: var(--accent); white-space: nowrap; }
header .sub { color: var(--mute); font-size: .85rem; flex: 1 1 14rem; }
.tools { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
input[type=search] {
  font: inherit; padding: .35rem .6rem; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--bg); color: var(--fg); width: 15rem; max-width: 60vw;
}
input[type=search]:focus-visible, button:focus-visible, .chip:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
button {
  font: inherit; padding: .3rem .65rem; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--chip); color: var(--fg); cursor: pointer;
}
button:hover { border-color: var(--accent); }

main { position: relative; flex: 1 1 auto; min-height: 0; }
#stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage svg { width: 100%; height: 100%; display: block; }

/* ---- map styling: these rules override the SVG's inline defaults ---- */
.map .bg { fill: var(--bg); }
.map .ttl { fill: var(--accent); }
.map .sub, .map .foot, .map .legtxt .n { fill: var(--mute); }
.map .rule { stroke: var(--rule); }
.map .tick { stroke: var(--fg); }
.map .hub { fill: var(--bg); stroke: var(--fg); }
.map .halo { fill: var(--bg); stroke: var(--bg); }
.map .fg, .map .legtxt { fill: var(--fg); }

.map .line, .map .st, .map .lbl, .map .leg { transition: opacity .15s, stroke-width .1s; }
.map .line { cursor: pointer; }
.map .st, .map .lbl { cursor: pointer; }
.map .leg { cursor: pointer; }
.map .leg.off { opacity: .35; }
.map .dim { opacity: .12; }
.map .st:hover { stroke-width: 4.2; }
.map .hub:hover { stroke: var(--accent); }
.map .tick:hover { stroke: var(--accent); }
.map .sel.hub, .map .sel.tick { stroke: var(--accent); stroke-width: 4.6; }
.map .match.hub, .map .match.tick { stroke: var(--accent); stroke-width: 4.2; }
.map .term:hover { stroke: var(--accent); }
.map .sel.term, .map .match.term { stroke: var(--accent); }
.map .box { fill: #fff; }
.map .fg.sel, .map .fg.match { font-weight: bold; fill: var(--accent); }

/* ---- floating tooltip + detail panel ---- */
#tip {
  position: fixed; z-index: 5; pointer-events: none; max-width: 22rem;
  background: var(--panel); color: var(--fg); border: 1px solid var(--rule);
  border-radius: 8px; padding: .5rem .7rem; box-shadow: var(--shadow); font-size: .85rem;
  opacity: 0; transition: opacity .1s;
}
#tip.on { opacity: 1; }
#tip b { display: block; font-size: .95rem; }
#tip .d { color: var(--mute); margin-top: .25rem; }

#panel {
  position: absolute; z-index: 4; top: 12px; right: 12px; width: 21rem; max-width: calc(100% - 24px);
  max-height: calc(100% - 24px); overflow: auto;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
  padding: .8rem .95rem; box-shadow: var(--shadow);
}
#panel h2 { margin: 0 0 .15rem; font-size: 1.15rem; }
#panel .kind { color: var(--mute); font-size: .8rem; margin-bottom: .5rem; }
#panel p { margin: .5rem 0 0; font-size: .88rem; }
#panel .members { color: var(--mute); font-size: .82rem; margin-top: .5rem; }
#panel .help { color: var(--mute); font-size: .85rem; margin: 0; }
#panel .x { float: right; padding: 0 .45rem; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
.chip {
  border: 1px solid var(--rule); border-radius: 999px; padding: .1rem .6rem .1rem .35rem;
  font-size: .8rem; display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
  background: var(--chip); color: var(--fg);
}
.chip i { width: 14px; height: 7px; border-radius: 4px; display: inline-block; }
.chip.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
footer { padding: .3rem 16px; font-size: .75rem; color: var(--mute); border-top: 1px solid var(--rule); background: var(--panel); }

@media (max-width: 640px) {
  #panel { top: auto; bottom: 8px; right: 8px; left: 8px; width: auto; max-height: 45%; }
  header .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { .map * { transition: none !important; } }
</style>
</head>

<script id="map-data" type="application/json">{"title": "The Apache Projects Underground", "subtitle": "Top-level projects by area  ·  data: projects.apache.org  ·  option: london", "lines": [{"name": "Big Data", "color": "#E32017", "count": 55}, {"name": "Libraries", "color": "#0019A8", "count": 49}, {"name": "Networking", "color": "#00782A", "count": 50}, {"name": "Data Stores", "color": "#9B0056", "count": 33}, {"name": "Frameworks", "color": "#FFD300", "count": 25}, {"name": "XML & Graphics", "color": "#B36305", "count": 25}, {"name": "Content & Search", "color": "#0098D4", "count": 23}, {"name": "Build & Test", "color": "#8A9199", "count": 18}, {"name": "Cloud & IoT", "color": "#EE7C0E", "count": 17}], "stations": [{"i": 0, "name": "Accumulo", "kind": "tick", "lines": [0], "desc": "The Apache Accumulo sorted, distributed key/value store is based on Google's BigTable design. It is built on top of Apache Hadoop, Apache Zookeeper, and Apache Thrift. It features a few novel improvements on the BigTable design in the form of cell-level access labels and a server-side programming mechanism that can modify key/value pairs at various points in the data management process.", "members": [], "x": -291.4, "y": -683.2}, {"i": 1, "name": "ActiveMQ", "kind": "tick", "lines": [2], "desc": "ActiveMQ is a fast and powerful Message Broker which supports many Cross Language Clients and Protocols and many advanced features while fully supporting JMS 1.1 and J2EE 1.4.", "members": [], "x": 728.0, "y": 104.0}, {"i": 2, "name": "AGE", "kind": "tick", "lines": [3], "desc": "The goal of Apache AGE™ is to provide graph data processing and analytics capability to all relational databases. Through Apache AGE, PostgreSQL users will gain access to graph query modeling within the existing relational database.", "members": [], "x": -381.1, "y": -277.1}, {"i": 3, "name": "Airavata", "kind": "hub", "lines": [0, 2, 8], "desc": "Apache Airavata is a micro-service architecture based software framework for executing and managing computational jobs and workflows on distributed computing resources including local clusters, supercomputers, national grids, academic and commercial clouds. Airavata is dominantly used to build Web-based science gateways and assist to compose, manage, execute, and monitor large scale applications (wrapped as Web services) and workflows composed of these services.", "members": [], "x": -39.0, "y": -247.0}, {"i": 4, "name": "Airflow", "kind": "tick", "lines": [0], "desc": "The mission of Apache Airflow is the creation and maintenance of software related to workflow automation and scheduling that can be used to author and manage data pipelines.", "members": [], "x": -328.2, "y": -646.5}, {"i": 5, "name": "Allura", "kind": "tick", "lines": [6], "desc": "Apache Allura is an open source implementation of a software \"forge\", a web site that manages source code repositories, bug reports, discussions, wiki pages, blogs and more for any number of individual projects.", "members": [], "x": -156.0, "y": -260.0}, {"i": 6, "name": "Ambari", "kind": "tick", "lines": [0], "desc": "Apache Ambari simplifies provisioning, managing, and monitoring of Apache Hadoop clusters.", "members": [], "x": -364.9, "y": -609.7}, {"i": 7, "name": "Anakia", "kind": "tick", "lines": [1], "desc": "Anakia is an XML transformation tool that uses JDOM and Velocity to transform XML documents into the format of your choice. It provides an alternative to using Ant's style task and XSL to process XML files.", "members": [], "x": 602.1, "y": 4.1}, {"i": 8, "name": "Annotator", "kind": "tick", "lines": [6], "desc": "Apache Annotator is a collaborative community for creating annotation related code which works to provide a future for Annotator.js-based projects and plugins while enabling W3C spec-compliant Web Annotation in Web browsers, Web Publication readers, and the servers that serve them.", "members": [], "x": -104.0, "y": -260.0}, {"i": 9, "name": "Ant", "kind": "tick", "lines": [7], "desc": "Apache Ant is a Java-based build tool.", "members": [], "x": -414.7, "y": 479.7}, {"i": 10, "name": "AntUnit", "kind": "tick", "lines": [7], "desc": "The Ant Library provides Ant tasks for testing Ant task, it can also be used to drive functional and integration tests of arbitrary applications with Ant.", "members": [], "x": -377.9, "y": 442.9}, {"i": 11, "name": "APR", "kind": "tick", "lines": [1], "desc": "The mission of the Apache Portable Runtime (APR) project is to create and maintain software libraries that provide a predictable and consistent interface to underlying platform-specific implementations. The primary goal is to provide an API to which software developers may code and be assured of predictable if not identical behaviour regardless of the platform on which their software is built, relieving them of the need to code special-case conditions to work around or take advantage of platform-specific deficiencies or features.", "members": [], "x": 565.3, "y": -32.7}, {"i": 12, "name": "Aries", "kind": "tick", "lines": [1], "desc": "The Aries project is delivering a set of pluggable Java components enabling an enterprise OSGi application programming model. This includes implementations and extensions of application-focused specifications defined by the OSGi Alliance Enterprise Expert Group (EEG) and an assembly format for multi-bundle applications, for deployment to a variety of OSGi based runtimes.", "members": [], "x": 528.5, "y": -69.5}, {"i": 13, "name": "Arrow", "kind": "hub", "lines": [0, 1, 2, 3], "desc": "Apache Arrow defines a language-independent columnar memory format for flat and nested data, organized for efficient analytic operations on modern hardware like CPUs and GPUs. The Arrow memory format also supports zero-copy reads for lightning-fast data access without serialization overhead. Arrow's libraries implement the format and provide building blocks for a range of use cases, including high performance analytics. Many popular projects use Arrow to ship columnar data efficiently or as the basis for analytic engines. Libraries are available for C, C++, C#, Go, Java, JavaScript, Julia, MATLAB, Python, R, Ruby, and Rust. Apache Arrow is software created by and for the developer community. We are dedicated to open, kind communication and consensus decision making. Our committers come from a range of organizations and backgrounds, and we welcome all to participate with us.", "members": [], "x": -234.0, "y": -130.0}, {"i": 14, "name": "Avro", "kind": "hub", "lines": [0, 1, 2], "desc": "Apache Avro is a data serialization system.", "members": [], "x": -169.0, "y": -156.0}, {"i": 15, "name": "Axiom", "kind": "hub", "lines": [1, 5], "desc": "Apache Axiom is a StAX-based, XML Infoset compliant object model which supports on-demand building of the object tree. It supports a novel \"pull-through\" model which allows one to turn off the tree building and directly access the underlying pull event stream. It also has built in support for XML Optimized Packaging (XOP) and MTOM, the combination of which allows XML to carry binary data efficiently and in a transparent manner. The combination of these is an easy to use API with a very high performant architecture!", "members": [], "x": -130.0, "y": 52.0}, {"i": 16, "name": "Axis2", "kind": "hub", "lines": [2, 5], "desc": "Apache Axis2 is a toolkit for creating and using Web Services, including SOAP, MTOM, XML/HTTP and advanced WS-* standards such as WSRM and WSSecurity. Axis2 includes a very fast runtime engine, together with tooling support for WSDL and WS-Policy, and plugin support for WS-Addressing, WS-ReliableMessaging, WS-Security, WS-Eventing, WS-Transactions, WS-Trust and WS-SecureConversation. Axis2 runs either standalone or hosted in Tomcat or other servlet containers.", "members": [], "x": 104.0, "y": -104.0}, {"i": 17, "name": "Batik", "kind": "tick", "lines": [5], "desc": "Batik is a Java-based toolkit for applications or applets to use images in the Scalable Vector Graphics (SVG) format for various purposes, such as display, generation and manipulation.", "members": [], "x": -507.0, "y": -78.0}, {"i": 18, "name": "Beam", "kind": "tick", "lines": [0], "desc": "Apache Beam is a unified programming model for both batch and streaming data processing, enabling efficient execution across diverse distributed execution engines and providing extensibility points for connecting to different technologies and user communities.", "members": [], "x": -383.3, "y": -565.3}, {"i": 19, "name": "Bigtop", "kind": "tick", "lines": [0], "desc": "Bigtop is a project for the development of packaging and tests of the Apache Hadoop ecosystem. The primary goal of Bigtop is to build a community around the packaging and interoperability testing of Hadoop-related projects. This includes testing at various levels (packaging, platform, runtime, upgrade, etc...) developed by a community with a focus on the system as a whole, rather than individual projects. In short we strive to be for Hadoop what Debian is to Linux.", "members": [], "x": -383.3, "y": -513.3}, {"i": 20, "name": "BookKeeper", "kind": "tick", "lines": [0], "desc": "BookKeeper is a reliable replicated log service. It can be used to turn any standalone service into a highly available replicated service. BookKeeper is highly available (no single point of failure), and scales horizontally as more storage nodes are added.", "members": [], "x": -383.3, "y": -461.3}, {"i": 21, "name": "Brooklyn", "kind": "tick", "lines": [8], "desc": "Brooklyn is about deploying and managing applications: composing a full stack for an application; deploying to cloud and non-cloud targets; using monitoring tools to collect key health/performance metrics; responding to situations such as a failing node; and adding or removing capacity to match demand.", "members": [], "x": -195.0, "y": -247.0}, {"i": 22, "name": "bRPC", "kind": "tick", "lines": [1], "desc": "bRPC is an Industrial-grade RPC framework using C++ Language, which is often used in high performance system such as Search, Storage, Machine learning, Advertisement, Recommendation etc. \"bRPC\" means \"better RPC\".", "members": [], "x": 491.8, "y": -106.2}, {"i": 23, "name": "BVal", "kind": "hub", "lines": [1, 4], "desc": "The goal of the Apache BVal project is to deliver an implementation of the Java Bean Validation Specfication (JSR303/346) which is TCK compliant and works on Java SE 6 or later. The initial codebase for the project was donated to the ASF by a SGA from Agimatec GmbH and uses the Apache Software License v2.0.", "members": [], "x": 403.0, "y": 117.0}, {"i": 24, "name": "Calcite", "kind": "hub", "lines": [0, 3], "desc": "Calcite is a framework for writing data management systems. It converts queries, represented in relational algebra, into an efficient executable form using pluggable query transformation rules. There is an optional SQL parser and JDBC driver. Calcite does not store data or have a preferred execution engine. Data formats, execution algorithms, planning rules, operator types, metadata, and cost model are added at runtime as plugins.", "members": [], "x": -676.0, "y": -130.0}, {"i": 25, "name": "Camel", "kind": "hub", "lines": [1, 2, 8], "desc": "Apache Camel is an open source integration framework with 350+ connectors. Write routes in Java, YAML, or XML. Run on Spring Boot, Quarkus, or standalone. Apache License 2.0.", "members": [], "x": -91.0, "y": -52.0}, {"i": 26, "name": "CarbonData", "kind": "tick", "lines": [0], "desc": "Apache CarbonData is a new big data file format for faster interactive query using advanced columnar storage, index, compression and encoding techniques to improve computing efficiency, which helps in speeding up queries by an order of magnitude faster over PetaBytes of data.", "members": [], "x": -364.9, "y": -416.9}, {"i": 27, "name": "Cassandra", "kind": "tick", "lines": [3], "desc": "Linear scalability and proven fault-tolerance on commodity hardware or cloud infrastructure make Apache Cassandra the perfect platform for mission-critical data. Cassandra's support for replicating across multiple datacenters is best-in-class. Cassandra is in use at Netflix, Twitter, Urban Airship, Constant Contact, Reddit, Cisco, OpenX, Digg, CloudKick, Ooyala, and more companies that have large, active data sets. Cassandra provides full Hadoop integration, including with Pig and Hive.", "members": [], "x": -344.3, "y": -240.3}, {"i": 28, "name": "Causeway", "kind": "tick", "lines": [4], "desc": "Apache Causeway is a framework for rapidly developing domain-driven apps in Java. Write your business logic in entities, domain services and repositories, and the framework dynamically (at runtime) generates a representation of that domain model as a webapp, RESTful or GraphQL API. For prototyping or production.", "members": [], "x": 108.1, "y": 251.1}, {"i": 29, "name": "Cayenne", "kind": "hub", "lines": [1, 2, 3, 4, 5], "desc": "Cayenne is a powerful, full-featured, opensource framework created for developers working with relational databases. it seamlessly maps any relational database to Java objects, reducing development time and adding considerable functionality to any application which requires a database. Developers using Cayenne will be able to concentrate on the core business requirements and the data model instead of the SQL details. The application can then be easily moved to any JDBC-capable database. In addition to management of persistent Java objects mapped to relational databases, Cayenne provides a plethora of features including single method call queries and updates (including atomic updates of all modified objects), seamless integration of multiple databases into a single virtual data source, three tier persistence with caching on the remote client, paging of results, record locking, and many more features.", "members": [], "x": 13.0, "y": 26.0}, {"i": 30, "name": "Celix", "kind": "tick", "lines": [2], "desc": "Apache Celix is a framework for C, C++14 and C++17 to develop dynamic modular software applications using component and in-process service-oriented programming. Apache Celix is inspired by the OSGi specification adapted for C and C++.", "members": [], "x": 676.0, "y": 104.0}, {"i": 31, "name": "Chainsaw", "kind": "tick", "lines": [2], "desc": "Apache Chainsaw is a GUI log viewer.", "members": [], "x": 210.2, "y": 49.8}, {"i": 32, "name": "CloudStack", "kind": "tick", "lines": [8], "desc": "Apache CloudStack is open source software designed to deploy and manage large networks of virtual machines, as a highly available, highly scalable Infrastructure as a Service (IaaS) cloud computing platform. CloudStack is used by a number of service providers to offer public cloud services, and by many companies to provide an on-premises (private) cloud offering, or as part of a hybrid cloud solution. CloudStack is a turnkey solution that includes the entire \"stack\" of features most organizations want with an IaaS cloud: compute orchestration, Network-as-a-Service, user and account management, a full and open native API, resource accounting, and a first-class User Interface (UI). CloudStack currently supports the most popular hypervisors: VMware, KVM, XenServer and Xen Cloud Platform (XCP). Users can manage their cloud with an easy to use Web interface, command line tools, and / or a full-featured RESTful API. In addition, CloudStack provides an API that's compatible with AWS EC2 and S3 for organizations that wish to deploy hybrid clouds.", "members": [], "x": -143.0, "y": -247.0}, {"i": 33, "name": "Commons", "kind": "hub", "lines": [1, 2], "desc": "", "members": ["Commons BCEL", "Commons BeanUtils", "Commons BSF", "Commons Chain (Dormant)", "Commons CLI", "Commons Codec", "Commons Collections", "Commons Compress", "Commons Configuration", "Commons Crypto", "Commons CSV", "Commons Daemon", "Commons DBCP", "Commons DbUtils", "Commons Digester", "Commons Email", "Commons Exec", "Commons FileUpload", "Commons Functor (Dormant)", "Commons Geometry", "Commons HttpClient", "Commons Imaging", "Commons IO", "Commons JCI", "Commons JCS", "Commons Jelly", "Commons JEXL", "Commons JXPath", "Commons Lang", "Commons Logging", "Commons Math", "Commons Net", "Commons Numbers", "Commons OGNL (Dormant)", "Commons Pool", "Commons Proxy (Dormant)", "Commons RDF", "Commons RNG", "Commons SCXML", "Commons Statistics", "Commons Text", "Commons Validator", "Commons VFS", "Commons Weaver"], "x": 650.0, "y": -78.0}, {"i": 34, "name": "Compress Ant", "kind": "tick", "lines": [7], "desc": "This is a library of Ant tasks and types uses Apache Commons Compress to support additional archive formats like ar, pack200, xz and cpio.", "members": [], "x": -341.2, "y": 406.2}, {"i": 35, "name": "Cordova", "kind": "hub", "lines": [1, 2], "desc": "Apache Cordova is a tool to create cross-platform apps from standard web technologies (HTML, CSS, and JavaScript). Its primary purpose is to provide a bridge for native device API access and to bundle for distribution.", "members": [], "x": 624.0, "y": -143.0}, {"i": 36, "name": "CouchDB", "kind": "hub", "lines": [0, 2, 3, 6, 8], "desc": "Apache CouchDB is a database that completely embraces the web. Store your data with JSON documents. Access your documents with your web browser, via HTTP. Query, combine, and transform your documents with JavaScript. Apache CouchDB works well with modern web and mobile apps. CouchDB's killer feature is its ability to distribute data efficiently using Apache CouchDB’s incremental replication. Apache CouchDB supports master-master setups with automatic conflict detection.", "members": [], "x": -78.0, "y": -130.0}, {"i": 37, "name": "cTAKES", "kind": "hub", "lines": [1, 6], "desc": "Apache clinical Text Analysis and Knowledge Extraction System (cTAKES) is an open-source natural language processing system for information extraction from electronic medical record clinical free-text. It processes clinical notes, identifying types of clinical named entities from various dictionaries including the Unified Medical Language System (UMLS) - medications, diseases/disorders, signs/symptoms, anatomical sites and procedures. Each named entity has attributes for the text span, the ontology mapping code, subject (patient, family member, etc.) and context (negated/not negated, conditional, generic, degree of certainty). Some of the attributes are expressed as relations, for example the location of a clinical condition (locationOf relation) or the severity of a clinical condition (degreeOf relation).", "members": [], "x": -52.0, "y": 234.0}, {"i": 38, "name": "Curator", "kind": "tick", "lines": [3], "desc": "Apache Curator is a Java/JVM client library for Apache ZooKeeper, a distributed coordination service. It includes a highlevel API framework and utilities to make using Apache ZooKeeper much easier and more reliable. It also includes recipes for common use cases and extensions such as service discovery and a Java 8 asynchronous DSL.", "members": [], "x": -307.5, "y": -203.5}, {"i": 39, "name": "CXF", "kind": "hub", "lines": [1, 2, 5], "desc": "Apache CXF is an open source services framework. CXF helps you build and develop services using frontend programming APIs like JAX-WS and JAX-RS. These services can speak a variety of protocols such as SOAP, XML/HTTP, RESTful HTTP, or CORBA and work over a variety of transports such as HTTP, JMS or JBI.", "members": [], "x": 442.0, "y": -208.0}, {"i": 40, "name": "CycloneDX Ant", "kind": "tick", "lines": [7], "desc": "Provides support for the creation of CycloneDX SBOMs.", "members": [], "x": -304.4, "y": 369.4}, {"i": 41, "name": "Daffodil", "kind": "hub", "lines": [0, 1, 5], "desc": "Apache Daffodil is an open-source implementation of the DFDL specification that uses DFDL data descriptions to parse fixed format data into an infoset. This infoset is commonly converted into XML or JSON to enable the use of well-established XML or JSON technologies and libraries to consume, inspect, and manipulate fixed format data in existing solutions. Daffodil is also capable of serializing or \"unparsing\" data back to the original data format. The DFDL infoset can also be converted directly to/from the data structures carried by data processing frameworks so as to bypass any XML/JSON overheads.", "members": [], "x": -299.0, "y": -78.0}, {"i": 42, "name": "DataFu", "kind": "tick", "lines": [0], "desc": "Apache DataFu consists of two libraries: Apache DataFu Pig is a collection of useful user-defined functions for data analysis in Apache Pig. Apache DataFu Hourglass is a library for incrementally processing data using Apache Hadoop MapReduce. This library was inspired by the prevelance of sliding window computations over daily tracking data. Computations such as these typically happen at regular intervals (e.g. daily, weekly), and therefore the sliding nature of the computations means that much of the work is unnecessarily repeated. DataFu's Hourglass was created to make these computations more efficient, yielding sometimes 50-95% reductions in computational resources.", "members": [], "x": -328.2, "y": -380.2}, {"i": 43, "name": "DataFusion", "kind": "hub", "lines": [0, 1, 3], "desc": "Apache DataFusion is a fast, extensible query engine for building high-quality data-centric systems in Rust, using the Apache Arrow in-memory format. Python Bindings are also available. DataFusion offers SQL and Dataframe APIs, excellent performance, built-in support for CSV, Parquet, JSON, and Avro, extensive customization, and a great community.", "members": [], "x": -351.0, "y": 65.0}, {"i": 44, "name": "DataSketches", "kind": "hub", "lines": [0, 1], "desc": "In the analysis of big data there are often problem queries that don’t scale because they require huge compute resources and time to generate exact results. Examples include count distinct, quantiles, distribution analysis, most-frequent items, joins, matrix computations, and graph analysis. If approximate results are acceptable, there is a class of specialized algorithms, called streaming algorithms, or sketches, that can produce results orders-of magnitude faster and with mathematically proven error bounds. For interactive queries there may not be other viable alternatives, and in the case of real-time analysis, sketches are the only known solution.", "members": [], "x": -312.0, "y": 117.0}, {"i": 45, "name": "DeltaSpike", "kind": "tick", "lines": [4], "desc": "Apache DeltaSpike is a suite of portable CDI (Contexts & Dependency Injection) extensions intended to make application development easier when working with CDI and Java EE. Some of its key features include: - A core runtime that supports component configuration, type safe messaging and internationalization, and exception handling. - A suite of utilities to make programmatic bean lookup easier. - A plugin for Java SE to bootstrap both JBoss Weld and Apache OpenWebBeans outside of a container. - JSF integration, including backporting of JSF 2.2 features for Java EE 6. - JPA integration and transaction support. - A Data module, to create an easy to use repository pattern on top of JPA. - Quartz integration Testing support is also provided, to allow you to do low level unit testing of your CDI enabled projects.", "members": [], "x": 546.0, "y": 195.0}, {"i": 46, "name": "Derby", "kind": "tick", "lines": [3], "desc": "Apache Derby is an open source relational database implemented entirely in Java. It has a small footprint that makes it easy to embed in any Java-based application, but it also supports the more familiar client/server mode. It is based on the Java, JDBC, and SQL standards, making code developed more portable to standards-compliant databases. The developer community voted to retire the project and move it into a read-only mode as of 2025-10-10. See https://lists.apache.org/thread/q7xnvbyo818vvtyh2b5oljr8won4zjx7", "members": [], "x": -270.8, "y": -166.8}, {"i": 47, "name": "Directory LDAP", "kind": "tick", "lines": [2], "desc": "The Apache Directory LDAP API is an ongoing effort to provide an enhanced LDAP API, as a replacement for JNDI and the existing LDAP API (jLdap and Mozilla LDAP API).", "members": [], "x": 173.5, "y": 86.5}, {"i": 48, "name": "Directory Server", "kind": "tick", "lines": [2], "desc": "ApacheDS is an extensible and embeddable directory server entirely written in Java, which has been certified LDAPv3 compatible by the Open Group. It has been designed to introduce triggers, stored procedures, queues and views to the world of LDAP which has lacked these rich constructs.", "members": [], "x": 624.0, "y": 104.0}, {"i": 49, "name": "Directory Studio", "kind": "tick", "lines": [2], "desc": "Apache Directory Studio is a complete directory tooling platform intended to be used with any LDAP server however it is particularly designed for use with ApacheDS. It is an Eclipse RCP application, composed of several Eclipse (OSGi) plugins, that can be easily upgraded with additional ones. These plugins can even run within Eclipse itself.", "members": [], "x": 136.7, "y": 123.3}, {"i": 50, "name": "Doris", "kind": "tick", "lines": [3], "desc": "Apache Doris is an easy-to-use, high-performance and real-time analytical database based on MPP architecture, known for its extreme speed and ease of use. It only requires a sub-second response time to return query results under massive data and can support not only high-concurrent point query scenarios but also high-throughput complex analysis scenarios. All this makes Apache Doris an ideal tool for scenarios including report analysis, ad-hoc query, unified data warehouse, and data lake query acceleration. On Apache Doris, users can build various applications, such as user behavior analysis, AB test platform, log retrieval analysis, user portrait analysis, and order analysis.", "members": [], "x": -182.0, "y": -130.0}, {"i": 51, "name": "Drill", "kind": "tick", "lines": [0], "desc": "Apache Drill is a distributed MPP query layer that supports SQL and alternative query languages against NoSQL and Hadoop data storage systems. It was inspired in part by Google's Dremel.", "members": [], "x": -291.4, "y": -343.4}, {"i": 52, "name": "Druid", "kind": "hub", "lines": [0, 3], "desc": "Apache Druid is a high performance real-time analytics database. Druid's main value add is to reduce time to insight and action. Apache Druid is designed for workflows where fast queries and ingest really matter. Druid excels at powering UIs, running operational (ad-hoc) queries, or handling high concurrency. Consider Druid as an open source alternative to data warehouses for a variety of use cases.", "members": [], "x": -611.0, "y": -91.0}, {"i": 53, "name": "ECharts", "kind": "hub", "lines": [1, 6], "desc": "Apache ECharts is a free, powerful charting and visualization library offering easy ways to add intuitive, interactive, and highly customizable charts to your commercial products. It is written in pure JavaScript and based on zrender, which is a whole new lightweight canvas library.", "members": [], "x": 13.0, "y": 286.0}, {"i": 54, "name": "Empire-db", "kind": "tick", "lines": [3], "desc": "Apache Empire-db is intended for developers who strive to have full SQL freedom when formulating queries and DML-Statements - without ever having to use string literals - and who also want to be able to control when and how statements are executed. Unlike other approaches Empire-db does not rely on Java Annotations or Mapping-files for building queries but rather uses a Java Object model that is easy to access and extend. For Data Access and Data Interchange developers can choose between traditional Java Beans and a more sophisticated dynamic interface provided by Record and DataListEntriy classes. Empire-db is DBMS vendor independent and provides handlers for Oracle, Microsoft SQLServer, PostgreSQL, MySQL, HsqlDB, Derby, H2 and more.", "members": [], "x": -130.0, "y": -130.0}, {"i": 55, "name": "EventMesh", "kind": "tick", "lines": [8], "desc": "EventMesh is a new generation serverless event middleware for building distributed event-driven applications.", "members": [], "x": -91.0, "y": -247.0}, {"i": 56, "name": "Felix", "kind": "tick", "lines": [2], "desc": "OSGi framework implementation and related technologies.", "members": [], "x": 572.0, "y": 104.0}, {"i": 57, "name": "Flex", "kind": "tick", "lines": [4], "desc": "Apache Flex® is a highly productive, open source application framework for building and maintaining expressive web applications that deploy consistently on all major browsers, desktops and devices (including smartphones, tablets and tv). It provides a modern, standards-based language and programming model that supports common design patterns suitable for developers from many backgrounds. Flex applications can be deployed to the ubiquitous Adobe® Flash® Player in the browser, Adobe® AIR™ on desktop and mobile or to native Android™, IOS™, QNX®, Windows® or Mac® applications.", "members": [], "x": 71.3, "y": 214.3}, {"i": 58, "name": "Flink", "kind": "tick", "lines": [0], "desc": "Flink is an open source system for expressive, declarative, fast, and efficient data analysis. It combines the scalability and programming flexibility of distributed MapReduce-like platforms with the efficiency, out-of-core execution, and query optimization capabilities found in parallel databases.", "members": [], "x": -247.0, "y": -325.0}, {"i": 59, "name": "Flume", "kind": "tick", "lines": [0], "desc": "Apache Flume is a distributed, reliable, and available system for efficiently collecting, aggregating and moving large amounts of log data from many different sources to a centralized data store", "members": [], "x": -195.0, "y": -325.0}, {"i": 60, "name": "Fluo", "kind": "tick", "lines": [0], "desc": "Apache Fluo is a distributed processing system that lets users make incremental updates to large data sets. With Apache Fluo, users can set up workflows that execute cross node transactions when data changes. These workflows enable users to continuously join new data into large existing data sets without reprocessing all data. Apache Fluo is built on Apache Accumulo.", "members": [], "x": -143.0, "y": -325.0}, {"i": 61, "name": "Fluo Recipes", "kind": "tick", "lines": [0], "desc": "Apache Fluo Recipes build on the Fluo API to offer additional functionality to developers. They are published separately from Fluo on their own release schedule. This allows Fluo Recipes to iterate and innovate faster than Fluo (which will maintain a more minimal API on a slower release cycle). Fluo Recipes offers code to implement common patterns on top of Fluo's API. It also offers glue code to external libraries like Spark and Kryo.", "members": [], "x": -91.0, "y": -325.0}, {"i": 62, "name": "Fluo YARN", "kind": "tick", "lines": [0], "desc": "Apache Fluo YARN is a tool for running Apache Fluo applications in Apache Hadoop YARN.", "members": [], "x": -357.8, "y": 117.0}, {"i": 63, "name": "FOP", "kind": "tick", "lines": [5], "desc": "FOP (Formatting Objects Processor) is the world's first print formatter driven by XSL formatting objects (XSL-FO) and the world's first output independent formatter. It is a Java application that reads a formatting object (FO) tree and renders the resulting pages to a specified output. Output formats currently supported include PDF, PCL, PS, SVG, XML (area tree representation), Print, AWT, MIF and TXT. The primary output target is PDF.", "members": [], "x": -455.0, "y": -78.0}, {"i": 64, "name": "Fortress", "kind": "hub", "lines": [1, 2], "desc": "Apache Fortress is a standards-based authorization system, written in Java, that provides role-based access control, delegated administration and password policy services using an LDAP backend.", "members": [], "x": 572.0, "y": -195.0}, {"i": 65, "name": "FreeMarker", "kind": "hub", "lines": [4, 6], "desc": "Apache FreeMarker is a template engine: a Java library to generate text output (HTML web pages, e-mails, configuration files, source code, etc.) based on templates and changing data. Templates are written in the FreeMarker Template Language (FTL), which is a simple, specialized language (not a full-blown programming language). Usually, a general-purpose programming language (like Java) is used to prepare the data (issue database queries, do business calculations). Then, Apache FreeMarker displays that prepared data using templates. In the template you are focusing on how to present the data, and outside the template you are focusing on what data to present.", "members": [], "x": 286.0, "y": 91.0}, {"i": 66, "name": "FtpServer", "kind": "tick", "lines": [2], "desc": "The Apache FtpServer application is a 100% pure Java FTP server. It's designed to be a complete and portable FTP server engine solution based on currently available open protocols. FtpServer can be run standalone as a Windows service or Unix/Linux daemon, or embedded into a Java application. We also provide support for integration within Spring applications and provide our releases as OSGi bundles.", "members": [], "x": 546.7, "y": -156.7}, {"i": 67, "name": "Geode", "kind": "tick", "lines": [3], "desc": "Apache Geode is a data management platform that provides real-time, consistent access to data-intensive applications throughout widely distributed cloud architectures. Geode pools memory, CPU, network resources, and optionally local disk across multiple processes to manage application objects and behavior. It uses dynamic replication and data partitioning techniques to implement high availability, improved performance, scalability, and fault tolerance. In addition to being a distributed data container, Geode is an in-memory data management system that provides reliable asynchronous event notifications and guaranteed message delivery.", "members": [], "x": -143.0, "y": 169.0}, {"i": 68, "name": "Geronimo", "kind": "hub", "lines": [2, 4], "desc": "Apache Geronimo is an open source server runtime that integrates the best open source projects to create Java/OSGi server runtimes that meet the needs of enterprise developers and system administrators. Our most popular distribution is a fully certified Java EE 5 application server runtime.", "members": [], "x": 286.0, "y": -104.0}, {"i": 69, "name": "Gobblin", "kind": "tick", "lines": [0], "desc": "A distributed data integration framework that simplifies common aspects of big data integration such as data ingestion, replication, organization and lifecycle management for both streaming and batch data ecosystems.", "members": [], "x": -403.4, "y": 117.4}, {"i": 70, "name": "Grails", "kind": "tick", "lines": [4], "desc": "Grails is a powerful Groovy-based web application framework for the JVM built on top of Spring Boot that has many plugins to further extend its functionality.", "members": [], "x": 34.5, "y": 177.5}, {"i": 71, "name": "Groovy", "kind": "tick", "lines": [1], "desc": "Apache Groovy is a powerful, optionally typed and dynamic language, with static-typing and static compilation capabilities, for the Java platform aimed at improving developer productivity thanks to a concise, familiar and easy to learn syntax. It integrates smoothly with any Java program, and immediately delivers to your application powerful features, including scripting capabilities, Domain-Specific Language authoring, runtime and compile-time meta-programming and functional programming.", "members": [], "x": 504.3, "y": -195.0}, {"i": 72, "name": "Guacamole", "kind": "tick", "lines": [2], "desc": "Apache Guacamole is a clientless remote desktop gateway which supports standard protocols like VNC, RDP, and SSH. We call it \"clientless\" because no plugins or client software are required. Once Guacamole is installed on a server, all you need to access your desktops is a web browser.", "members": [], "x": 503.7, "y": -143.0}, {"i": 73, "name": "Gump", "kind": "tick", "lines": [7], "desc": "Gump provides large scale continuous integration for various open source projects.", "members": [], "x": -260.0, "y": 351.0}, {"i": 74, "name": "Hadoop", "kind": "tick", "lines": [0], "desc": "The Apache Hadoop software library is a framework that allows for the distributed processing of large data sets across clusters of computers using simple programming models. It is designed to scale up from single servers to thousands of machines, each offering local computation and storage. Rather than rely on hardware to deliver high-availability, the library itself is designed to detect and handle failures at the application layer, so delivering a highly-available service on top of a cluster of computers, each of which may be prone to failures.", "members": [], "x": -396.2, "y": 149.8}, {"i": 75, "name": "HBase", "kind": "tick", "lines": [3], "desc": "Use Apache HBase software when you need random, realtime read/write access to your Big Data. This project's goal is the hosting of very large tables -- billions of rows X millions of columns -- atop clusters of commodity hardware. HBase is an open-source, distributed, versioned, column-oriented store modeled after Google's Bigtable: A Distributed Storage System for Structured Data by Chang et al. Just as Bigtable leverages the distributed data storage provided by the Google File System, HBase provides Bigtable-like capabilities on top of Hadoop and HDFS.", "members": [], "x": -237.8, "y": 152.2}, {"i": 76, "name": "Helix", "kind": "hub", "lines": [0, 8], "desc": "Apache Helix is a generic cluster management framework used for the automatic management of partitioned, replicated and distributed resources hosted on a cluster of nodes. Helix automates reassignment of resources in the face of node failure and recovery, cluster expansion, and reconfiguration.", "members": [], "x": -364.0, "y": 273.0}, {"i": 77, "name": "Hive", "kind": "tick", "lines": [3], "desc": "The Apache Hive (TM) data warehouse software facilitates querying and managing large datasets residing in distributed storage. Built on top of Apache Hadoop (TM), it provides * tools to enable easy data extract/transform/load (ETL) * a mechanism to impose structure on a variety of data formats * access to files stored either directly in Apache HDFS (TM) or in other data storage systems such as Apache HBase (TM) * query execution via MapReduce Hive defines a simple SQL-like query language, called HiveQL, that enables users familiar with SQL to query the data. At the same time, this language also allows programmers who are familiar with the MapReduce framework to be able to plug in their custom mappers and reducers to perform more sophisticated analysis that may not be supported by the built-in capabilities of the language. HiveQL can also be extended with custom scalar functions (UDF's), aggregations (UDAF's), and table functions (UDTF's).", "members": [], "x": -302.8, "y": 113.2}, {"i": 78, "name": "Hop", "kind": "tick", "lines": [0], "desc": "The Hop Orchestration Platform, or Apache Hop, aims to facilitate all aspects of data and metadata orchestration. Hop is an entirely new open source data integration platform that is easy to use, fast and flexible Hop aims to be the future of data integration. Visual development enables developers to be more productive than they can be through code. Our Design once, run anywhere workflows and pipelines can be designed in the Hop Gui and run on the Hop native engine (local or remote), or on Spark, Flink, Google Dataflow or AWS EMR through Beam. Lifecycle Management enables developers and administrators to switch between projects, environments and purposes without leaving your train of thought.", "members": [], "x": -363.8, "y": 182.2}, {"i": 79, "name": "HTTP Server", "kind": "tick", "lines": [2], "desc": "The Apache HTTP Server is an open-source HTTP server for modern operating systems including UNIX, Microsoft Windows, Mac OS/X and Netware. The goal of this project is to provide a secure, efficient and extensible server that provides HTTP services observing the current HTTP standards. Apache has been the most popular web server on the Internet since April of 1996.", "members": [], "x": 395.1, "y": -161.1}, {"i": 80, "name": "HttpClient 5", "kind": "hub", "lines": [1, 2], "desc": "HttpClient is a library for client-side HTTP communication built on HttpCore. It provides connection management, cookie management, and authentication. This is the successor to the widely used Jakarta Commons HttpClient 3.1.", "members": [], "x": 637.0, "y": 0.0}, {"i": 81, "name": "HttpCore", "kind": "hub", "lines": [1, 2], "desc": "HttpCore is a set of low level HTTP transport components that can be used to build custom client and server side HTTP services with a minimal footprint. HttpCore supports two I/O models: blocking I/O model based on the classic Java I/O and non-blocking, event driven I/O model based on Java NIO.", "members": [], "x": 585.0, "y": 65.0}, {"i": 82, "name": "Hudi", "kind": "tick", "lines": [1], "desc": "Hudi brings transactions, stream processing, indexes, mutability and incremental processing to data lakes.", "members": [], "x": 464.2, "y": 117.0}, {"i": 83, "name": "Iceberg", "kind": "hub", "lines": [0, 3], "desc": "Iceberg brings the reliability and simplicity of SQL tables to big data, while making it possible for engines like Spark, Trino, Flink, Presto, Hive and Impala to safely work with the same tables, at the same time.", "members": [], "x": -806.0, "y": -182.0}, {"i": 84, "name": "Ignite", "kind": "hub", "lines": [0, 2, 3, 4, 8], "desc": "Apache Ignite is a distributed database for high-performance computing with in-memory speed.", "members": [], "x": -13.0, "y": -169.0}, {"i": 85, "name": "Impala", "kind": "tick", "lines": [0], "desc": "Apache Impala is the open source, native analytic database for open data and table formats.", "members": [], "x": -331.4, "y": 214.6}, {"i": 86, "name": "InLong", "kind": "tick", "lines": [0], "desc": "Apache InLong is a one-stop, full-scenario integration framework for massive data that supports Data Ingestion, Data Synchronization, and Data Subscription, and it provides automatic, safe, reliable, and high-performance data transmission capabilities to facilitate the construction of streaming-based data analysis, modeling, and applications.", "members": [], "x": -405.8, "y": 231.2}, {"i": 87, "name": "IoTDB", "kind": "hub", "lines": [3, 8], "desc": "Apache IoTDB (Database for Internet of Things) is an integrated data management engine designed for time series data. It provides users with services for data collection, storage and analysis. Due to its light-weight architecture, high performance and rich feature set together with its deep integration with Apache Hadoop, Spark and Flink. Apache IoTDB can meet the requirements of massive data storage, high-speed data ingestion and complex data analysis in the IoT industrial fields.", "members": [], "x": -273.0, "y": 169.0}, {"i": 88, "name": "Ivy", "kind": "tick", "lines": [7], "desc": "Apache Ivy is a very powerful dependency manager oriented toward Java dependency management, even though it could be used to manage dependencies of any kind.", "members": [], "x": -208.0, "y": 351.0}, {"i": 89, "name": "IvyDE", "kind": "tick", "lines": [7], "desc": "The now retired IvyDE lets you manage your dependencies declared in an ivy.xml in your Java Eclipse projects. IvyDE will contribute to the classpath of your Java project, with the classpath container. It also bring an editor of ivy.xml files, with completion.", "members": [], "x": -156.0, "y": 351.0}, {"i": 90, "name": "Jackrabbit", "kind": "hub", "lines": [1, 2, 3, 5], "desc": "Apache Jackrabbit is a fully conforming implementation of the Content Repository for Java Technology API (JCR). A content repository is a hierarchical content store with support for structured and unstructured content, full text search, versioning, transactions, observation, and more. Typical applications that use content repositories include content management, document management, and records management systems.", "members": [], "x": -26.0, "y": -26.0}, {"i": 91, "name": "JAMES", "kind": "tick", "lines": [2], "desc": "The Apache Java Enterprise Mail Server (a.k.a. Apache James) is a 100% pure Java SMTP and POP3 Mail server and NNTP News server. We have designed James to be a complete and portable enterprise mail engine solution based on currently available open protocols. James is also a mail application platform. We have developed a Java API to let you write Java code to process emails that we call the mailet API. A mailet can generate an automatic reply, update a database, prevent spam, build a message archive, or whatever you can imagine. A matcher determines whether your mailet should process an email in the server. The James project hosts the Mailet API, and James provides an implementation of this mail application platform API.", "members": [], "x": 348.2, "y": -114.2}, {"i": 92, "name": "JDO", "kind": "tick", "lines": [3], "desc": "The POJO approach separates data manipulation (done by accessing Java data members in the Java domain objects) from database manipulation (done by calling the JDO interface methods). This separation of concerns leads to a high degree of independence of the Java view of data from the database view of the data.", "members": [], "x": -414.9, "y": -13.0}, {"i": 93, "name": "Jena", "kind": "tick", "lines": [1], "desc": "Apache Jena provides a complete framework for building Semantic Web and Linked Data applications in Java, and provides: parsers for RDF/XML, Turtle and N-triples; a Java programming API; a complete implementation of the SPARQL query language; a rule-based inference engine for RDFS and OWL entailments; TDB (a non-SQL persistent triple store); SDB (a persistent triples store built on a relational store) and Fuseki, an RDF server using web protocols. Jena complies with all relevant recommendations for RDF and related technol
