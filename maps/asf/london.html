<title>The Apache Projects Underground</title>
<!--
  Template for scripts/build_map.py --html.  Placeholders: The Apache Projects Underground Top-level projects by area  ·  data: projects.apache.org  ·  option: london
  Style after the London Underground diagram (H. Beck) and the STM Métro de Montréal {"title": "The Apache Projects Underground", "subtitle": "Top-level projects by area  ·  data: projects.apache.org  ·  option: london", "lines": [{"name": "Big Data", "color": "#E32017", "count": 55}, {"name": "Libraries", "color": "#0019A8", "count": 49}, {"name": "Networking", "color": "#00782A", "count": 50}, {"name": "Data Stores", "color": "#9B0056", "count": 33}, {"name": "Frameworks", "color": "#FFD300", "count": 25}, {"name": "XML & Graphics", "color": "#B36305", "count": 25}, {"name": "Content & Search", "color": "#0098D4", "count": 23}, {"name": "Build & Test", "color": "#8A9199", "count": 18}, {"name": "Cloud & IoT", "color": "#EE7C0E", "count": 17}], "stations": [{"i": 0, "name": "Accumulo", "kind": "tick", "lines": [0], "desc": "The Apache Accumulo sorted, distributed key/value store is based on Google's BigTable design. It is built on top of Apache Hadoop, Apache Zookeeper, and Apache Thrift. It features a few novel improvements on the BigTable design in the form of cell-level access labels and a server-side programming mechanism that can modify key/value pairs at various points in the data management process.", "members": [], "x": -291.4, "y": -683.2}, {"i": 1, "name": "ActiveMQ", "kind": "tick", "lines": [2], "desc": "ActiveMQ is a fast and powerful Message Broker which supports many Cross Language Clients and Protocols and many advanced features while fully supporting JMS 1.1 and J2EE 1.4.", "members": [], "x": 728.0, "y": 104.0}, {"i": 2, "name": "AGE", "kind": "tick", "lines": [3], "desc": "The goal of Apache AGE™ is to provide graph data processing and analytics capability to all relational databases. Through Apache AGE, PostgreSQL users will gain access to graph query modeling within the existing relational database.", "members": [], "x": -381.1, "y": -277.1}, {"i": 3, "name": "Airavata", "kind": "hub", "lines": [0, 2, 8], "desc": "Apache Airavata is a micro-service architecture based software framework for executing and managing computational jobs and workflows on distributed computing resources including local clusters, supercomputers, national grids, academic and commercial clouds. Airavata is dominantly used to build Web-based science gateways and assist to compose, manage, execute, and monitor large scale applications (wrapped as Web services) and workflows composed of these services.", "members": [], "x": -39.0, "y": -247.0}, {"i": 4, "name": "Airflow", "kind": "tick", "lines": [0], "desc": "The mission of Apache Airflow is the creation and maintenance of software related to workflow automation and scheduling that can be used to author and manage data pipelines.", "members": [], "x": -328.2, "y": -646.5}, {"i": 5, "name": "Allura", "kind": "tick", "lines": [6], "desc": "Apache Allura is an open source implementation of a software \"forge\", a web site that manages source code repositories, bug reports, discussions, wiki pages, blogs and more for any number of individual projects.", "members": [], "x": -156.0, "y": -260.0}, {"i": 6, "name": "Ambari", "kind": "tick", "lines": [0], "desc": "Apache Ambari simplifies provisioning, managing, and monitoring of Apache Hadoop clusters.", "members": [], "x": -364.9, "y": -609.7}, {"i": 7, "name": "Anakia", "kind": "tick", "lines": [1], "desc": "Anakia is an XML transformation tool that uses JDOM and Velocity to transform XML documents into the format of your choice. It provides an alternative to using Ant's style task and XSL to process XML files.", "members": [], "x": 602.1, "y": 4.1}, {"i": 8, "name": "Annotator", "kind": "tick", "lines": [6], "desc": "Apache Annotator is a collaborative community for creating annotation related code which works to provide a future for Annotator.js-based projects and plugins while enabling W3C spec-compliant Web Annotation in Web browsers, Web Publication readers, and the servers that serve them.", "members": [], "x": -104.0, "y": -260.0}, {"i": 9, "name": "Ant", "kind": "tick", "lines": [7], "desc": "Apache Ant is a Java-based build tool.", "members": [], "x": -414.7, "y": 479.7}, {"i": 10, "name": "AntUnit", "kind": "tick", "lines": [7], "desc": "The Ant Library provides Ant tasks for testing Ant task, it can also be used to drive functional and integration tests of arbitrary applications with Ant.", "members": [], "x": -377.9, "y": 442.9}, {"i": 11, "name": "APR", "kind": "tick", "lines": [1], "desc": "The mission of the Apache Portable Runtime (APR) project is to create and maintain software libraries that provide a predictable and consistent interface to underlying platform-specific implementations. The primary goal is to provide an API to which software developers may code and be assured of predictable if not identical behaviour regardless of the platform on which their software is built, relieving them of the need to code special-case conditions to work around or take advantage of platform-specific deficiencies or features.", "members": [], "x": 565.3, "y": -32.7}, {"i": 12, "name": "Aries", "kind": "tick", "lines": [1], "desc": "The Aries project is delivering a set of pluggable Java components enabling an enterprise OSGi application programming model. This includes implementations and extensions of application-focused specifications defined by the OSGi Alliance Enterprise Expert Group (EEG) and an assembly format for multi-bundle applications, for deployment to a variety of OSGi based runtimes.", "members": [], "x": 528.5, "y": -69.5}, {"i": 13, "name": "Arrow", "kind": "hub", "lines": [0, 1, 2, 3], "desc": "Apache Arrow defines a language-independent columnar memory format for flat and nested data, organized for efficient analytic operations on modern hardware like CPUs and GPUs. The Arrow memory format also supports zero-copy reads for lightning-fast data access without serialization overhead. Arrow's libraries implement the format and provide building blocks for a range of use cases, including high performance analytics. Many popular projects use Arrow to ship columnar data efficiently or as the basis for analytic engines. Libraries are available for C, C++, C#, Go, Java, JavaScript, Julia, MATLAB, Python, R, Ruby, and Rust. Apache Arrow is software created by and for the developer community. We are dedicated to open, kind communication and consensus decision making. Our committers come from a range of organizations and backgrounds, and we welcome all to participate with us.", "members": [], "x": -234.0, "y": -130.0}, {"i": 14, "name": "Avro", "kind": "hub", "lines": [0, 1, 2], "desc": "Apache Avro is a data serialization system.", "members": [], "x": -169.0, "y": -156.0}, {"i": 15, "name": "Axiom", "kind": "hub", "lines": [1, 5], "desc": "Apache Axiom is a StAX-based, XML Infoset compliant object model which supports on-demand building of the object tree. It supports a novel \"pull-through\" model which allows one to turn off the tree building and directly access the underlying pull event stream. It also has built in support for XML Optimized Packaging (XOP) and MTOM, the combination of which allows XML to carry binary data efficiently and in a transparent manner. The combination of these is an easy to use API with a very high performant architecture!", "members": [], "x": -130.0, "y": 52.0}, {"i": 16, "name": "Axis2", "kind": "hub", "lines": [2, 5], "desc": "Apache Axis2 is a toolkit for creating and using Web Services, including SOAP, MTOM, XML/HTTP and advanced WS-* standards such as WSRM and WSSecurity. Axis2 includes a very fast runtime engine, together with tooling support for WSDL and WS-Policy, and plugin support for WS-Addressing, WS-ReliableMessaging, WS-Security, WS-Eventing, WS-Transactions, WS-Trust and WS-SecureConversation. Axis2 runs either standalone or hosted in Tomcat or other servlet containers.", "members": [], "x": 104.0, "y": -104.0}, {"i": 17, "name": "Batik", "kind": "tick", "lines": [5], "desc": "Batik is a Java-based toolkit for applications or applets to use images in the Scalable Vector Graphics (SVG) format for various purposes, such as display, generation and manipulation.", "members": [], "x": -507.0, "y": -78.0}, {"i": 18, "name": "Beam", "kind": "tick", "lines": [0], "desc": "Apache Beam is a unified programming model for both batch and streaming data processing, enabling efficient execution across diverse distributed execution engines and providing extensibility points for connecting to different technologies and user communities.", "members": [], "x": -383.3, "y": -565.3}, {"i": 19, "name": "Bigtop", "kind": "tick", "lines": [0], "desc": "Bigtop is a project for the development of packaging and tests of the Apache Hadoop ecosystem. The primary goal of Bigtop is to build a community around the packaging and interoperability testing of Hadoop-related projects. This includes testing at various levels (packaging, platform, runtime, upgrade, etc...) developed by a community with a focus on the system as a whole, rather than individual projects. In short we strive to be for Hadoop what Debian is to Linux.", "members": [], "x": -383.3, "y": -513.3}, {"i": 20, "name": "BookKeeper", "kind": "tick", "lines": [0], "desc": "BookKeeper is a reliable replicated log service. It can be used to turn any standalone service into a highly available replicated service. BookKeeper is highly available (no single point of failure), and scales horizontally as more storage nodes are added.", "members": [], "x": -383.3, "y": -461.3}, {"i": 21, "name": "Brooklyn", "kind": "tick", "lines": [8], "desc": "Brooklyn is about deploying and managing applications: composing a full stack for an application; deploying to cloud and non-cloud targets; using monitoring tools to collect key health/performance metrics; responding to situations such as a failing node; and adding or removing capacity to match demand.", "members": [], "x": -195.0, "y": -247.0}, {"i": 22, "name": "bRPC", "kind": "tick", "lines": [1], "desc": "bRPC is an Industrial-grade RPC framework using C++ Language, which is often used in high performance system such as Search, Storage, Machine learning, Advertisement, Recommendation etc. \"bRPC\" means \"better RPC\".", "members": [], "x": 491.8, "y": -106.2}, {"i": 23, "name": "BVal", "kind": "hub", "lines": [1, 4], "desc": "The goal of the Apache BVal project is to deliver an implementation of the Java Bean Validation Specfication (JSR303/346) which is TCK compliant and works on Java SE 6 or later. The initial codebase for the project was donated to the ASF by a SGA from Agimatec GmbH and uses the Apache Software License v2.0.", "members": [], "x": 403.0, "y": 117.0}, {"i": 24, "name": "Calcite", "kind": "hub", "lines": [0, 3], "desc": "Calcite is a framework for writing data management systems. It converts queries, represented in relational algebra, into an efficient executable form using pluggable query transformation rules. There is an optional SQL parser and JDBC driver. Calcite does not store data or have a preferred execution engine. Data formats, execution algorithms, planning rules, operator types, metadata, and cost model are added at runtime as plugins.", "members": [], "x": -676.0, "y": -130.0}, {"i": 25, "name": "Camel", "kind": "hub", "lines": [1, 2, 8], "desc": "Apache Camel is an open source integration framework with 350+ connectors. Write routes in Java, YAML, or XML. Run on Spring Boot, Quarkus, or standalone. Apache License 2.0.", "members": [], "x": -91.0, "y": -52.0}, {"i": 26, "name": "CarbonData", "kind": "tick", "lines": [0], "desc": "Apache CarbonData is a new big data file format for faster interactive query using advanced columnar storage, index, compression and encoding techniques to improve computing efficiency, which helps in speeding up queries by an order of magnitude faster over PetaBytes of data.", "members": [], "x": -364.9, "y": -416.9}, {"i": 27, "name": "Cassandra", "kind": "tick", "lines": [3], "desc": "Linear scalability and proven fault-tolerance on commodity hardware or cloud infrastructure make Apache Cassandra the perfect platform for mission-critical data. Cassandra's support for replicating across multiple datacenters is best-in-class. Cassandra is in use at Netflix, Twitter, Urban Airship, Constant Contact, Reddit, Cisco, OpenX, Digg, CloudKick, Ooyala, and more companies that have large, active data sets. Cassandra provides full Hadoop integration, including with Pig and Hive.", "members": [], "x": -344.3, "y": -240.3}, {"i": 28, "name": "Causeway", "kind": "tick", "lines": [4], "desc": "Apache Causeway is a framework for rapidly developing domain-driven apps in Java. Write your business logic in entities, domain services and repositories, and the framework dynamically (at runtime) generates a representation of that domain model as a webapp, RESTful or GraphQL API. For prototyping or production.", "members": [], "x": 108.1, "y": 251.1}, {"i": 29, "name": "Cayenne", "kind": "hub", "lines": [1, 2, 3, 4, 5], "desc": "Cayenne is a powerful, full-featured, opensource framework created for developers working with relational databases. it seamlessly maps any relational database to Java objects, reducing development time and adding considerable functionality to any application which requires a database. Developers using Cayenne will be able to concentrate on the core business requirements and the data model instead of the SQL details. The application can then be easily moved to any JDBC-capable database. In addition to management of persistent Java objects mapped to relational databases, Cayenne provides a plethora of features including single method call queries and updates (including atomic updates of all modified objects), seamless integration of multiple databases into a single virtual data source, three tier persistence with caching on the remote client, paging of results, record locking, and many more features.", "members": [], "x": 13.0, "y": 26.0}, {"i": 30, "name": "Celix", "kind": "tick", "lines": [2], "desc": "Apache Celix is a framework for C, C++14 and C++17 to develop dynamic modular software applications using component and in-process service-oriented programming. Apache Celix is inspired by the OSGi specification adapted for C and C++.", "members": [], "x": 676.0, "y": 104.0}, {"i": 31, "name": "Chainsaw", "kind": "tick", "lines": [2], "desc": "Apache Chainsaw is a GUI log viewer.", "members": [], "x": 210.2, "y": 49.8}, {"i": 32, "name": "CloudStack", "kind": "tick", "lines": [8], "desc": "Apache CloudStack is open source software designed to deploy and manage large networks of virtual machines, as a highly available, highly scalable Infrastructure as a Service (IaaS) cloud computing platform. CloudStack is used by a number of service providers to offer public cloud services, and by many companies to provide an on-premises (private) cloud offering, or as part of a hybrid cloud solution. CloudStack is a turnkey solution that includes the entire \"stack\" of features most organizations want with an IaaS cloud: compute orchestration, Network-as-a-Service, user and account management, a full and open native API, resource accounting, and a first-class User Interface (UI). CloudStack currently supports the most popular hypervisors: VMware, KVM, XenServer and Xen Cloud Platform (XCP). Users can manage their cloud with an easy to use Web interface, command line tools, and / or a full-featured RESTful API. In addition, CloudStack provides an API that's compatible with AWS EC2 and S3 for organizations that wish to deploy hybrid clouds.", "members": [], "x": -143.0, "y": -247.0}, {"i": 33, "name": "Commons", "kind": "hub", "lines": [1, 2], "desc": "", "members": ["Commons BCEL", "Commons BeanUtils", "Commons BSF", "Commons Chain (Dormant)", "Commons CLI", "Commons Codec", "Commons Collections", "Commons Compress", "Commons Configuration", "Commons Crypto", "Commons CSV", "Commons Daemon", "Commons DBCP", "Commons DbUtils", "Commons Digester", "Commons Email", "Commons Exec", "Commons FileUpload", "Commons Functor (Dormant)", "Commons Geometry", "Commons HttpClient", "Commons Imaging", "Commons IO", "Commons JCI", "Commons JCS", "Commons Jelly", "Commons JEXL", "Commons JXPath", "Commons Lang", "Commons Logging", "Commons Math", "Commons Net", "Commons Numbers", "Commons OGNL (Dormant)", "Commons Pool", "Commons Proxy (Dormant)", "Commons RDF", "Commons RNG", "Commons SCXML", "Commons Statistics", "Commons Text", "Commons Validator", "Commons VFS", "Commons Weaver"], "x": 650.0, "y": -78.0}, {"i": 34, "name": "Compress Ant", "kind": "tick", "lines": [7], "desc": "This is a library of Ant tasks and types uses Apache Commons Compress to support additional archive formats like ar, pack200, xz and cpio.", "members": [], "x": -341.2, "y": 406.2}, {"i": 35, "name": "Cordova", "kind": "hub", "lines": [1, 2], "desc": "Apache Cordova is a tool to create cross-platform apps from standard web technologies (HTML, CSS, and JavaScript). Its primary purpose is to provide a bridge for native device API access and to bundle for distribution.", "members": [], "x": 624.0, "y": -143.0}, {"i": 36, "name": "CouchDB", "kind": "hub", "lines": [0, 2, 3, 6, 8], "desc": "Apache CouchDB is a database that completely embraces the web. Store your data with JSON documents. Access your documents with your web browser, via HTTP. Query, combine, and transform your documents with JavaScript. Apache CouchDB works well with modern web and mobile apps. CouchDB's killer feature is its ability to distribute data efficiently using Apache CouchDB’s incremental replication. Apache CouchDB supports master-master setups with automatic conflict detection.", "members": [], "x": -78.0, "y": -130.0}, {"i": 37, "name": "cTAKES", "kind": "hub", "lines": [1, 6], "desc": "Apache clinical Text Analysis and Knowledge Extraction System (cTAKES) is an open-source natural language processing system for information extraction from electronic medical record clinical free-text. It processes clinical notes, identifying types of clinical named entities from various dictionaries including the Unified Medical Language System (UMLS) - medications, diseases/disorders, signs/symptoms, anatomical sites and procedures. Each named entity has attributes for the text span, the ontology mapping code, subject (patient, family member, etc.) and context (negated/not negated, conditional, generic, degree of certainty). Some of the attributes are expressed as relations, for example the location of a clinical condition (locationOf relation) or the severity of a clinical condition (degreeOf relation).", "members": [], "x": -52.0, "y": 234.0}, {"i": 38, "name": "Curator", "kind": "tick", "lines": [3], "desc": "Apache Curator is a Java/JVM client library for Apache ZooKeeper, a distributed coordination service. It includes a highlevel API framework and utilities to make using Apache ZooKeeper much easier and more reliable. It also includes recipes for common use cases and extensions such as service discovery and a Java 8 asynchronous DSL.", "members": [], "x": -307.5, "y": -203.5}, {"i": 39, "name": "CXF", "kind": "hub", "lines": [1, 2, 5], "desc": "Apache CXF is an open source services framework. CXF helps you build and develop services using frontend programming APIs like JAX-WS and JAX-RS. These services can speak a variety of protocols such as SOAP, XML/HTTP, RESTful HTTP, or CORBA and work over a variety of transports such as HTTP, JMS or JBI.", "members": [], "x": 442.0, "y": -208.0}, {"i": 40, "name": "CycloneDX Ant", "kind": "tick", "lines": [7], "desc": "Provides support for the creation of CycloneDX SBOMs.", "members": [], "x": -304.4, "y": 369.4}, {"i": 41, "name": "Daffodil", "kind": "hub", "lines": [0, 1, 5], "desc": "Apache Daffodil is an open-source implementation of the DFDL specification that uses DFDL data descriptions to parse fixed format data into an infoset. This infoset is commonly converted into XML or JSON to enable the use of well-established XML or JSON technologies and libraries to consume, inspect, and manipulate fixed format data in existing solutions. Daffodil is also capable of serializing or \"unparsing\" data back to the original data format. The DFDL infoset can also be converted directly to/from the data structures carried by data processing frameworks so as to bypass any XML/JSON overheads.", "members": [], "x": -299.0, "y": -78.0}, {"i": 42, "name": "DataFu", "kind": "tick", "lines": [0], "desc": "Apache DataFu consists of two libraries: Apache DataFu Pig is a collection of useful user-defined functions for data analysis in Apache Pig. Apache DataFu Hourglass is a library for incrementally processing data using Apache Hadoop MapReduce. This library was inspired by the prevelance of sliding window computations over daily tracking data. Computations such as these typically happen at regular intervals (e.g. daily, weekly), and therefore the sliding nature of the computations means that much of the work is unnecessarily repeated. DataFu's Hourglass was created to make these computations more efficient, yielding sometimes 50-95% reductions in computational resources.", "members": [], "x": -328.2, "y": -380.2}, {"i": 43, "name": "DataFusion", "kind": "hub", "lines": [0, 1, 3], "desc": "Apache DataFusion is a fast, extensible query engine for building high-quality data-centric systems in Rust, using the Apache Arrow in-memory format. Python Bindings are also available. DataFusion offers SQL and Dataframe APIs, excellent performance, built-in support for CSV, Parquet, JSON, and Avro, extensive customization, and a great community.", "members": [], "x": -351.0, "y": 65.0}, {"i": 44, "name": "DataSketches", "kind": "hub", "lines": [0, 1], "desc": "In the analysis of big data there are often problem queries that don’t scale because they require huge compute resources and time to generate exact results. Examples include count distinct, quantiles, distribution analysis, most-frequent items, joins, matrix computations, and graph analysis. If approximate results are acceptable, there is a class of specialized algorithms, called streaming algorithms, or sketches, that can produce results orders-of magnitude faster and with mathematically proven error bounds. For interactive queries there may not be other viable alternatives, and in the case of real-time analysis, sketches are the only known solution.", "members": [], "x": -312.0, "y": 117.0}, {"i": 45, "name": "DeltaSpike", "kind": "tick", "lines": [4], "desc": "Apache DeltaSpike is a suite of portable CDI (Contexts & Dependency Injection) extensions intended to make application development easier when working with CDI and Java EE. Some of its key features include: - A core runtime that supports component configuration, type safe messaging and internationalization, and exception handling. - A suite of utilities to make programmatic bean lookup easier. - A plugin for Java SE to bootstrap both JBoss Weld and Apache OpenWebBeans outside of a container. - JSF integration, including backporting of JSF 2.2 features for Java EE 6. - JPA integration and transaction support. - A Data module, to create an easy to use repository pattern on top of JPA. - Quartz integration Testing support is also provided, to allow you to do low level unit testing of your CDI enabled projects.", "members": [], "x": 546.0, "y": 195.0}, {"i": 46, "name": "Derby", "kind": "tick", "lines": [3], "desc": "Apache Derby is an open source relational database implemented entirely in Java. It has a small footprint that makes it easy to embed in any Java-based application, but it also supports the more familiar client/server mode. It is based on the Java, JDBC, and SQL standards, making code developed more portable to standards-compliant databases. The developer community voted to retire the project and move it into a read-only mode as of 2025-10-10. See https://lists.apache.org/thread/q7xnvbyo818vvtyh2b5oljr8won4zjx7", "members": [], "x": -270.8, "y": -166.8}, {"i": 47, "name": "Directory LDAP", "kind": "tick", "lines": [2], "desc": "The Apache Directory LDAP API is an ongoing effort to provide an enhanced LDAP API, as a replacement for JNDI and the existing LDAP API (jLdap and Mozilla LDAP API).", "members": [], "x": 173.5, "y": 86.5}, {"i": 48, "name": "Directory Server", "kind": "tick", "lines": [2], "desc": "ApacheDS is an extensible and embeddable directory server entirely written in Java, which has been certified LDAPv3 compatible by the Open Group. It has been designed to introduce triggers, stored procedures, queues and views to the world of LDAP which has lacked these rich constructs.", "members": [], "x": 624.0, "y": 104.0}, {"i": 49, "name": "Directory Studio", "kind": "tick", "lines": [2], "desc": "Apache Directory Studio is a complete directory tooling platform intended to be used with any LDAP server however it is particularly designed for use with ApacheDS. It is an Eclipse RCP application, composed of several Eclipse (OSGi) plugins, that can be easily upgraded with additional ones. These plugins can even run within Eclipse itself.", "members": [], "x": 136.7, "y": 123.3}, {"i": 50, "name": "Doris", "kind": "tick", "lines": [3], "desc": "Apache Doris is an easy-to-use, high-performance and real-time analytical database based on MPP architecture, known for its extreme speed and ease of use. It only requires a sub-second response time to return query results under massive data and can support not only high-concurrent point query scenarios but also high-throughput complex analysis scenarios. All this makes Apache Doris an ideal tool for scenarios including report analysis, ad-hoc query, unified data warehouse, and data lake query acceleration. On Apache Doris, users can build various applications, such as user behavior analysis, AB test platform, log retrieval analysis, user portrait analysis, and order analysis.", "members": [], "x": -182.0, "y": -130.0}, {"i": 51, "name": "Drill", "kind": "tick", "lines": [0], "desc": "Apache Drill is a distributed MPP query layer that supports SQL and alternative query languages against NoSQL and Hadoop data storage systems. It was inspired in part by Google's Dremel.", "members": [], "x": -291.4, "y": -343.4}, {"i": 52, "name": "Druid", "kind": "hub", "lines": [0, 3], "desc": "Apache Druid is a high performance real-time analytics database. Druid's main value add is to reduce time to insight and action. Apache Druid is designed for workflows where fast queries and ingest really matter. Druid excels at powering UIs, running operational (ad-hoc) queries, or handling high concurrency. Consider Druid as an open source alternative to data warehouses for a variety of use cases.", "members": [], "x": -611.0, "y": -91.0}, {"i": 53, "name": "ECharts", "kind": "hub", "lines": [1, 6], "desc": "Apache ECharts is a free, powerful charting and visualization library offering easy ways to add intuitive, interactive, and highly customizable charts to your commercial products. It is written in pure JavaScript and based on zrender, which is a whole new lightweight canvas library.", "members": [], "x": 13.0, "y": 286.0}, {"i": 54, "name": "Empire-db", "kind": "tick", "lines": [3], "desc": "Apache Empire-db is intended for developers who strive to have full SQL freedom when formulating queries and DML-Statements - without ever having to use string literals - and who also want to be able to control when and how statements are executed. Unlike other approaches Empire-db does not rely on Java Annotations or Mapping-files for building queries but rather uses a Java Object model that is easy to access and extend. For Data Access and Data Interchange developers can choose between traditional Java Beans and a more sophisticated dynamic interface provided by Record and DataListEntriy classes. Empire-db is DBMS vendor independent and provides handlers for Oracle, Microsoft SQLServer, PostgreSQL, MySQL, HsqlDB, Derby, H2 and more.", "members": [], "x": -130.0, "y": -130.0}, {"i": 55, "name": "EventMesh", "kind": "tick", "lines": [8], "desc": "EventMesh is a new generation serverless event middleware for building distributed event-driven applications.", "members": [], "x": -91.0, "y": -247.0}, {"i": 56, "name": "Felix", "kind": "tick", "lines": [2], "desc": "OSGi framework implementation and related technologies.", "members": [], "x": 572.0, "y": 104.0}, {"i": 57, "name": "Flex", "kind": "tick", "lines": [4], "desc": "Apache Flex® is a highly productive, open source application framework for building and maintaining expressive web applications that deploy consistently on all major browsers, desktops and devices (including smartphones, tablets and tv). It provides a modern, standards-based language and programming model that supports common design patterns suitable for developers from many backgrounds. Flex applications can be deployed to the ubiquitous Adobe® Flash® Player in the browser, Adobe® AIR™ on desktop and mobile or to native Android™, IOS™, QNX®, Windows® or Mac® applications.", "members": [], "x": 71.3, "y": 214.3}, {"i": 58, "name": "Flink", "kind": "tick", "lines": [0], "desc": "Flink is an open source system for expressive, declarative, fast, and efficient data analysis. It combines the scalability and programming flexibility of distributed MapReduce-like platforms with the efficiency, out-of-core execution, and query optimization capabilities found in parallel databases.", "members": [], "x": -247.0, "y": -325.0}, {"i": 59, "name": "Flume", "kind": "tick", "lines": [0], "desc": "Apache Flume is a distributed, reliable, and available system for efficiently collecting, aggregating and moving large amounts of log data from many different sources to a centralized data store", "members": [], "x": -195.0, "y": -325.0}, {"i": 60, "name": "Fluo", "kind": "tick", "lines": [0], "desc": "Apache Fluo is a distributed processing system that lets users make incremental updates to large data sets. With Apache Fluo, users can set up workflows that execute cross node transactions when data changes. These workflows enable users to continuously join new data into large existing data sets without reprocessing all data. Apache Fluo is built on Apache Accumulo.", "members": [], "x": -143.0, "y": -325.0}, {"i": 61, "name": "Fluo Recipes", "kind": "tick", "lines": [0], "desc": "Apache Fluo Recipes build on the Fluo API to offer additional functionality to developers. They are published separately from Fluo on their own release schedule. This allows Fluo Recipes to iterate and innovate faster than Fluo (which will maintain a more minimal API on a slower release cycle). Fluo Recipes offers code to implement common patterns on top of Fluo's API. It also offers glue code to external libraries like Spark and Kryo.", "members": [], "x": -91.0, "y": -325.0}, {"i": 62, "name": "Fluo YARN", "kind": "tick", "lines": [0], "desc": "Apache Fluo YARN is a tool for running Apache Fluo applications in Apache Hadoop YARN.", "members": [], "x": -357.8, "y": 117.0}, {"i": 63, "name": "FOP", "kind": "tick", "lines": [5], "desc": "FOP (Formatting Objects Processor) is the world's first print formatter driven by XSL formatting objects (XSL-FO) and the world's first output independent formatter. It is a Java application that reads a formatting object (FO) tree and renders the resulting pages to a specified output. Output formats currently supported include PDF, PCL, PS, SVG, XML (area tree representation), Print, AWT, MIF and TXT. The primary output target is PDF.", "members": [], "x": -455.0, "y": -78.0}, {"i": 64, "name": "Fortress", "kind": "hub", "lines": [1, 2], "desc": "Apache Fortress is a standards-based authorization system, written in Java, that provides role-based access control, delegated administration and password policy services using an LDAP backend.", "members": [], "x": 572.0, "y": -195.0}, {"i": 65, "name": "FreeMarker", "kind": "hub", "lines": [4, 6], "desc": "Apache FreeMarker is a template engine: a Java library to generate text output (HTML web pages, e-mails, configuration files, source code, etc.) based on templates and changing data. Templates are written in the FreeMarker Template Language (FTL), which is a simple, specialized language (not a full-blown programming language). Usually, a general-purpose programming language (like Java) is used to prepare the data (issue database queries, do business calculations). Then, Apache FreeMarker displays that prepared data using templates. In the template you are focusing on how to present the data, and outside the template you are focusing on what data to present.", "members": [], "x": 286.0, "y": 91.0}, {"i": 66, "name": "FtpServer", "kind": "tick", "lines": [2], "desc": "The Apache FtpServer application is a 100% pure Java FTP server. It's designed to be a complete and portable FTP server engine solution based on currently available open protocols. FtpServer can be run standalone as a Windows service or Unix/Linux daemon, or embedded into a Java application. We also provide support for integration within Spring applications and provide our releases as OSGi bundles.", "members": [], "x": 546.7, "y": -156.7}, {"i": 67, "name": "Geode", "kind": "tick", "lines": [3], "desc": "Apache Geode is a data management platform that provides real-time, consistent access to data-intensive applications throughout widely distributed cloud architectures. Geode pools memory, CPU, network resources, and optionally local disk across multiple processes to manage application objects and behavior. It uses dynamic replication and data partitioning techniques to implement high availability, improved performance, scalability, and fault tolerance. In addition to being a distributed data container, Geode is an in-memory data management system that provides reliable asynchronous event notifications and guaranteed message delivery.", "members": [], "x": -143.0, "y": 169.0}, {"i": 68, "name": "Geronimo", "kind": "hub", "lines": [2, 4], "desc": "Apache Geronimo is an open source server runtime that integrates the best open source projects to create Java/OSGi server runtimes that meet the needs of enterprise developers and system administrators. Our most popular distribution is a fully certified Java EE 5 application server runtime.", "members": [], "x": 286.0, "y": -104.0}, {"i": 69, "name": "Gobblin", "kind": "tick", "lines": [0], "desc": "A distributed data integration framework that simplifies common aspects of big data integration such as data ingestion, replication, organization and lifecycle management for both streaming and batch data ecosystems.", "members": [], "x": -403.4, "y": 117.4}, {"i": 70, "name": "Grails", "kind": "tick", "lines": [4], "desc": "Grails is a powerful Groovy-based web application framework for the JVM built on top of Spring Boot that has many plugins to further extend its functionality.", "members": [], "x": 34.5, "y": 177.5}, {"i": 71, "name": "Groovy", "kind": "tick", "lines": [1], "desc": "Apache Groovy is a powerful, optionally typed and dynamic language, with static-typing and static compilation capabilities, for the Java platform aimed at improving developer productivity thanks to a concise, familiar and easy to learn syntax. It integrates smoothly with any Java program, and immediately delivers to your application powerful features, including scripting capabilities, Domain-Specific Language authoring, runtime and compile-time meta-programming and functional programming.", "members": [], "x": 504.3, "y": -195.0}, {"i": 72, "name": "Guacamole", "kind": "tick", "lines": [2], "desc": "Apache Guacamole is a clientless remote desktop gateway which supports standard protocols like VNC, RDP, and SSH. We call it \"clientless\" because no plugins or client software are required. Once Guacamole is installed on a server, all you need to access your desktops is a web browser.", "members": [], "x": 503.7, "y": -143.0}, {"i": 73, "name": "Gump", "kind": "tick", "lines": [7], "desc": "Gump provides large scale continuous integration for various open source projects.", "members": [], "x": -260.0, "y": 351.0}, {"i": 74, "name": "Hadoop", "kind": "tick", "lines": [0], "desc": "The Apache Hadoop software library is a framework that allows for the distributed processing of large data sets across clusters of computers using simple programming models. It is designed to scale up from single servers to thousands of machines, each offering local computation and storage. Rather than rely on hardware to deliver high-availability, the library itself is designed to detect and handle failures at the application layer, so delivering a highly-available service on top of a cluster of computers, each of which may be prone to failures.", "members": [], "x": -396.2, "y": 149.8}, {"i": 75, "name": "HBase", "kind": "tick", "lines": [3], "desc": "Use Apache HBase software when you need random, realtime read/write access to your Big Data. This project's goal is the hosting of very large tables -- billions of rows X millions of columns -- atop clusters of commodity hardware. HBase is an open-source, distributed, versioned, column-oriented store modeled after Google's Bigtable: A Distributed Storage System for Structured Data by Chang et al. Just as Bigtable leverages the distributed data storage provided by the Google File System, HBase provides Bigtable-like capabilities on top of Hadoop and HDFS.", "members": [], "x": -237.8, "y": 152.2}, {"i": 76, "name": "Helix", "kind": "hub", "lines": [0, 8], "desc": "Apache Helix is a generic cluster management framework used for the automatic management of partitioned, replicated and distributed resources hosted on a cluster of nodes. Helix automates reassignment of resources in the face of node failure and recovery, cluster expansion, and reconfiguration.", "members": [], "x": -364.0, "y": 273.0}, {"i": 77, "name": "Hive", "kind": "tick", "lines": [3], "desc": "The Apache Hive (TM) data warehouse software facilitates querying and managing large datasets residing in distributed storage. Built on top of Apache Hadoop (TM), it provides * tools to enable easy data extract/transform/load (ETL) * a mechanism to impose structure on a variety of data formats * access to files stored either directly in Apache HDFS (TM) or in other data storage systems such as Apache HBase (TM) * query execution via MapReduce Hive defines a simple SQL-like query language, called HiveQL, that enables users familiar with SQL to query the data. At the same time, this language also allows programmers who are familiar with the MapReduce framework to be able to plug in their custom mappers and reducers to perform more sophisticated analysis that may not be supported by the built-in capabilities of the language. HiveQL can also be extended with custom scalar functions (UDF's), aggregations (UDAF's), and table functions (UDTF's).", "members": [], "x": -302.8, "y": 113.2}, {"i": 78, "name": "Hop", "kind": "tick", "lines": [0], "desc": "The Hop Orchestration Platform, or Apache Hop, aims to facilitate all aspects of data and metadata orchestration. Hop is an entirely new open source data integration platform that is easy to use, fast and flexible Hop aims to be the future of data integration. Visual development enables developers to be more productive than they can be through code. Our Design once, run anywhere workflows and pipelines can be designed in the Hop Gui and run on the Hop native engine (local or remote), or on Spark, Flink, Google Dataflow or AWS EMR through Beam. Lifecycle Management enables developers and administrators to switch between projects, environments and purposes without leaving your train of thought.", "members": [], "x": -363.8, "y": 182.2}, {"i": 79, "name": "HTTP Server", "kind": "tick", "lines": [2], "desc": "The Apache HTTP Server is an open-source HTTP server for modern operating systems including UNIX, Microsoft Windows, Mac OS/X and Netware. The goal of this project is to provide a secure, efficient and extensible server that provides HTTP services observing the current HTTP standards. Apache has been the most popular web server on the Internet since April of 1996.", "members": [], "x": 395.1, "y": -161.1}, {"i": 80, "name": "HttpClient 5", "kind": "hub", "lines": [1, 2], "desc": "HttpClient is a library for client-side HTTP communication built on HttpCore. It provides connection management, cookie management, and authentication. This is the successor to the widely used Jakarta Commons HttpClient 3.1.", "members": [], "x": 637.0, "y": 0.0}, {"i": 81, "name": "HttpCore", "kind": "hub", "lines": [1, 2], "desc": "HttpCore is a set of low level HTTP transport components that can be used to build custom client and server side HTTP services with a minimal footprint. HttpCore supports two I/O models: blocking I/O model based on the classic Java I/O and non-blocking, event driven I/O model based on Java NIO.", "members": [], "x": 585.0, "y": 65.0}, {"i": 82, "name": "Hudi", "kind": "tick", "lines": [1], "desc": "Hudi brings transactions, stream processing, indexes, mutability and incremental processing to data lakes.", "members": [], "x": 464.2, "y": 117.0}, {"i": 83, "name": "Iceberg", "kind": "hub", "lines": [0, 3], "desc": "Iceberg brings the reliability and simplicity of SQL tables to big data, while making it possible for engines like Spark, Trino, Flink, Presto, Hive and Impala to safely work with the same tables, at the same time.", "members": [], "x": -806.0, "y": -182.0}, {"i": 84, "name": "Ignite", "kind": "hub", "lines": [0, 2, 3, 4, 8], "desc": "Apache Ignite is a distributed database for high-performance computing with in-memory speed.", "members": [], "x": -13.0, "y": -169.0}, {"i": 85, "name": "Impala", "kind": "tick", "lines": [0], "desc": "Apache Impala is the open source, native analytic database for open data and table formats.", "members": [], "x": -331.4, "y": 214.6}, {"i": 86, "name": "InLong", "kind": "tick", "lines": [0], "desc": "Apache InLong is a one-stop, full-scenario integration framework for massive data that supports Data Ingestion, Data Synchronization, and Data Subscription, and it provides automatic, safe, reliable, and high-performance data transmission capabilities to facilitate the construction of streaming-based data analysis, modeling, and applications.", "members": [], "x": -405.8, "y": 231.2}, {"i": 87, "name": "IoTDB", "kind": "hub", "lines": [3, 8], "desc": "Apache IoTDB (Database for Internet of Things) is an integrated data management engine designed for time series data. It provides users with services for data collection, storage and analysis. Due to its light-weight architecture, high performance and rich feature set together with its deep integration with Apache Hadoop, Spark and Flink. Apache IoTDB can meet the requirements of massive data storage, high-speed data ingestion and complex data analysis in the IoT industrial fields.", "members": [], "x": -273.0, "y": 169.0}, {"i": 88, "name": "Ivy", "kind": "tick", "lines": [7], "desc": "Apache Ivy is a very powerful dependency manager oriented toward Java dependency management, even though it could be used to manage dependencies of any kind.", "members": [], "x": -208.0, "y": 351.0}, {"i": 89, "name": "IvyDE", "kind": "tick", "lines": [7], "desc": "The now retired IvyDE lets you manage your dependencies declared in an ivy.xml in your Java Eclipse projects. IvyDE will contribute to the classpath of your Java project, with the classpath container. It also bring an editor of ivy.xml files, with completion.", "members": [], "x": -156.0, "y": 351.0}, {"i": 90, "name": "Jackrabbit", "kind": "hub", "lines": [1, 2, 3, 5], "desc": "Apache Jackrabbit is a fully conforming implementation of the Content Repository for Java Technology API (JCR). A content repository is a hierarchical content store with support for structured and unstructured content, full text search, versioning, transactions, observation, and more. Typical applications that use content repositories include content management, document management, and records management systems.", "members": [], "x": -26.0, "y": -26.0}, {"i": 91, "name": "JAMES", "kind": "tick", "lines": [2], "desc": "The Apache Java Enterprise Mail Server (a.k.a. Apache James) is a 100% pure Java SMTP and POP3 Mail server and NNTP News server. We have designed James to be a complete and portable enterprise mail engine solution based on currently available open protocols. James is also a mail application platform. We have developed a Java API to let you write Java code to process emails that we call the mailet API. A mailet can generate an automatic reply, update a database, prevent spam, build a message archive, or whatever you can imagine. A matcher determines whether your mailet should process an email in the server. The James project hosts the Mailet API, and James provides an implementation of this mail application platform API.", "members": [], "x": 348.2, "y": -114.2}, {"i": 92, "name": "JDO", "kind": "tick", "lines": [3], "desc": "The POJO approach separates data manipulation (done by accessing Java data members in the Java domain objects) from database manipulation (done by calling the JDO interface methods). This separation of concerns leads to a high degree of independence of the Java view of data from the database view of the data.", "members": [], "x": -414.9, "y": -13.0}, {"i": 93, "name": "Jena", "kind": "tick", "lines": [1], "desc": "Apache Jena provides a complete framework for building Semantic Web and Linked Data applications in Java, and provides: parsers for RDF/XML, Turtle and N-triples; a Java programming API; a complete implementation of the SPARQL query language; a rule-based inference engine for RDFS and OWL entailments; TDB (a non-SQL persistent triple store); SDB (a persistent triples store built on a relational store) and Fuseki, an RDF server using web protocols. Jena complies with all relevant recommendations for RDF and related technologies from the W3C.", "members": [], "x": 326.1, "y": 195.0}, {"i": 94, "name": "JMeter", "kind": "tick", "lines": [7], "desc": "Apache JMeter may be used to test performance both on static and dynamic resources (files, Servlets, Perl scripts, Java Objects, Data Bases and Queries, FTP Servers and more). It can be used to simulate a heavy load on a server, network or object to test its strength or to analyze overall performance under different load types. You can use it to make a graphical analysis of performance or to test your server/script/object behavior under heavy concurrent load.", "members": [], "x": -240.3, "y": 643.3}, {"i": 95, "name": "JSPWiki", "kind": "tick", "lines": [6], "desc": "Apache JSPWiki is a feature-rich and extensible WikiWiki engine built around the standard JEE components (Java, servlets, JSP). It features: - WikiMarkup/Structured Text - File attachments - Templates support - Data storage through 2 WikiPage Providers, with the capability to plug new ones - Security: Authorization and authentication fine grain control - Easy plugin and page filter interfaces - UTF-8 support - JSP-based - Easy-ish installation - Page locking to prevent editing conflicts - Support for Multiple Wikis - Custom User Preferences", "members": [], "x": -78.0, "y": -234.0}, {"i": 96, "name": "Kafka", "kind": "tick", "lines": [0], "desc": "A single Kafka broker can handle hundreds of megabytes of reads and writes per second from thousands of clients. Kafka is designed to allow a single cluster to serve as the central data backbone for a large organization. It can be elastically and transparently expanded without downtime. Data streams are partitioned and spread over a cluster of machines to allow data streams larger than the capability of any single machine and to allow clusters of co-ordinated consumers. Kafka has a modern cluster-centric design that offers strong durability and fault-tolerance guarantees. Messages are persisted on disk and replicated within the cluster to prevent data loss. Each broker can handle terabytes of messages without performance impact.", "members": [], "x": -447.7, "y": 189.3}, {"i": 97, "name": "Karaf", "kind": "hub", "lines": [2, 4], "desc": "Apache Karaf is a small OSGi based runtime which provides a lightweight container onto which various components and applications can be deployed.", "members": [], "x": 78.0, "y": -247.0}, {"i": 98, "name": "Kerby", "kind": "tick", "lines": [2], "desc": "Apache Kerby, as an Apache Directory sub project, is a Java Kerberos binding. It provides a rich, intuitive and interoperable implementation, library, KDC and various facilities that integrates PKI, OTP and token (OAuth2) as desired in modern environments such as cloud, Hadoop and mobile.", "members": [], "x": 302.3, "y": -139.7}, {"i": 99, "name": "Knox", "kind": "tick", "lines": [0], "desc": "The Apache Knox Gateway is a REST API Gateway for interacting with Hadoop clusters. The Knox Gateway provides a single access point for all REST interactions with Hadoop clusters. In this capacity, the Knox Gateway is able to provide valuable functionality to aid in the control, integration, monitoring and automation of critical administrative and analytical needs of the enterprise. Authentication (LDAP and Active Directory Authentication Provider) Federation/SSO (HTTP Header Based Identity Federation) Authorization (Service Level Authorization) Auditing While there are a number of benefits for unsecured Hadoop clusters, the Knox Gateway also complements the kerberos secured cluster quite nicely. Coupled with proper network isolation of a Kerberos secured Hadoop cluster, the Knox Gateway provides the enterprise with a solution that: Integrates well with enterprise identity management solutions Protects the details of the Hadoop cluster deployment (hosts and ports are hidden from endusers) Simplifies the number of services that clients need to interact with", "members": [], "x": -468.0, "y": 138.5}, {"i": 100, "name": "Kudu", "kind": "tick", "lines": [0], "desc": "Apache Kudu is a columnar storage manager developed for the Apache Hadoop platform.", "members": [], "x": -468.0, "y": 79.4}, {"i": 101, "name": "Kylin", "kind": "tick", "lines": [0], "desc": "Apache Kylin is an open source, distributed Analytical Data Warehouse for Big Data; it was designed to provide OLAP (Online Analytical Processing) capability in the big data era. By renovating the multi-dimensional cube and precalculation technology on Hadoop and Spark, Kylin is able to achieve near constant query speed regardless of the ever-growing data volume. Reducing query latency from minutes to sub-second, Kylin brings online analytics back to big data.", "members": [], "x": -468.0, "y": 20.2}, {"i": 102, "name": "Libcloud", "kind": "hub", "lines": [1, 8], "desc": "Apache Libcloud is a standard Python library that abstracts away differences among multiple cloud provider APIs. It allows users to manage cloud servers, cloud storage and load-balancers.", "members": [], "x": -195.0, "y": 65.0}, {"i": 103, "name": "Linkis", "kind": "tick", "lines": [0], "desc": "Apache Linkis is a computation middleware project, which decouples the upper applications and the underlying data engines, provides standardized interfaces (REST, JDBC etc.) to easily connect to various underlying engines (Spark, Presto, Flink, etc.).", "members": [], "x": -842.8, "y": -145.2}, {"i": 104, "name": "log4cxx", "kind": "tick", "lines": [1], "desc": "Apache log4cxx provides logging services for C++.", "members": [], "x": 13.0, "y": 351.0}, {"i": 105, "name": "Log4j", "kind": "tick", "lines": [1], "desc": "Log4j is a versatile, feature-rich, efficient logging API and backend for Java.", "members": [], "x": -52.0, "y": 292.5}, {"i": 106, "name": "log4net", "kind": "tick", "lines": [1], "desc": "Apache log4net provides logging services for .NET.", "members": [], "x": -117.0, "y": 2.7}, {"i": 107, "name": "log4php", "kind": "tick", "lines": [1], "desc": "Apache log4php is a logging framework for PHP.", "members": [], "x": -162.5, "y": 84.5}, {"i": 108, "name": "Lucene", "kind": "hub", "lines": [1, 3, 6], "desc": "Apache Lucene is a high-performance, full-featured text search engine library written entirely in Java. It is a technology suitable for nearly any application that requires full-text search, especially cross-platform.", "members": [], "x": -91.0, "y": 169.0}, {"i": 109, "name": "Lucene.Net", "kind": "tick", "lines": [3], "desc": "Lucene.Net is a port of the Lucene search engine library, written in C# and targeted at .NET runtime users. The Lucene search library is based on an inverted index. Lucene.Net has three primary goals: 1. Maintain the existing line-by-line port from Java to C#, fully automating and commoditizing the process such that the project can easily synchronize with the Java Lucene release schedule; 2. Maintaining the high-performance requirements expected of a first class C# search engine library; 3. Maximize usability and power when used within the .NET runtime. To that end, it will present a highly idiomatic, carefully tailored API that takes advantage of many of the special features of the .NET runtime.", "members": [], "x": -769.2, "y": -218.8}, {"i": 110, "name": "Magpie", "kind": "tick", "lines": [7], "desc": "Apache Magpie is a project-agnostic, agent-assisted maintainership and development framework that any open-source project — ASF or not — can adopt. It ships independently-toggleable modes (Triage, Mentoring, Drafting, Pairing, and Auto-merge) as reusable agent skills, so each project picks the automation level that fits its culture and risk tolerance. Magpie covers security-issue handling, contributor mentoring, agent-drafted remediation under human review, and developer-side development-cycle workflows, with a privacy-aware model-routing posture for sensitive content.", "members": [], "x": -104.0, "y": 351.0}, {"i": 111, "name": "Mahout", "kind": "tick", "lines": [1], "desc": "Scalable machine learning library", "members": [], "x": -195.0, "y": 117.0}, {"i": 112, "name": "ManifoldCF", "kind": "tick", "lines": [6], "desc": "ManifoldCF is an effort to provide an open source framework for connecting source content repositories like Microsoft Sharepoint and EMC Documentum, to target repositories or indexes, such as Apache Solr , OpenSearchServer or ElasticSearch. ManifoldCF also defines a security model for target repositories that permits them to enforce source-repository security policies.", "members": [], "x": -78.0, "y": -182.0}, {"i": 113, "name": "Maven", "kind": "tick", "lines": [7], "desc": "Maven is a project development management and comprehension tool. Based on the concept of a project object model: builds, dependency management, documentation creation, site publication, and distribution publication are all controlled from the declarative file. Maven can be extended by plugins to utilise a number of other development tools for reporting or the build process.", "members": [], "x": -52.0, "y": 403.0}, {"i": 114, "name": "Maven Doxia", "kind": "tick", "lines": [7], "desc": "Doxia is a content generation framework which aims to provide its users with powerful techniques for generating static and dynamic content: Doxia can be used in web-based publishing context to generate static sites, in addition to being incorporated into dynamic content generation systems like blogs, wikis and content management systems.", "members": [], "x": -52.0, "y": 455.0}, {"i": 115, "name": "MINA", "kind": "tick", "lines": [2], "desc": "Apache MINA is a network application framework which helps users develop high performance and high scalability network applications easily. It provides an abstract, event-driven, asynchronous API over various transports such as TCP/IP and UDP/IP via Java NIO.", "members": [], "x": 286.0, "y": -183.5}, {"i": 116, "name": "mod_ftp", "kind": "tick", "lines": [2], "desc": "mod_ftp is an FTP Protocol module to serve httpd content over the FTP protocol (whereever the HTTP protocol could also be used). It provides both RETR/REST retrieval and STOR/APPE upload, using the same user/permissions model as httpd (so it shares the same security considerations as mod_dav plus mod_dav_fs).", "members": [], "x": 249.5, "y": -270.5}, {"i": 117, "name": "mod_perl", "kind": "tick", "lines": [2], "desc": "mod_perl is a unique piece of software that integrates the power of Perl with the flexibility and stability of the Apache Web server. With mod_perl, you can harness the power of the full Apache API with Perl and develop Web applications quickly, without sacrificing performance.", "members": [], "x": 169.0, "y": -46.2}, {"i": 118, "name": "MyFaces", "kind": "tick", "lines": [4], "desc": "MyFaces is the free open source implementation of Jakarta Server Faces, a web application framework that accomplishes the MVC paradigm. It is comparable to the well-known Struts Framework but has features and concepts that are beyond those of Struts - especially the component orientation.", "members": [], "x": -2.2, "y": 140.8}, {"i": 119, "name": "Mynewt", "kind": "tick", "lines": [8], "desc": "Apache Mynewt is a community-driven module OS for constrained, embedded applications. Mynewt provides a real-time operating system, flash file system, network stacks, and support utilities for real-world embedded systems. Its goal is to make it easy to develop applications for microcontroller environments where power and cost are driving factors.", "members": [], "x": -474.3, "y": 383.3}, {"i": 120, "name": "Neethi", "kind": "tick", "lines": [5], "desc": "Apache Neethi is a Java implementation of the WS-Policy Specification.", "members": [], "x": -403.0, "y": -78.0}, {"i": 121, "name": "NetBeans", "kind": "tick", "lines": [7], "desc": "Apache NetBeans is and IDE for many language (java, php, ...). Apache NetBeans is a platform that can be extended by third party developer.", "members": [], "x": -292.3, "y": 643.3}, {"i": 122, "name": "NiFi", "kind": "tick", "lines": [0], "desc": "The mission of NiFi is the creation and maintenance of software related to providing an easy to use, powerful, and reliable system to process and distribute data. Apache NiFi MiNiFi is an edge data collection agent built to seamlessly integrate with and leverage the command and control of NiFi. Apache NiFi Registry is a centralized registry for key configuration items including flow versions, assets, and extensions for Apache NiFi and Apache MiNiFi.", "members": [], "x": -879.5, "y": -108.5}, {"i": 123, "name": "Nutch", "kind": "tick", "lines": [4], "desc": "Apache Nutch is a highly extensible and scalable open source web crawler software project. Stemming from Apache Lucene, Nutch is a well matured, production ready batch crawler relying on Apache Hadoop data structures, which are great for batch processing. Nutch has a modular architecture and provides pluggable and extensible interfaces such as Parse, Index and ScoringFilter's for custom implementations e.g. Apache Tika for parsing. Additionally, pluggable indexers exists for Apache Solr, Elastic Search, etc. Nutch can run on a single machine, but gains a lot of its strength from running in a Hadoop cluster. The now retired branch Nutch 2.x differed from 1.x in one key area: storage is abstracted away from any specific underlying data store by using Apache Gora for handling object to persistent mappings and to store fetch time, status, content, parsed text, outlinks, inlinks, etc. into a number of NoSQL storage solutions.", "members": [], "x": 36.0, "y": -120.0}, {"i": 124, "name": "OFBiz", "kind": "hub", "lines": [2, 3, 4, 5, 6], "desc": "Apache OFBiz is an open source product for the automation of enterprise processes that includes framework components and business applications for ERP (Enterprise Resource Planning), CRM (Customer Relationship Management), E-Business / E-Commerce, SCM (Supply Chain Management), MRP (Manufacturing Resource Planning), MMS/EAM (Maintenance Management System/Enterprise Asset Management). Apache OFBiz provides a foundation and starting point for reliable, secure and scalable enterprise solutions, see https://ofbiz.apache.org/ for more.", "members": [], "x": 39.0, "y": -52.0}, {"i": 125, "name": "OpenDAL", "kind": "tick", "lines": [0], "desc": "Apache OpenDAL is a data access layer that allows users to easily and efficiently retrieve data from various storage services in a unified way.", "members": [], "x": -767.9, "y": 286.5}, {"i": 126, "name": "OpenJPA", "kind": "hub", "lines": [1, 3, 4], "desc": "Apache OpenJPA is a Java persistence project at The Apache Software Foundation that can be used as a stand-alone POJO persistence layer or integrated into any Java EE compliant container and many other lightweight frameworks, such as Tomcat and Spring. The 1.x releases are a production ready, feature-rich, compliant implementation of the Java Persistence API (JPA) 1.0 part of the JSR-220 Enterprise Java Beans 3.0 specification, which pass the Sun JPA 1.0b Technology Compatibility Kit. The 2.x releases are a production ready, compliant implement of the JSR-317 Java Persistence 2.0 specification, which is backwards compatible to the JPA 1.0 specification and passes the Sun JPA 2.0 Technology Compatibility Kit.", "members": [], "x": -39.0, "y": 104.0}, {"i": 127, "name": "OpenMeetings", "kind": "tick", "lines": [2], "desc": "The Apache OpenMeetings provides video conferencing, instant messaging, white board, collaborative document editing and other groupware tools. Kurento Media Server is used or audio/video communication.", "members": [], "x": 213.1, "y": -239.1}, {"i": 128, "name": "OpenNLP", "kind": "tick", "lines": [1], "desc": "Apache OpenNLP software supports the most common NLP tasks, such as tokenization, sentence segmentation, part-of-speech tagging, named entity extraction, chunking, parsing, and coreference resolution. These tasks are usually required to build more advanced text processing services. OpenNLP also includes maximum entropy and perceptron based machine learning.", "members": [], "x": -263.0, "y": 166.0}, {"i": 129, "name": "OpenOffice", "kind": "tick", "lines": [6], "desc": "Apache OpenOffice is a leading open-source, office-document productivity suite providing six productivity applications (Writer, Calc, Impress, Draw, Math, Base) based around the OpenDocument Format (ODF). OpenOffice is released on Windows, macOS (OS X), Linux 32-bit DEB+RPM, Linux 64-bit DEB+RPM and in 41 languages.", "members": [], "x": 93.2, "y": 0.0}, {"i": 130, "name": "OpenWebBeans", "kind": "tick", "lines": [4], "desc": "OpenWebBeans is an ALv2-licensed implementation of the \"Contexts and Dependency Injection for the Java EE platform\" specification which is defined as JSR-299.", "members": [], "x": 598.0, "y": 195.0}, {"i": 131, "name": "ORC", "kind": "hub", "lines": [0, 1, 3], "desc": "ORC is a self-describing type-aware columnar file format designed for Hadoop workloads. It is optimized for large streaming reads, but with integrated support for finding required rows quickly. Storing data in a columnar format lets the reader read, decompress, and process only the values that are required for the current query.", "members": [], "x": -351.0, "y": -13.0}, {"i": 132, "name": "Ozone", "kind": "tick", "lines": [0], "desc": "Apache Ozone is a highly scalable, distributed storage for Analytics, Big data and Cloud Native applications. Ozone supports S3 compatible object APIs as well as a Hadoop Compatible File System implementation. It is optimized for both efficient object store and file system operations. It is built on a highly available, replicated block storage layer called Hadoop Distributed Data Store (HDDS). Applications using frameworks like Apache Spark, YARN and Hive work natively without any modifications.", "members": [], "x": -916.3, "y": -71.7}, {"i": 133, "name": "Parquet", "kind": "tick", "lines": [0], "desc": "Apache Parquet is an open source, column-oriented data file format designed for efficient data storage and retrieval. It provides high performance compression and encoding schemes to handle complex data in bulk and is supported in many programming language and analytics tools.", "members": [], "x": -953.1, "y": -34.9}, {"i": 134, "name": "PDFBox", "kind": "hub", "lines": [1, 6], "desc": "The Apache PDFBox library is an open source Java tool for working with PDF documents.", "members": [], "x": 234.0, "y": 247.0}, {"i": 135, "name": "Phoenix", "kind": "hub", "lines": [0, 3], "desc": "Apache Phoenix enables OLTP and operational analytics for Apache Hadoop by providing a relational database layer leveraging Apache HBase as its backing store. It includes integration with Apache Spark, Pig, Flume, Map Reduce, and other products in the Hadoop ecosystem. It is accessed as a JDBC driver and enables querying, updating, and managing HBase tables through standard SQL.", "members": [], "x": -468.0, "y": -39.0}, {"i": 136, "name": "Pig", "kind": "tick", "lines": [3], "desc": "Apache Pig is a platform for analyzing large data sets that consists of a high-level language for expressing data analysis programs, coupled with infrastructure for evaluating these programs. The salient property of Pig programs is that their structure is amenable to substantial parallelization, which in turns enables them to handle very large data sets. Pig's infrastructure layer consists of a compiler that produces sequences of Map-Reduce programs. Pig's language layer consists of a textual language called Pig Latin, which has the following key properties: * Ease of programming. It is trivial to achieve parallel execution of simple, \"embarrassingly parallel\" data analysis tasks. Complex tasks comprised of multiple interrelated data transformations are explicitly encoded as data flow sequences, making them easy to write, understand, and maintain. * Optimization opportunities. The way in which tasks are encoded permits the system to optimize their execution automatically, allowing the user to focus on semantics rather than efficiency. * Extensibility. Users can create their own functions to do special-purpose processing.", "members": [], "x": -732.5, "y": -255.5}, {"i": 137, "name": "Pinot", "kind": "tick", "lines": [0], "desc": "Apache Pinot is a real-time distributed online analytical processing (OLAP) datastore. Use Pinot to ingest and immediately query data from streaming or batch data sources (including, Apache Kafka, Amazon Kinesis, Hadoop HDFS, Amazon S3, Azure ADLS, and Google Cloud Storage). Apache Pinot includes the following: Ultra low-latency analytics even at extremely high throughput. Columnar data store with several smart indexing and pre-aggregation techniques. Scaling up and out with no upper bound. Consistent performance based on the size of your cluster and an expected query per second (QPS) threshold. It's perfect for user-facing real-time analytics and other analytical use cases, including internal dashboards, anomaly detection, and ad hoc data exploration.", "members": [], "x": -989.8, "y": 1.8}, {"i": 138, "name": "PLC4X", "kind": "hub", "lines": [1, 2, 8], "desc": "PLC4X is a set of libraries for communicating with industrial programmable logic controllers (PLCs) using a variety of protocols but with a shared API.", "members": [], "x": -156.0, "y": -13.0}, {"i": 139, "name": "POI", "kind": "hub", "lines": [1, 6], "desc": "APIs for manipulating various file formats based upon Open Office XML (ECMA-376) and Microsoft's OLE 2 Compound Document formats using pure Java. Apache POI is your Java Excel, Word and PowerPoint solution. We have a complete API for porting other OOXML and OLE 2 Compound Document formats and welcome others to participate.", "members": [], "x": 91.0, "y": 312.0}, {"i": 140, "name": "Polaris", "kind": "hub", "lines": [0, 3], "desc": "Apache Polaris implements the Apache Iceberg REST API, enabling seamless multi-engine interoperability across a wide range of platforms, including Apache Doris, Apache Flink, Apache Spark, ...", "members": [], "x": -546.0, "y": -65.0}, {"i": 141, "name": "Pony Mail", "kind": "hub", "lines": [2, 6], "desc": "Apache Pony Mail is a web-based mail archive browser and interaction platform for mailing lists. It provides full-text search, threading, and real-time interaction with archived mailing lists, and is the engine behind lists.apache.org.", "members": [], "x": 169.0, "y": 0.0}, {"i": 142, "name": "PouchDB", "kind": "hub", "lines": [2, 3, 6], "desc": "PouchDB is an open-source JavaScript database inspired by Apache CouchDB that is designed to run well within the browser. PouchDB was created to help web developers build applications that work as well offline as they do online. It enables applications to store data locally while offline, then synchronize it with CouchDB and compatible servers when the application is back online, keeping the user's data in sync no matter where they next log in.", "members": [], "x": -13.0, "y": -104.0}, {"i": 143, "name": "Props Ant", "kind": "tick", "lines": [7], "desc": "The Apache Props Antlib is a library of supplementary handlers for Apache Ant properties resolution. The types provided are instances of org.apache.tools.ant.PropertyHelper.Delegate and can be invoked using the <propertyhelper> task provided in Ant 1.8.0.", "members": [], "x": -52.0, "y": 507.0}, {"i": 144, "name": "Pulsar", "kind": "tick", "lines": [0], "desc": "Apache Pulsar is an all-in-one messaging and streaming platform. Messages can be consumed and acknowledged individually or consumed as streams with less than 10ms of latency. Its layered architecture allows rapid scaling across hundreds of nodes, without data reshuffling. Its features include multi-tenancy with resource separation and access control, geo-replication across regions, tiered storage and support for six official client languages. It supports up to one million unique topics and is designed to simplify your application architecture.", "members": [], "x": -1008.2, "y": 46.2}, {"i": 145, "name": "PyLucene", "kind": "hub", "lines": [1, 6], "desc": "PyLucene is a Python extension for accessing Java Lucene TM. Its goal is to allow you to use Lucene's text indexing and searching capabilities from Python.", "members": [], "x": 273.0, "y": 169.0}, {"i": 146, "name": "Qpid", "kind": "tick", "lines": [2], "desc": "Apache Qpid implements the latest AMQP specification, the first open standard for enterprise messaging, and provides transaction management, queuing, distribution, security, management, clustering, federation and heterogeneous multi-platform support and a lot more.", "members": [], "x": 42.8, "y": -282.2}, {"i": 147, "name": "Ranger", "kind": "hub", "lines": [0, 2], "desc": "Apache Ranger is a framework to enable, monitor and manage comprehensive data security - consistently across various data processing services. Integrated with most of the Big-Data technologies (Hadoop, Hive, HBase, Spark, Trino, ...)", "members": [], "x": -39.0, "y": -325.0}, {"i": 148, "name": "Rat", "kind": "tick", "lines": [7], "desc": "Apache Rat improves accuracy and efficiency when reviewing and auditing releases. It is heuristic in nature: making guesses about possible problems. It will produce false positives and cannot find every possible issue with a release. It's reports require interpretation. Apache Rat was developed in response to a need felt in the Apache Incubator to be able to review releases for the most common faults less labour intensively. It is therefore highly tuned to the Apache style of releases.", "members": [], "x": -70.4, "y": 551.4}, {"i": 149, "name": "rivet", "kind": "tick", "lines": [6], "desc": "Apache Rivet is a system for creating dynamic web content via the Tcl programming language integrated with Apache Web Server. It is designed to be fast, powerful and extensible, consume few system resources, be easy to learn, and to provide the user with a platform that can also be used for other programming tasks outside the web (GUI's, system administration tasks, text processing, database manipulation, XML, and so on). In order to meet these goals Tcl programming language was chosen to combine with the Apache HTTP Server.", "members": [], "x": -208.0, "y": 117.0}, {"i": 150, "name": "Roller", "kind": "tick", "lines": [6], "desc": "Apache Roller is a full-featured, multi-user and group-blog server suitable for blog sites large and small. It runs as a Java web application that should be able to run on most any Java EE server and relational database. Roller's installation guide covers deployment on Tomcat, GlassFish, and JBoss application servers using a MySQL, Derby, or PostgreSQL database. Users however have reported success running Roller on other app servers and databases. - Multi-user blogging: can support tens of thousands of users and blogs - Group blogging with three permisson levels (editor, author and limited) - Support for comment moderation and comment spam prevention measures - Bloggers have complete control over blog layout/style via Apache Velocity-driven templates - Built-in search engine indexes weblog entry content - Pluggable cache and rendering system - Support for blog clients that support MetaWeblog API - All blogs have entry and comment feeds in both RSS 2.0 and Atom 1.0 formats", "members": [], "x": -260.0, "y": 117.0}, {"i": 151, "name": "Royale", "kind": "tick", "lines": [4], "desc": "Apache Royale implements the principles of Apache Flex to support development of applications designed for JavaScript instead of Adobe Flash/AIR runtimes. Apache Royale improves developer productivity in creating applications to run wherever JavaScript runs, including on browsers, in Apache Cordova applications, on Node, and on other platforms.", "members": [], "x": 34.4, "y": -203.4}, {"i": 152, "name": "Samza", "kind": "tick", "lines": [0], "desc": "Apache Samza provides a system for processing stream data from publish-subscribe systems such as Apache Kafka. The developer writes a stream processing task, and executes it as a Samza job. Samza then routes messages between stream processing tasks and the publish-subscribe systems that the messages are addressed to.", "members": [], "x": -1008.2, "y": 98.2}, {"i": 153, "name": "Sandesha2", "kind": "tick", "lines": [5], "desc": "Apache Sandesha2 is an Axis2 module that implements the WS-ReliableMessaging specification. It can be used both on the client side and on the server side.", "members": [], "x": -351.0, "y": -78.0}, {"i": 154, "name": "Santuario", "kind": "hub", "lines": [1, 2, 5], "desc": "Library implementing XML Digital Signature Specification & XML Encryption Specification", "members": [], "x": 455.0, "y": -143.0}, {"i": 155, "name": "SeaTunnel", "kind": "tick", "lines": [0], "desc": "SeaTunnel is a next-generation super high-performance, distributed, massive data integration tool. It can synchronize tens of billions of data stably and efficiently every day, and has been used in the production of many companies.", "members": [], "x": -1008.2, "y": 150.2}, {"i": 156, "name": "Serf", "kind": "tick", "lines": [1], "desc": "The serf library is a high performance C-based HTTP client library built upon the Apache Portable Runtime (APR) library", "members": [], "x": -205.8, "y": -192.8}, {"i": 157, "name": "Shiro", "kind": "hub", "lines": [1, 4], "desc": "Apache Shiro is a powerful and flexible open-source security framework that cleanly handles authentication, authorization, enterprise session management, single sign-on and cryptography services.", "members": [], "x": 390.0, "y": 195.0}, {"i": 158, "name": "SIS", "kind": "hub", "lines": [1, 3], "desc": "Apache SIS provides data structures for geographic data and associated metadata along with methods to manipulate those data structures. The library is an implementation of GeoAPI interfaces and can be used for desktop or server applications.", "members": [], "x": -195.0, "y": 169.0}, {"i": 159, "name": "SkyWalking", "kind": "tick", "lines": [8], "desc": "Use Apache SkyWalking when you need an application performance monitor tool for distributed systems, especially designed for microservices, cloud native and container-based (Docker, K8s, Mesos) architectures.", "members": [], "x": -511.1, "y": 420.1}, {"i": 160, "name": "Solr", "kind": "hub", "lines": [2, 4, 6], "desc": "Solr is an open source enterprise search server based on the Lucene Java search library, with Rest-like JSON/HTTP APIs, high performance, high availability, powerful analytics, hit highlighting, faceted search, caching, replication, and a web administration interface.", "members": [], "x": 247.0, "y": 13.0}, {"i": 161, "name": "Solr Operator", "kind": "hub", "lines": [6, 8], "desc": "Manages Solr resources in Kubernetes", "members": [], "x": -156.0, "y": 117.0}, {"i": 162, "name": "Spark", "kind": "tick", "lines": [0], "desc": "Apache Spark is a fast and general engine for large-scale data processing. It offers high-level APIs in Java, Scala, Python and R, as well as a rich set of libraries including stream processing, machine learning, and graph analytics.", "members": [], "x": -989.8, "y": 194.6}, {"i": 163, "name": "SSHD", "kind": "tick", "lines": [2], "desc": "Apache SSHD is a 100% pure java library to support the SSH protocols on both the client and server side. This library is based on Apache MINA, a scalable and high performance asynchronous IO library. SSHD does not really aim at being a replacement for the SSH client or SSH server from Unix operating systems, but rather provides support for Java based applications requiring SSH support.", "members": [], "x": 7.6, "y": -317.4}, {"i": 164, "name": "STeVe", "kind": "tick", "lines": [1], "desc": "Apache STeVe is a collection of online voting tools, used by the ASF, to handle STV and other voting methods.", "members": [], "x": -242.5, "y": -229.5}, {"i": 165, "name": "Storm", "kind": "tick", "lines": [0], "desc": "Apache Sto
