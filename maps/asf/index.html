iry.html">interactive</a></small></figcaption></figure><figure><a href="landscape.html"><img src="landscape.png" alt="landscape" loading="lazy"></a><figcaption><b>landscape</b> — Wide 16:9 layout for slides and screens, with mostly horizontal runs.<br><small>11 crossings · longest straight run 7.2 stations · empty-space radius 4.93 · 1 label clashes · <a href="landscape.svg">svg</a> · <a href="landscape.html">interactive</a></small></figcaption></figure><figure><a href="grid.html"><img src="grid.png" alt="grid" loading="lazy"></a><figcaption><b>grid</b> — Grid look: pure 90° routes on a coarse grid, like a circuit board.<br><small>50 crossings · longest straight run 9.0 stations · empty-space radius 4.22 · 1 label clashes · <a href="grid.svg">svg</a> · <a href="grid.html">interactive</a></small></figcaption></figure></main>
