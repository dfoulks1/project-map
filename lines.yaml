# Configuration for scripts/build_map.py
#
# Each "line" is a set of projects.yaml categories merged into one metro line.
# A project that appears in categories of two or more lines becomes an
# interchange station. Categories not listed here are ignored.

title: The Apache Projects Underground
subtitle: "Top-level projects by area  ·  data: projects.apache.org"
credit: "Style after the London Underground diagram (H. Beck) and the STM Métro de Montréal"

spacing: 52        # px between neighbouring stations along a line
tail_max: 4        # stations at each end of a line before the rest move between interchanges
seg_max: 5         # most private stations between two interchanges
restarts: 24       # random layout restarts; the best (fewest crossings) wins
seed: 7            # same seed + same inputs = same map

# --- station-name cleanup ---------------------------------------------------
strip_prefix: "Apache "
strip_text:                 # removed from names anywhere they appear
  - " (Dormant)"
collapse:                   # many sub-projects drawn as one station
  - { prefix: "Commons ", name: "Commons" }
  - { prefix: "Velocity ", name: "Velocity" }
short_names:                # long names that would not fit on the map
  "Xalan for C++ XSLT Processor": "Xalan C++"
  "Xalan for Java XSLT Processor": "Xalan Java"
  "Xerces for C++ XML Parser": "Xerces C++"
  "Xerces for Java XML Parser": "Xerces Java"
  "Xerces for Perl XML Parser": "Xerces Perl"
  "XML Commons External": "XML Commons Ext"
  "XML Commons Resolver": "XML Commons Res"
  "Spatial Information System": "SIS"
  "Portable Runtime": "APR"
  "Lucene Core": "Lucene"
  "HttpComponents Client": "HttpClient 5"
  "HttpComponents Core": "HttpCore"
  "XML Graphics Commons": "XG Commons"
  "Directory LDAP API": "Directory LDAP"
  "CycloneDX Ant Library": "CycloneDX Ant"
  "Compress Ant Library": "Compress Ant"
  "Props Ant Library": "Props Ant"

# --- the lines ---------------------------------------------------------------
lines:
  - name: Big Data
    color: "#E32017"
    categories: [big-data, hadoop, data-engineering]
  - name: Libraries
    color: "#0019A8"
    categories: [library, groovy]
  - name: Networking
    color: "#00782A"
    categories: [network-server, http, httpd-module, mail, ftp, network-client,
                 integration, mobile, security, identity-management,
                 identity-provisioning, SDK]
  - name: Data Stores
    color: "#9B0056"
    categories: [database, sql, distributed-sql-database, data-management-platform, geospatial]
  - name: Frameworks
    color: "#FFD300"
    categories: [web-framework, javaee, templating, html, osgi]
  - name: XML & Graphics
    color: "#B36305"
    categories: [xml, graphics]
  - name: Content & Search
    color: "#0098D4"
    categories: [content, search, data-visualization]
  - name: Build & Test
    color: "#8A9199"
    categories: [build-management, testing, ide]
  - name: Cloud & IoT
    color: "#EE7C0E"
    categories: [cloud, iot, observability]

# --- look & feel ---------------------------------------------------------------
# Defaults for every build.  Variants below override any of these.
style:
  line_width: 7        # px
  bundle_gap: 6.5      # px between parallel tracks where lines share a corridor
  tick_len: 14
  hub_gap: 1.15        # min distance between interchanges, in station spacings
  snap_div: 4          # interchanges snap to a grid of spacing/snap_div
  route_style: mixed   # mixed | diag | ortho  (0/45/90 degree)  |  manhattan (90 degree only)
  max_run: 4           # stations in a straight piece before it counts as a straightaway
  terminus_boxes: false   # Montreal-style coloured boxes at the end of each line
  label_size: 10.5
  hub_label_size: 12

finalists: 4           # best layouts (by a quick score) that are fully routed and compared

# --- named variants (python3 scripts/build_map.py --all-variants maps/options) -----
variants:
  london:
    description: "London Underground look: slim lines, ticks, ring interchanges; roughly square."
    seed: 11
    aspect: 1.0
    tail_max: 4
  montreal:
    description: "Montréal Métro look: fat lines, coloured terminus boxes, short curled tails."
    seed: 23
    aspect: 1.25
    tail_max: 3
    spacing: 56
    style: {line_width: 11, bundle_gap: 11.5, tick_len: 19, hub_gap: 1.35, max_run: 3,
            terminus_boxes: true, label_size: 11.5, hub_label_size: 13}
  compact:
    description: "As small as it gets: tight spacing, very short tails, stations pushed in between interchanges."
    seed: 31
    aspect: 1.0
    spacing: 44
    tail_max: 2
    seg_max: 6
    style: {max_run: 3, hub_gap: 1.05}
  airy:
    description: "Roomy and easy to read: wide spacing, bigger type, extra room around interchanges."
    seed: 41
    aspect: 1.2
    spacing: 64
    tail_max: 3
    style: {line_width: 8, bundle_gap: 10, tick_len: 16, hub_gap: 1.6, max_run: 3,
            label_size: 12.5, hub_label_size: 14}
  landscape:
    description: "Wide 16:9 layout for slides and screens, with mostly horizontal runs."
    seed: 53
    aspect: 1.8
    tail_max: 3
    spacing: 50
    style: {route_style: ortho, max_run: 4}
  grid:
    description: "Grid look: pure 90° routes on a coarse grid, like a circuit board."
    seed: 67
    aspect: 1.0
    tail_max: 3
    spacing: 54
    style: {route_style: manhattan, snap_div: 2, hub_gap: 1.3, max_run: 5}
