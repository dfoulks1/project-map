      your documents with JavaScript. Apache CouchDB works well with modern web and mobile apps. CouchDB's
      killer feature is its ability to distribute data efficiently using Apache CouchDB’s incremental
      replication. Apache CouchDB supports master-master setups with automatic conflict detection.
    languages: *id002
- Apache cTAKES:
    description: Apache clinical Text Analysis and Knowledge Extraction System (cTAKES) is an open-source
      natural language processing system for information extraction from electronic medical record clinical
      free-text. It processes clinical notes, identifying types of clinical named entities from various
      dictionaries including the Unified Medical Language System (UMLS) - medications, diseases/disorders,
      signs/symptoms, anatomical sites and procedures. Each named entity has attributes for the text span,
      the ontology mapping code, subject (patient, family member, etc.) and context (negated/not negated,
      conditional, generic, degree of certainty). Some of the attributes are expressed as relations, for
      example the location of a clinical condition (locationOf relation) or the severity of a clinical
      condition (degreeOf relation).
    languages: &id031
    - Java
    - Python
    - Scala
- Apache FreeMarker:
    description: 'Apache FreeMarker is a template engine: a Java library to generate text output (HTML
      web pages, e-mails, configuration files, source code, etc.) based on templates and changing data.
      Templates are written in the FreeMarker Template Language (FTL), which is a simple, specialized
      language (not a full-blown programming language). Usually, a general-purpose programming language
      (like Java) is used to prepare the data (issue database queries, do business calculations). Then,
      Apache FreeMarker displays that prepared data using templates. In the template you are focusing
      on how to present the data, and outside the template you are focusing on what data to present.'
    languages: &id017
    - Java
- Apache JSPWiki:
    description: 'Apache JSPWiki is a feature-rich and extensible WikiWiki engine built around the standard
      JEE components (Java, servlets, JSP). It features: - WikiMarkup/Structured Text - File attachments
      - Templates support - Data storage through 2 WikiPage Providers, with the capability to plug new
      ones - Security: Authorization and authentication fine grain control - Easy plugin and page filter
      interfaces - UTF-8 support - JSP-based - Easy-ish installation - Page locking to prevent editing
      conflicts - Support for Multiple Wikis - Custom User Preferences'
    languages:
    - Java
- Apache ManifoldCF:
    description: ManifoldCF is an effort to provide an open source framework for connecting source content
      repositories like Microsoft Sharepoint and EMC Documentum, to target repositories or indexes, such
      as Apache Solr , OpenSearchServer or ElasticSearch. ManifoldCF also defines a security model for
      target repositories that permits them to enforce source-repository security policies.
    languages:
