- Apache Roller:
    description: 'Apache Roller is a full-featured, multi-user and group-blog server suitable for blog
      sites large and small. It runs as a Java web application that should be able to run on most any
      Java EE server and relational database. Roller''s installation guide covers deployment on Tomcat,
      GlassFish, and JBoss application servers using a MySQL, Derby, or PostgreSQL database. Users however
      have reported success running Roller on other app servers and databases. - Multi-user blogging:
      can support tens of thousands of users and blogs - Group blogging with three permisson levels (editor,
      author and limited) - Support for comment moderation and comment spam prevention measures - Bloggers
      have complete control over blog layout/style via Apache Velocity-driven templates - Built-in search
      engine indexes weblog entry content - Pluggable cache and rendering system - Support for blog clients
      that support MetaWeblog API - All blogs have entry and comment feeds in both RSS 2.0 and Atom 1.0
      formats'
    languages:
    - Java
- Apache Tika:
    description: The Apache Tika toolkit is an ASFv2 licensed open source tool for extracting information
      from digital documents. Tika allows search engines, content management systems and other applications
      that work with various kinds of digital documents to easily detect and extract metadata and content
      from all major file formats.
    languages: &id046
    - Java
- Apache Whimsy:
