- Apache IoTDB:
    description: Apache IoTDB (Database for Internet of Things) is an integrated data management engine
      designed for time series data. It provides users with services for data collection, storage and
      analysis. Due to its light-weight architecture, high performance and rich feature set together with
      its deep integration with Apache Hadoop, Spark and Flink. Apache IoTDB can meet the requirements
      of massive data storage, high-speed data ingestion and complex data analysis in the IoT industrial
      fields.
    languages: &id022
    - Java
    - Python
    - C++
    - C
    - Go
    - C#
    - Node.js
- Apache Jackrabbit:
    description: Apache Jackrabbit is a fully conforming implementation of the Content Repository for
      Java Technology API (JCR). A content repository is a hierarchical content store with support for
      structured and unstructured content, full text search, versioning, transactions, observation, and
      more. Typical applications that use content repositories include content management, document management,
      and records management systems.
    languages: &id039
    - Java
- Apache JDO:
    description: The POJO approach separates data manipulation (done by accessing Java data members in
      the Java domain objects) from database manipulation (done by calling the JDO interface methods).
      This separation of concerns leads to a high degree of independence of the Java view of data from
