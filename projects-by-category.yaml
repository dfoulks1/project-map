      for HTTP/1.1 and HTTP/1.0, plus various authentication schemes and cookie policies. Thanks to it's
      widespread use and years of development, it is a very mature and stable codebase. However, due to
      limitations in the API design, Commons HttpClient will eventually be replaced by HttpClient 4.0
      with a completely redesigned API based on HttpCore.
    languages: *id030
- Apache CouchDB:
    description: Apache CouchDB is a database that completely embraces the web. Store your data with JSON
