- Apache Derby:
    description: Apache Derby is an open source relational database implemented entirely in Java. It has
      a small footprint that makes it easy to embed in any Java-based application, but it also supports
      the more familiar client/server mode. It is based on the Java, JDBC, and SQL standards, making code
      developed more portable to standards-compliant databases. The developer community voted to retire
      the project and move it into a read-only mode as of 2025-10-10. See https://lists.apache.org/thread/q7xnvbyo818vvtyh2b5oljr8won4zjx7
    languages:
    - Java
- Apache Doris:
    description: Apache Doris is an easy-to-use, high-performance and real-time analytical database based
      on MPP architecture, known for its extreme speed and ease of use. It only requires a sub-second
      response time to return query results under massive data and can support not only high-concurrent
      point query scenarios but also high-throughput complex analysis scenarios. All this makes Apache
      Doris an ideal tool for scenarios including report analysis, ad-hoc query, unified data warehouse,
      and data lake query acceleration. On Apache Doris, users can build various applications, such as
      user behavior analysis, AB test platform, log retrieval analysis, user portrait analysis, and order
      analysis.
    languages:
    - C++
    - Java
- Apache Druid:
    description: Apache Druid is a high performance real-time analytics database. Druid's main value add
      is to reduce time to insight and action. Apache Druid is designed for workflows where fast queries
      and ingest really matter. Druid excels at powering UIs, running operational (ad-hoc) queries, or
      handling high concurrency. Consider Druid as an open source alternative to data warehouses for a
      variety of use cases.
    languages: *id011
- Apache Empire-db:
    description: Apache Empire-db is intended for developers who strive to have full SQL freedom when
      formulating queries and DML-Statements - without ever having to use string literals - and who also
      want to be able to control when and how statements are executed. Unlike other approaches Empire-db
      does not rely on Java Annotations or Mapping-files for building queries but rather uses a Java Object
      model that is easy to access and extend. For Data Access and Data Interchange developers can choose
      between traditional Java Beans and a more sophisticated dynamic interface provided by Record and
      DataListEntriy classes. Empire-db is DBMS vendor independent and provides handlers for Oracle, Microsoft
      SQLServer, PostgreSQL, MySQL, HsqlDB, Derby, H2 and more.
    languages:
    - Java
- Apache Geode:
    description: Apache Geode is a data management platform that provides real-time, consistent access
      to data-intensive applications throughout widely distributed cloud architectures. Geode pools memory,
      CPU, network resources, and optionally local disk across multiple processes to manage application
      objects and behavior. It uses dynamic replication and data partitioning techniques to implement
      high availability, improved performance, scalability, and fault tolerance. In addition to being
      a distributed data container, Geode is an in-memory data management system that provides reliable
      asynchronous event notifications and guaranteed message delivery.
    languages:
    - Java
- Apache HBase:
    description: 'Use Apache HBase software when you need random, realtime read/write access to your Big
      Data. This project''s goal is the hosting of very large tables -- billions of rows X millions of
      columns -- atop clusters of commodity hardware. HBase is an open-source, distributed, versioned,
      column-oriented store modeled after Google''s Bigtable: A Distributed Storage System for Structured
      Data by Chang et al. Just as Bigtable leverages the distributed data storage provided by the Google
      File System, HBase provides Bigtable-like capabilities on top of Hadoop and HDFS.'
    languages:
    - Java
- Apache Hive:
    description: The Apache Hive (TM) data warehouse software facilitates querying and managing large
      datasets residing in distributed storage. Built on top of Apache Hadoop (TM), it provides * tools
      to enable easy data extract/transform/load (ETL) * a mechanism to impose structure on a variety
      of data formats * access to files stored either directly in Apache HDFS (TM) or in other data storage
      systems such as Apache HBase (TM) * query execution via MapReduce Hive defines a simple SQL-like
      query language, called HiveQL, that enables users familiar with SQL to query the data. At the same
      time, this language also allows programmers who are familiar with the MapReduce framework to be
      able to plug in their custom mappers and reducers to perform more sophisticated analysis that may
      not be supported by the built-in capabilities of the language. HiveQL can also be extended with
      custom scalar functions (UDF's), aggregations (UDAF's), and table functions (UDTF's).
    languages:
    - Java
- Apache Iceberg:
    description: Iceberg brings the reliability and simplicity of SQL tables to big data, while making
