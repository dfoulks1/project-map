      Java Technology API (JCR). A content repository is a hierarchical content store with support for
      structured and unstructured content, full text search, versioning, transactions, observation, and
      more. Typical applications that use content repositories include content management, document management,
      and records management systems.
    languages: *id039
- Apache Jena:
    description: 'Apache Jena provides a complete framework for building Semantic Web and Linked Data
      applications in Java, and provides: parsers for RDF/XML, Turtle and N-triples; a Java programming
      API; a complete implementation of the SPARQL query language; a rule-based inference engine for RDFS
      and OWL entailments; TDB (a non-SQL persistent triple store); SDB (a persistent triples store built
      on a relational store) and Fuseki, an RDF server using web protocols. Jena complies with all relevant
      recommendations for RDF and related technologies from the W3C.'
    languages:
    - Java
- Apache Libcloud:
