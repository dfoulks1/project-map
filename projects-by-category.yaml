    languages: *id051
- Apache Daffodil:
    description: Apache Daffodil is an open-source implementation of the DFDL specification that uses
      DFDL data descriptions to parse fixed format data into an infoset. This infoset is commonly converted
      into XML or JSON to enable the use of well-established XML or JSON technologies and libraries to
      consume, inspect, and manipulate fixed format data in existing solutions. Daffodil is also capable
      of serializing or "unparsing" data back to the original data format. The DFDL infoset can also be
      converted directly to/from the data structures carried by data processing frameworks so as to bypass
      any XML/JSON overheads.
    languages: *id032
- Apache FOP:
    description: FOP (Formatting Objects Processor) is the world's first print formatter driven by XSL
      formatting objects (XSL-FO) and the world's first output independent formatter. It is a Java application
      that reads a formatting object (FO) tree and renders the resulting pages to a specified output.
      Output formats currently supported include PDF, PCL, PS, SVG, XML (area tree representation), Print,
      AWT, MIF and TXT. The primary output target is PDF.
    languages: *id073
- Apache Jackrabbit:
    description: Apache Jackrabbit is a fully conforming implementation of the Content Repository for
      Java Technology API (JCR). A content repository is a hierarchical content store with support for
      structured and unstructured content, full text search, versioning, transactions, observation, and
