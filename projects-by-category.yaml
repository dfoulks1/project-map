    languages: *id012
- Apache Sandesha2:
    description: Apache Sandesha2 is an Axis2 module that implements the WS-ReliableMessaging specification.
      It can be used both on the client side and on the server side.
    languages:
    - Java
- Apache Santuario:
    description: Library implementing XML Digital Signature Specification & XML Encryption Specification
    languages: *id065
