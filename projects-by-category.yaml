      including routing, load-balancing, transformation and protocol switching. Apache Synapse can be
      used to build an Enterprise Service Bus (ESB) or Service Oriented Architecture (SOA). Apache Synapse
      has been designed to support very fast XML routing with a streaming XML design based upon Apache
      Axiom. in addition, the use of a completely asynchronous architecture and non-blocking IO based
      on Java NIO ensures that Synapse has very low overhead and can scale to support thousands of concurrent
      clients without dropping messages.
    languages: *id052
- Apache Woden:
    description: 'The Woden project is a subproject of the Apache Web Services Project to develop a Java
      class library for reading, manipulating, creating and writing WSDL documents, initially to support
      WSDL 2.0 but with the longer term aim of supporting past, present and future versions of WSDL. There
      are two main deliverables: an API and an implementation. The Woden API will consist of a set of
      Java interfaces. The WSDL 2.0-specific portion of the Woden API will conform to the W3C WSDL 2.0
      specification. The implementation will be a high performance implementation directly usable in other
      Apache projects such as Axis2.'
    languages:
    - Java
- Apache WSS4J:
    description: The Apache WSS4J project provides a Java implementation of the primary security standards
      for Web Services, namely the OASIS Web Services Security (WS-Security) specifications from the OASIS
      Web Services Security TC.
    languages:
    - Java
- Apache Xalan for C++ XSLT Processor:
    description: Xalan-C++ is an XSLT processor for transforming XML documents into HTML, text, or other
      XML document types. It implements XSL Transformations (XSLT) Version 1.0 and XML Path Language (XPath)
      Version 1.0 and can be used from the command line.
    languages:
    - C++
- Apache Xalan for Java XSLT Processor:
    description: Xalan-J is an XSLT processor for transforming XML documents into HTML, text, or other
      XML document types. It implements XSL Transformations (XSLT) Version 1.0 and XML Path Language (XPath)
      Version 1.0 and can be used from the command line, in an applet or a servlet, or as a module in
      other program. Xalan-J implements the javax.xml.transform interface in Java API for XML Processing
      (JAXP) 1.3. This interface provides a modular framework and a standard API for performing XML transformations,
      and utilizes system properties to determine which Transformer and which XML parser to use.
    languages:
    - Java
- Apache Xerces for C++ XML Parser:
    description: 'Xerces-C++ is a validating XML parser written in a portable subset of C++. Xerces-C++
      makes it easy to give your application the ability to read and write XML data. A shared library
      is provided for parsing, generating, manipulating, and validating XML documents. Xerces-C++ is faithful
      to the XML 1.0 and 1.1 recommendations and many associated standards. The parser provides high performance,
      modularity, and scalability. Source code, samples and API documentation are provided with the parser.
      For portability, care has been taken to make minimal use of templates, no RTTI, and minimal use
      of #ifdefs.'
    languages:
    - C
- Apache Xerces for Java XML Parser:
    description: Xerces-J is a high performance, fully compliant validating XML parser written in Java.
      It is a fully conforming XML Schema processor that includes a complete implementation of the Document
      Object Model Level 3 Core and Load/Save W3C Recommendations and provides a complete implementation
      of the XML Inclusions (XInclude) W3C Recommendation. It also provides support for OASIS XML Catalogs
      v1.1. Xerces 2.x introduced the Xerces Native Interface (XNI), a complete framework for building
      parser components and configurations that is extremely modular and easy to program. XNI is merely
      an internal set of interfaces. There is no need for an XML application programmer to learn XNI if
      they only intend to interface to the Xerces2 parser using standard interfaces like JAXP, DOM, and
      SAX. Xerces developers and application developers that need more power and flexibility than that
      provided by the standard interfaces should read and understand XNI. The latest Xerces-J version
      released is, 2.12.2.
    languages:
    - Java
- Apache Xerces for Perl XML Parser:
    description: XML::Xerces is the Perl API to the Apache project's Xerces XML parser. It is implemented
      using the Xerces C++ API, and it provides access to most of the C++ API from Perl. Because it is
      based on Xerces-C, XML::Xerces provides a validating XML parser that makes it easy to give your
      application the ability to read and write XML data. Classes are provided for parsing, generating,
      manipulating, and validating XML documents. XML::Xerces is faithful to the XML 1.0 and 1.1 recommendations
      and associated standards (DOM levels 1, 2, and 3, SAX 1 and 2, Namespaces, and W3C XML Schema).
      The parser provides high performance, modularity, and scalability, and provides full support for
      Unicode. XML::Xerces implements the vast majority of the Xerces-C API (if you notice any discrepancies
      please mail the list). The exception is some functions in the C++ API which either have better Perl
      counterparts (such as file I/O) or which manipulate internal C++ information that has no role in
      the Perl module. The majority of the API is created automatically using Simplified Wrapper Interface
      Generator (SWIG). However, care has been taken to make most method invocations natural to perl programmers,
      so a number of rough C++ edges have been smoothed over (See the Special Perl API Features section).
    languages:
    - Perl
- Apache XML Commons External:
    description: 'The External components portion of Apache XML Commons contains interfaces that are defined
      by external standards organizations. For DOM, that''s the W3C; for SAX it''s David Megginson (http://www.saxproject.org);
      for JAXP it''s Sun. While we could send users to each of the primary sources for these deliverables,
      keeping our own versions of these in the XML Commons repository gives us a number of advantages:
      1) Simplicity of downloads; users get the whole product from one place, 2) Better version control;
      we can only take fixes we want and add Apache-specific changes, 3) Better overview documentation
      of how these interfaces fit into the XML processing world, 4) More chance for cross-project community
      building within Apache projects.'
    languages:
    - Java
- Apache XML Commons Resolver:
    description: The XML Commons Resolver can be used in a wide variety of XML parsing, processing and
      related programs to resolve various public or system identifiers into accessible URLs for use by
      your application. The resolver supports several catalog types for mapping, including OASIS XML,
      OASIS TR 9401 and XCatalog styles.
    languages:
    - Java
- Apache XMLBeans:
    description: 'XMLBeans is a tool that allows you to access the full power of XML in a Java friendly
      way. The idea is that you can take advantage of the richness and features of XML and XML Schema
      and have these features mapped as naturally as possible to the equivalent Java language and typing
      constructs. XMLBeans uses XML Schema to compile Java interfaces and classes that you can then use
      to access and modify XML instance data. Using XMLBeans is similar to using any other Java interface/class,
      you will see things like getFoo or setFoo just as you would expect when working with Java. While
      a major use of XMLBeans is to access your XML instance data with strongly typed Java classes there
      are also API''s that allow you access to the full XML infoset (XMLBeans keeps XML Infoset fidelity)
      as well as to allow you to reflect into the XML schema itself through an XML Schema Object model.
      For more details on XMLBeans see the XMLBeans Wiki pages or the XMLBeans documentation (the Documentation
      tab on this website). What Makes XMLBeans Different There are at least two major things that make
      XMLBeans unique from other XML-Java binding options. 1. Full XML Schema support. XMLBeans fully
      supports XML Schema and the corresponding java classes provide constructs for all of the major functionality
      of XML Schema. This is critical since often times you do not have control over the features of XML
      Schema that you need to work with in Java. Also, XML Schema oriented applications can take full
      advantage of the power of XML Schema and not have to restrict themselvs to a subset. 2. Full XML
      Infoset fidelity.When unmarshalling an XML instance the full XML infoset is kept and is available
      to the developer. This is critical because because of the subset of XML that is not easily represented
      in java. For example, order of the elements or comments might be needed in a particular application.
      A major objective of XMLBeans has been to be applicable in all non-streaming (in memory) XML programming
      situations. You should be able to compile your XML Schema into a set of java classes and know that
      1) you will be able to use XMLBeans for all of the schemas you encounter (even the warped ones)
      and 2) that you will be able to get to the XML at whatever level is necessary - and not have to
      resort to multple tools to do this. To accomplish this XMLBeans provides three major APIs: * XmlObject
      The java classes that are generated from an XML Schema are all derived from XmlObject. These provide
      strongly typed getters and setters for each of the elements within the defined XML. Complex types
      are in turn XmlObjects. For example getCustomer might return a CustomerType (which is an XmlObject).
      Simple types turn into simple getters and setters with the correct java type. For example getName
      might return a String. * XmlCursor From any XmlObject you can get an XmlCursor. This provides efficient,
      low level access to the XML Infoset. A cursor represents a position in the XML instance. You can
      move the cursor around the XML instance at any level of granularity you need from individual characters
      to Tokens. * SchemaType XMLBeans provides a full XML Schema object model that you can use to reflect
      on the underlying schema meta information. For example, you might want to generate a sample XML
      instance for an XML schema or perhaps find the enumerations for an element so that you can display
      them. All of this was built with performance in mind. Informal benchmarks and user feedback indicate
      that XMLBeans is extremely fast.'
    languages:
    - Java
- Apache XMLSchema:
    description: Apache XMLSchema is a lightweight Java object model that can be used to manipulate and
      generate XML schema representations.
    languages:
    - Java
