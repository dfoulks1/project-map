    description: Linear scalability and proven fault-tolerance on commodity hardware or cloud infrastructure
      make Apache Cassandra the perfect platform for mission-critical data. Cassandra's support for replicating
      across multiple datacenters is best-in-class. Cassandra is in use at Netflix, Twitter, Urban Airship,
