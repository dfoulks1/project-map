- Apache OpenJPA:
    description: Apache OpenJPA is a Java persistence project at The Apache Software Foundation that can
      be used as a stand-alone POJO persistence layer or integrated into any Java EE compliant container
      and many other lightweight frameworks, such as Tomcat and Spring. The 1.x releases are a production
      ready, feature-rich, compliant implementation of the Java Persistence API (JPA) 1.0 part of the
      JSR-220 Enterprise Java Beans 3.0 specification, which pass the Sun JPA 1.0b Technology Compatibility
      Kit. The 2.x releases are a production ready, compliant implement of the JSR-317 Java Persistence
      2.0 specification, which is backwards compatible to the JPA 1.0 specification and passes the Sun
      JPA 2.0 Technology Compatibility Kit.
    languages: &id026
    - Java
- Apache ORC:
    description: ORC is a self-describing type-aware columnar file format designed for Hadoop workloads.
      It is optimized for large streaming reads, but with integrated support for finding required rows
      quickly. Storing data in a columnar format lets the reader read, decompress, and process only the
      values that are required for the current query.
    languages: *id013
- Apache Phoenix:
    description: Apache Phoenix enables OLTP and operational analytics for Apache Hadoop by providing
      a relational database layer leveraging Apache HBase as its backing store. It includes integration
      with Apache Spark, Pig, Flume, Map Reduce, and other products in the Hadoop ecosystem. It is accessed
      as a JDBC driver and enables querying, updating, and managing HBase tables through standard SQL.
