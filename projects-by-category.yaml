- Apache FreeMarker:
    description: 'Apache FreeMarker is a template engine: a Java library to generate text output (HTML
      web pages, e-mails, configuration files, source code, etc.) based on templates and changing data.
      Templates are written in the FreeMarker Template Language (FTL), which is a simple, specialized
      language (not a full-blown programming language). Usually, a general-purpose programming language
      (like Java) is used to prepare the data (issue database queries, do business calculations). Then,
      Apache FreeMarker displays that prepared data using templates. In the template you are focusing
      on how to present the data, and outside the template you are focusing on what data to present.'
