big-data:
- Apache Accumulo:
    description: The Apache Accumulo sorted, distributed key/value store is based on Google's BigTable
      design. It is built on top of Apache Hadoop, Apache Zookeeper, and Apache Thrift. It features a
      few novel improvements on the BigTable design in the form of cell-level access labels and a server-side
      programming mechanism that can modify key/value pairs at various points in the data management process.
    languages:
    - Java
- Apache Airavata:
    description: Apache Airavata is a micro-service architecture based software framework for executing
      and managing computational jobs and workflows on distributed computing resources including local
      clusters, supercomputers, national grids, academic and commercial clouds. Airavata is dominantly
      used to build Web-based science gateways and assist to compose, manage, execute, and monitor large
      scale applications (wrapped as Web services) and workflows composed of these services.
    languages: &id001
    - Java
- Apache Airflow:
    description: The mission of Apache Airflow is the creation and maintenance of software related to
      workflow automation and scheduling that can be used to author and manage data pipelines.
    languages:
    - Python
    - JavaScript
- Apache Ambari:
    description: Apache Ambari simplifies provisioning, managing, and monitoring of Apache Hadoop clusters.
    languages:
    - Java
    - JavaScript
    - Python
- Apache Arrow:
    description: Apache Arrow defines a language-independent columnar memory format for flat and nested
      data, organized for efficient analytic operations on modern hardware like CPUs and GPUs. The Arrow
      memory format also supports zero-copy reads for lightning-fast data access without serialization
      overhead. Arrow's libraries implement the format and provide building blocks for a range of use
      cases, including high performance analytics. Many popular projects use Arrow to ship columnar data
      efficiently or as the basis for analytic engines. Libraries are available for C, C++, C#, Go, Java,
      JavaScript, Julia, MATLAB, Python, R, Ruby, and Rust. Apache Arrow is software created by and for
      the developer community. We are dedicated to open, kind communication and consensus decision making.
      Our committers come from a range of organizations and backgrounds, and we welcome all to participate
      with us.
    languages: &id005
    - C
    - C++
    - C#
    - Go
    - Java
    - JavaScript
    - Julia
    - MATLAB
    - Python
    - R
    - Ruby
    - Rust
- Apache Avro:
    description: Apache Avro is a data serialization system.
    languages: &id006
    - C
    - C#
    - C++
    - Java
    - JavaScript
    - Perl
    - PHP
    - Python
    - Ruby
    - Rust
- Apache Beam:
    description: Apache Beam is a unified programming model for both batch and streaming data processing,
      enabling efficient execution across diverse distributed execution engines and providing extensibility
      points for connecting to different technologies and user communities.
    languages:
    - Java
    - Python
- Apache Bigtop:
    description: Bigtop is a project for the development of packaging and tests of the Apache Hadoop ecosystem.
      The primary goal of Bigtop is to build a community around the packaging and interoperability testing
      of Hadoop-related projects. This includes testing at various levels (packaging, platform, runtime,
      upgrade, etc...) developed by a community with a focus on the system as a whole, rather than individual
      projects. In short we strive to be for Hadoop what Debian is to Linux.
    languages:
    - Java
- Apache BookKeeper:
    description: BookKeeper is a reliable replicated log service. It can be used to turn any standalone
      service into a highly available replicated service. BookKeeper is highly available (no single point
      of failure), and scales horizontally as more storage nodes are added.
    languages:
    - Java
- Apache Calcite:
    description: Calcite is a framework for writing data management systems. It converts queries, represented
      in relational algebra, into an efficient executable form using pluggable query transformation rules.
      There is an optional SQL parser and JDBC driver. Calcite does not store data or have a preferred
      execution engine. Data formats, execution algorithms, planning rules, operator types, metadata,
      and cost model are added at runtime as plugins.
    languages: &id016
    - Java
- Apache CarbonData:
    description: Apache CarbonData is a new big data file format for faster interactive query using advanced
      columnar storage, index, compression and encoding techniques to improve computing efficiency, which
      helps in speeding up queries by an order of magnitude faster over PetaBytes of data.
    languages:
    - Java
    - Scala
- Apache CouchDB:
    description: Apache CouchDB is a database that completely embraces the web. Store your data with JSON
      documents. Access your documents with your web browser, via HTTP. Query, combine, and transform
      your documents with JavaScript. Apache CouchDB works well with modern web and mobile apps. CouchDB's
      killer feature is its ability to distribute data efficiently using Apache CouchDB’s incremental
      replication. Apache CouchDB supports master-master setups with automatic conflict detection.
    languages: &id002
    - JavaScript
    - Erlang
    - C++
    - C
- Apache Daffodil:
    description: Apache Daffodil is an open-source implementation of the DFDL specification that uses
      DFDL data descriptions to parse fixed format data into an infoset. This infoset is commonly converted
      into XML or JSON to enable the use of well-established XML or JSON technologies and libraries to
      consume, inspect, and manipulate fixed format data in existing solutions. Daffodil is also capable
      of serializing or "unparsing" data back to the original data format. The DFDL infoset can also be
      converted directly to/from the data structures carried by data processing frameworks so as to bypass
      any XML/JSON overheads.
    languages: &id032
    - Scala
    - Java
- Apache DataFu:
    description: 'Apache DataFu consists of two libraries: Apache DataFu Pig is a collection of useful
      user-defined functions for data analysis in Apache Pig. Apache DataFu Hourglass is a library for
      incrementally processing data using Apache Hadoop MapReduce. This library was inspired by the prevelance
      of sliding window computations over daily tracking data. Computations such as these typically happen
      at regular intervals (e.g. daily, weekly), and therefore the sliding nature of the computations
      means that much of the work is unnecessarily repeated. DataFu''s Hourglass was created to make these
      computations more efficient, yielding sometimes 50-95% reductions in computational resources.'
    languages:
    - Java
- Apache DataFusion:
    description: Apache DataFusion is a fast, extensible query engine for building high-quality data-centric
      systems in Rust, using the Apache Arrow in-memory format. Python Bindings are also available. DataFusion
      offers SQL and Dataframe APIs, excellent performance, built-in support for CSV, Parquet, JSON, and
      Avro, extensive customization, and a great community.
    languages: &id007
    - Python
    - Rust
- Apache DataSketches:
    description: In the analysis of big data there are often problem queries that don’t scale because
      they require huge compute resources and time to generate exact results. Examples include count distinct,
      quantiles, distribution analysis, most-frequent items, joins, matrix computations, and graph analysis.
      If approximate results are acceptable, there is a class of specialized algorithms, called streaming
      algorithms, or sketches, that can produce results orders-of magnitude faster and with mathematically
      proven error bounds. For interactive queries there may not be other viable alternatives, and in
      the case of real-time analysis, sketches are the only known solution.
    languages: &id033
    - Java
    - C++
    - Python
    - Go
    - Rust
- Apache Drill:
    description: Apache Drill is a distributed MPP query layer that supports SQL and alternative query
      languages against NoSQL and Hadoop data storage systems. It was inspired in part by Google's Dremel.
    languages:
    - Java
- Apache Druid:
    description: Apache Druid is a high performance real-time analytics database. Druid's main value add
      is to reduce time to insight and action. Apache Druid is designed for workflows where fast queries
      and ingest really matter. Druid excels at powering UIs, running operational (ad-hoc) queries, or
      handling high concurrency. Consider Druid as an open source alternative to data warehouses for a
      variety of use cases.
    languages: &id011
    - Java
- Apache Flink:
    description: Flink is an open source system for expressive, declarative, fast, and efficient data
      analysis. It combines the scalability and programming flexibility of distributed MapReduce-like
      platforms with the efficiency, out-of-core execution, and query optimization capabilities found
      in parallel databases.
    languages:
    - Java
    - Scala
- Apache Flume:
    description: Apache Flume is a distributed, reliable, and available system for efficiently collecting,
      aggregating and moving large amounts of log data from many different sources to a centralized data
      store
    languages:
    - Java
- Apache Fluo:
    description: Apache Fluo is a distributed processing system that lets users make incremental updates
      to large data sets. With Apache Fluo, users can set up workflows that execute cross node transactions
      when data changes. These workflows enable users to continuously join new data into large existing
      data sets without reprocessing all data. Apache Fluo is built on Apache Accumulo.
    languages:
    - Java
- Apache Fluo Recipes:
    description: Apache Fluo Recipes build on the Fluo API to offer additional functionality to developers.
      They are published separately from Fluo on their own release schedule. This allows Fluo Recipes
      to iterate and innovate faster than Fluo (which will maintain a more minimal API on a slower release
      cycle). Fluo Recipes offers code to implement common patterns on top of Fluo's API. It also offers
      glue code to external libraries like Spark and Kryo.
    languages:
    - Java
- Apache Fluo YARN:
    description: Apache Fluo YARN is a tool for running Apache Fluo applications in Apache Hadoop YARN.
    languages:
    - Java
- Apache Gobblin:
    description: A distributed data integration framework that simplifies common aspects of big data integration
      such as data ingestion, replication, organization and lifecycle management for both streaming and
      batch data ecosystems.
    languages:
    - Java
- Apache Hadoop:
    description: The Apache Hadoop software library is a framework that allows for the distributed processing
      of large data sets across clusters of computers using simple programming models. It is designed
      to scale up from single servers to thousands of machines, each offering local computation and storage.
      Rather than rely on hardware to deliver high-availability, the library itself is designed to detect
      and handle failures at the application layer, so delivering a highly-available service on top of
      a cluster of computers, each of which may be prone to failures.
    languages:
    - Java
- Apache Helix:
    description: Apache Helix is a generic cluster management framework used for the automatic management
      of partitioned, replicated and distributed resources hosted on a cluster of nodes. Helix automates
      reassignment of resources in the face of node failure and recovery, cluster expansion, and reconfiguration.
    languages: &id003
    - Java
- Apache Hop:
    description: The Hop Orchestration Platform, or Apache Hop, aims to facilitate all aspects of data
      and metadata orchestration. Hop is an entirely new open source data integration platform that is
      easy to use, fast and flexible Hop aims to be the future of data integration. Visual development
      enables developers to be more productive than they can be through code. Our Design once, run anywhere
      workflows and pipelines can be designed in the Hop Gui and run on the Hop native engine (local or
      remote), or on Spark, Flink, Google Dataflow or AWS EMR through Beam. Lifecycle Management enables
      developers and administrators to switch between projects, environments and purposes without leaving
      your train of thought.
    languages:
    - Java
- Apache Iceberg:
    description: Iceberg brings the reliability and simplicity of SQL tables to big data, while making
      it possible for engines like Spark, Trino, Flink, Presto, Hive and Impala to safely work with the
      same tables, at the same time.
    languages: &id008
    - Java
    - Python
    - Go
    - Rust
    - C++
- Apache Ignite:
    description: Apache Ignite is a distributed database for high-performance computing with in-memory
      speed.
    languages: &id004
    - Java
    - C#
    - C++
    - SQL
    - JDBC
    - ODBC
- Apache Impala:
    description: Apache Impala is the open source, native analytic database for open data and table formats.
    languages:
    - C++
    - Java
- Apache InLong:
    description: Apache InLong is a one-stop, full-scenario integration framework for massive data that
      supports Data Ingestion, Data Synchronization, and Data Subscription, and it provides automatic,
      safe, reliable, and high-performance data transmission capabilities to facilitate the construction
      of streaming-based data analysis, modeling, and applications.
    languages:
    - Java
- Apache Kafka:
    description: A single Kafka broker can handle hundreds of megabytes of reads and writes per second
      from thousands of clients. Kafka is designed to allow a single cluster to serve as the central data
      backbone for a large organization. It can be elastically and transparently expanded without downtime.
      Data streams are partitioned and spread over a cluster of machines to allow data streams larger
      than the capability of any single machine and to allow clusters of co-ordinated consumers. Kafka
      has a modern cluster-centric design that offers strong durability and fault-tolerance guarantees.
      Messages are persisted on disk and replicated within the cluster to prevent data loss. Each broker
      can handle terabytes of messages without performance impact.
    languages:
    - Scala
- Apache Knox:
    description: 'The Apache Knox Gateway is a REST API Gateway for interacting with Hadoop clusters.
      The Knox Gateway provides a single access point for all REST interactions with Hadoop clusters.
      In this capacity, the Knox Gateway is able to provide valuable functionality to aid in the control,
      integration, monitoring and automation of critical administrative and analytical needs of the enterprise.
      Authentication (LDAP and Active Directory Authentication Provider) Federation/SSO (HTTP Header Based
      Identity Federation) Authorization (Service Level Authorization) Auditing While there are a number
      of benefits for unsecured Hadoop clusters, the Knox Gateway also complements the kerberos secured
      cluster quite nicely. Coupled with proper network isolation of a Kerberos secured Hadoop cluster,
      the Knox Gateway provides the enterprise with a solution that: Integrates well with enterprise identity
      management solutions Protects the details of the Hadoop cluster deployment (hosts and ports are
      hidden from endusers) Simplifies the number of services that clients need to interact with'
    languages:
    - Java
- Apache Kudu:
    description: Apache Kudu is a columnar storage manager developed for the Apache Hadoop platform.
    languages:
    - C++
- Apache Kylin:
    description: Apache Kylin is an open source, distributed Analytical Data Warehouse for Big Data; it
      was designed to provide OLAP (Online Analytical Processing) capability in the big data era. By renovating
      the multi-dimensional cube and precalculation technology on Hadoop and Spark, Kylin is able to achieve
      near constant query speed regardless of the ever-growing data volume. Reducing query latency from
      minutes to sub-second, Kylin brings online analytics back to big data.
    languages:
    - Java
    - Scala
- Apache Linkis:
    description: Apache Linkis is a computation middleware project, which decouples the upper applications
      and the underlying data engines, provides standardized interfaces (REST, JDBC etc.) to easily connect
      to various underlying engines (Spark, Presto, Flink, etc.).
    languages:
    - Java
    - Scala
- Apache NiFi:
    description: The mission of NiFi is the creation and maintenance of software related to providing
      an easy to use, powerful, and reliable system to process and distribute data. Apache NiFi MiNiFi
      is an edge data collection agent built to seamlessly integrate with and leverage the command and
      control of NiFi. Apache NiFi Registry is a centralized registry for key configuration items including
      flow versions, assets, and extensions for Apache NiFi and Apache MiNiFi.
    languages:
    - Java
- Apache ORC:
    description: ORC is a self-describing type-aware columnar file format designed for Hadoop workloads.
      It is optimized for large streaming reads, but with integrated support for finding required rows
      quickly. Storing data in a columnar format lets the reader read, decompress, and process only the
      values that are required for the current query.
    languages: &id013
    - Java
    - C++
- Apache Ozone:
    description: Apache Ozone is a highly scalable, distributed storage for Analytics, Big data and Cloud
      Native applications. Ozone supports S3 compatible object APIs as well as a Hadoop Compatible File
      System implementation. It is optimized for both efficient object store and file system operations.
      It is built on a highly available, replicated block storage layer called Hadoop Distributed Data
      Store (HDDS). Applications using frameworks like Apache Spark, YARN and Hive work natively without
      any modifications.
    languages:
    - Java
- Apache Parquet:
    description: Apache Parquet is an open source, column-oriented data file format designed for efficient
      data storage and retrieval. It provides high performance compression and encoding schemes to handle
      complex data in bulk and is supported in many programming language and analytics tools.
    languages:
    - Java
- Apache Phoenix:
    description: Apache Phoenix enables OLTP and operational analytics for Apache Hadoop by providing
      a relational database layer leveraging Apache HBase as its backing store. It includes integration
      with Apache Spark, Pig, Flume, Map Reduce, and other products in the Hadoop ecosystem. It is accessed
      as a JDBC driver and enables querying, updating, and managing HBase tables through standard SQL.
    languages: &id014
    - Java
    - SQL
- Apache Pinot:
    description: 'Apache Pinot is a real-time distributed online analytical processing (OLAP) datastore.
      Use Pinot to ingest and immediately query data from streaming or batch data sources (including,
      Apache Kafka, Amazon Kinesis, Hadoop HDFS, Amazon S3, Azure ADLS, and Google Cloud Storage). Apache
      Pinot includes the following: Ultra low-latency analytics even at extremely high throughput. Columnar
      data store with several smart indexing and pre-aggregation techniques. Scaling up and out with no
      upper bound. Consistent performance based on the size of your cluster and an expected query per
      second (QPS) threshold. It''s perfect for user-facing real-time analytics and other analytical use
      cases, including internal dashboards, anomaly detection, and ad hoc data exploration.'
    languages:
    - Java
- Apache Polaris:
    description: Apache Polaris implements the Apache Iceberg REST API, enabling seamless multi-engine
      interoperability across a wide range of platforms, including Apache Doris, Apache Flink, Apache
      Spark, ...
    languages: &id009
    - Java
    - Python
- Apache Pulsar:
    description: Apache Pulsar is an all-in-one messaging and streaming platform. Messages can be consumed
      and acknowledged individually or consumed as streams with less than 10ms of latency. Its layered
      architecture allows rapid scaling across hundreds of nodes, without data reshuffling. Its features
      include multi-tenancy with resource separation and access control, geo-replication across regions,
      tiered storage and support for six official client languages. It supports up to one million unique
      topics and is designed to simplify your application architecture.
    languages:
    - Java
- Apache Ranger:
    description: Apache Ranger is a framework to enable, monitor and manage comprehensive data security
      - consistently across various data processing services. Integrated with most of the Big-Data technologies
      (Hadoop, Hive, HBase, Spark, Trino, ...)
    languages: &id064
    - Java
- Apache Samza:
    description: Apache Samza provides a system for processing stream data from publish-subscribe systems
      such as Apache Kafka. The developer writes a stream processing task, and executes it as a Samza
      job. Samza then routes messages between stream processing tasks and the publish-subscribe systems
      that the messages are addressed to.
    languages:
    - Scala
- Apache SeaTunnel:
    description: SeaTunnel is a next-generation super high-performance, distributed, massive data integration
      tool. It can synchronize tens of billions of data stably and efficiently every day, and has been
      used in the production of many companies.
    languages:
    - Java
- Apache Spark:
    description: Apache Spark is a fast and general engine for large-scale data processing. It offers
      high-level APIs in Java, Scala, Python and R, as well as a rich set of libraries including stream
      processing, machine learning, and graph analytics.
    languages:
    - Java
    - Scala
    - Python
    - R
    - SQL
    - JDBC
- Apache Storm:
    description: Apache Storm is a distributed real-time computation system. Similar to how Hadoop provides
      a set of general primitives for doing batch processing, Storm provides a set of general primitives
      for doing real-time computation.
    languages:
    - Java
- Apache Superset:
    description: 'Superset is a fast, lightweight, intuitive, business intelligence platform. Loaded with
      options, Superset makes it easy for users of all skill sets to explore and visualize their data,
      from simple line charts to highly detailed geospatial charts. * Powerful yet easy to use: Superset
      makes it easy to explore your data, using either our simple no-code viz builder or state-of-the-art
      SQL IDE. * Integrates with modern databases Superset can connect to any SQL-based databases including
      modern cloud-native databases and engines at petabyte scale. * Modern architecture Superset is lightweight
      and highly scalable, leveraging the power of your existing data infrastructure without requiring
      yet another ingestion layer. * Rich visualizations and dashboards Superset ships with 40+ pre-installed
      visualization types. Our plug-in architecture makes it easy to build custom visualizations.'
    languages: &id010
    - JavaScript
    - Python
    - TypeScript
- Apache Tez:
    description: Apache Tez is an effort to develop a generic application framework which can be used
      to process arbitrarily complex directed-acyclic graphs (DAGs) of data-processing tasks and also
      a re-usable set of data-processing primitives which can be used by other projects.
    languages:
    - Java
- Apache TsFile:
    description: TsFile is a high-performance columnar storage file format designed for industrial time-series
      data, featuring multi-language interfaces, high compression ratios, high read/write throughput,
      and fast random access capabilities. It is ideal for scenarios such as building high-quality datasets,
      managing data assets, conducting data analytics, and training AI models.
    languages: &id024
    - Java
    - C++
    - C
    - Python
    - Go
- Apache TVM:
    description: Apache TVM is an open source machine learning compiler framework for CPUs, GPUs, and
      machine learning accelerators. It aims to enable machine learning engineers to optimize and run
      computations efficiently on any hardware backend.
    languages:
    - C++
    - Python
- Apache Zeppelin:
    description: Zeppelin is a modern web-based tool for the data scientists to collaborate over large-scale
      data exploration and visualization projects.
    languages:
    - Java
    - JavaScript
    - Scala
build-management:
- Apache Ant:
    description: Apache Ant is a Java-based build tool.
    languages:
    - Java
- Apache AntUnit:
    description: The Ant Library provides Ant tasks for testing Ant task, it can also be used to drive
      functional and integration tests of arbitrary applications with Ant.
    languages: &id066
    - Java
- Apache Compress Ant Library:
    description: This is a library of Ant tasks and types uses Apache Commons Compress to support additional
      archive formats like ar, pack200, xz and cpio.
    languages:
    - Java
- Apache CycloneDX Ant Library:
    description: Provides support for the creation of CycloneDX SBOMs.
    languages:
    - Java
- Apache Gump:
    description: Gump provides large scale continuous integration for various open source projects.
    languages: &id067
    - Python
- Apache Ivy:
    description: Apache Ivy is a very powerful dependency manager oriented toward Java dependency management,
      even though it could be used to manage dependencies of any kind.
    languages:
    - Java
- Apache IvyDE:
    description: The now retired IvyDE lets you manage your dependencies declared in an ivy.xml in your
      Java Eclipse projects. IvyDE will contribute to the classpath of your Java project, with the classpath
      container. It also bring an editor of ivy.xml files, with completion.
    languages:
    - Java
- Apache Magpie:
    description: Apache Magpie is a project-agnostic, agent-assisted maintainership and development framework
      that any open-source project — ASF or not — can adopt. It ships independently-toggleable modes (Triage,
      Mentoring, Drafting, Pairing, and Auto-merge) as reusable agent skills, so each project picks the
      automation level that fits its culture and risk tolerance. Magpie covers security-issue handling,
      contributor mentoring, agent-drafted remediation under human review, and developer-side development-cycle
      workflows, with a privacy-aware model-routing posture for sensitive content.
    languages:
    - Python
- Apache Maven:
    description: 'Maven is a project development management and comprehension tool. Based on the concept
      of a project object model: builds, dependency management, documentation creation, site publication,
      and distribution publication are all controlled from the declarative file. Maven can be extended
      by plugins to utilise a number of other development tools for reporting or the build process.'
    languages:
    - Java
- Apache Maven Doxia:
    description: 'Doxia is a content generation framework which aims to provide its users with powerful
      techniques for generating static and dynamic content: Doxia can be used in web-based publishing
      context to generate static sites, in addition to being incorporated into dynamic content generation
      systems like blogs, wikis and content management systems.'
    languages:
    - Java
- Apache Props Ant Library:
    description: The Apache Props Antlib is a library of supplementary handlers for Apache Ant properties
      resolution. The types provided are instances of org.apache.tools.ant.PropertyHelper.Delegate and
      can be invoked using the <propertyhelper> task provided in Ant 1.8.0.
    languages:
    - Java
- Apache Rat:
    description: 'Apache Rat improves accuracy and efficiency when reviewing and auditing releases. It
      is heuristic in nature: making guesses about possible problems. It will produce false positives
      and cannot find every possible issue with a release. It''s reports require interpretation. Apache
      Rat was developed in response to a need felt in the Apache Incubator to be able to review releases
      for the most common faults less labour intensively. It is therefore highly tuned to the Apache style
      of releases.'
    languages:
    - Java
- Apache Subversion:
    description: Subversion exists to be universally recognized and adopted as an open-source, centralized
      version control system characterized by its reliability as a safe haven for valuable data; the simplicity
      of its model and usage; and its ability to support the needs of a wide variety of users and projects,
      from individuals to large-scale enterprise operations.
    languages:
    - C
- Apache Tentacles:
    description: Apache Tentacles helps the reviewer by automating interactions with the repository containing
      the artifacts comprising the release.
    languages:
    - Java
- Apache Whisker:
    description: Apache Whisker allows an application to models the licensing characteristics of the contents
      of its distributions. Use cases are auditing the model against the contents of a distribution, reporting
      on the contents of a distribution and generation licensing documents (LICENSE, NOTICE and so on)
      for a distribution. Whisker distributes tooling for the command line and build system such as Maven.
    languages:
    - Java
- Apache Yetus:
    description: A collection of libraries and tools that enable contribution and release processes for
      software projects.
    languages: &id047
    - Bash
    - Java
    - Python
cloud:
- Apache Airavata:
    description: Apache Airavata is a micro-service architecture based software framework for executing
      and managing computational jobs and workflows on distributed computing resources including local
      clusters, supercomputers, national grids, academic and commercial clouds. Airavata is dominantly
      used to build Web-based science gateways and assist to compose, manage, execute, and monitor large
      scale applications (wrapped as Web services) and workflows composed of these services.
    languages: *id001
- Apache Brooklyn:
    description: 'Brooklyn is about deploying and managing applications: composing a full stack for an
      application; deploying to cloud and non-cloud targets; using monitoring tools to collect key health/performance
      metrics; responding to situations such as a failing node; and adding or removing capacity to match
      demand.'
    languages:
    - Java
- Apache Camel:
    description: Apache Camel is an open source integration framework with 350+ connectors. Write routes
      in Java, YAML, or XML. Run on Spring Boot, Quarkus, or standalone. Apache License 2.0.
    languages: &id021
    - Java
- Apache CloudStack:
    description: 'Apache CloudStack is open source software designed to deploy and manage large networks
      of virtual machines, as a highly available, highly scalable Infrastructure as a Service (IaaS) cloud
      computing platform. CloudStack is used by a number of service providers to offer public cloud services,
      and by many companies to provide an on-premises (private) cloud offering, or as part of a hybrid
      cloud solution. CloudStack is a turnkey solution that includes the entire "stack" of features most
      organizations want with an IaaS cloud: compute orchestration, Network-as-a-Service, user and account
      management, a full and open native API, resource accounting, and a first-class User Interface (UI).
      CloudStack currently supports the most popular hypervisors: VMware, KVM, XenServer and Xen Cloud
      Platform (XCP). Users can manage their cloud with an easy to use Web interface, command line tools,
      and / or a full-featured RESTful API. In addition, CloudStack provides an API that''s compatible
      with AWS EC2 and S3 for organizations that wish to deploy hybrid clouds.'
    languages:
    - Java
    - Python
- Apache CouchDB:
    description: Apache CouchDB is a database that completely embraces the web. Store your data with JSON
      documents. Access your documents with your web browser, via HTTP. Query, combine, and transform
      your documents with JavaScript. Apache CouchDB works well with modern web and mobile apps. CouchDB's
      killer feature is its ability to distribute data efficiently using Apache CouchDB’s incremental
      replication. Apache CouchDB supports master-master setups with automatic conflict detection.
    languages: *id002
- Apache EventMesh:
    description: EventMesh is a new generation serverless event middleware for building distributed event-driven
      applications.
    languages:
    - Java
