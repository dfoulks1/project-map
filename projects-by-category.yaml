      Output formats currently supported include PDF, PCL, PS, SVG, XML (area tree representation), Print,
      AWT, MIF and TXT. The primary output target is PDF.
    languages: &id073
    - Java
- Apache XML Graphics Commons:
    description: Apache XML Graphics Commons is a library that consists of several reusable components
