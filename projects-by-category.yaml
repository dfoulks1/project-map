- Apache Torque:
    description: Torque is an object-relational mapper for Java. In other words, Torque lets you access
      and manipulate data in a relational database using java objects. Unlike most other object-relational
      mappers, Torque does not use reflection to access user-provided classes, but it generates the necessary
