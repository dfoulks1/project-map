    description: Apache Fortress is a standards-based authorization system, written in Java, that provides
      role-based access control, delegated administration and password policy services using an LDAP backend.
    languages: *id035
search:
- Apache Lucene Core:
    description: Apache Lucene is a high-performance, full-featured text search engine library written
      entirely in Java. It is a technology suitable for nearly any application that requires full-text
      search, especially cross-platform.
    languages: *id041
- Apache PyLucene:
    description: PyLucene is a Python extension for accessing Java Lucene TM. Its goal is to allow you
      to use Lucene's text indexing and searching capabilities from Python.
    languages: *id061
- Apache Solr:
    description: Solr is an open source enterprise search server based on the Lucene Java search library,
      with Rest-like JSON/HTTP APIs, high performance, high availability, powerful analytics, hit highlighting,
      faceted search, caching, replication, and a web administration interface.
    languages: *id062
- Apache Solr Operator:
    description: Manages Solr resources in Kubernetes
    languages: *id063
- Apache Unomi:
    description: Apache Unomi is a REST server that manages user profiles and events related to the profiles.
      It can be used to integrate personalization and profile management within very different systems
      such as CMS, CRMs, Issue Trackers, native mobile application. It was designed to be easy to integrate
      with external systems, promoting profile sharing and re-use in very different applications. Basically
      the server tracks users using different mechanisms (by default cookies), builds a progressively
      populated profile and associates events that are performed by a user with his profile. Events may
      range from a click on a page, to a file being downloaded, a native mobile application button being
      clicked, or anything that can be sent to the server. The server has a built-in rule system that
      makes it possible to perform any action when an event is collected for a profile. It also has the
      notion of user segments, making it possible to classify user profiles into dynamic sub-groups, notably
      to build personalized experiences for specific segments.
    languages:
    - Java
security:
- Apache Fortress:
    description: Apache Fortress is a standards-based authorization system, written in Java, that provides
      role-based access control, delegated administration and password policy services using an LDAP backend.
    languages: *id035
- Apache Ranger:
    description: Apache Ranger is a framework to enable, monitor and manage comprehensive data security
      - consistently across various data processing services. Integrated with most of the Big-Data technologies
      (Hadoop, Hive, HBase, Spark, Trino, ...)
    languages: *id064
- Apache Santuario:
    description: Library implementing XML Digital Signature Specification & XML Encryption Specification
    languages: *id065
- Apache Syncope:
    description: 'Apache Syncope is an Open Source system for managing digital identities in enterprise
      environments, implemented in Java EE technology and released under Apache 2.0 license. Identity
      management (or IdM) represents the joint result of business process and IT to manage user data on
      systems and applications. IdM involves considering user attributes, roles, resources and entitlements
      in trying to give a decent answer to the question bumping at every time in IT administrators'' mind:
      Who has access to What, When, How, and Why?'
    languages: *id020
sql:
- Apache Calcite:
    description: Calcite is a framework for writing data management systems. It converts queries, represented
      in relational algebra, into an efficient executable form using pluggable query transformation rules.
      There is an optional SQL parser and JDBC driver. Calcite does not store data or have a preferred
      execution engine. Data formats, execution algorithms, planning rules, operator types, metadata,
      and cost model are added at runtime as plugins.
    languages: *id016
- Apache Ignite:
    description: Apache Ignite is a distributed database for high-performance computing with in-memory
      speed.
    languages: *id004
templating:
- Apache FreeMarker:
    description: 'Apache FreeMarker is a template engine: a Java library to generate text output (HTML
      web pages, e-mails, configuration files, source code, etc.) based on templates and changing data.
      Templates are written in the FreeMarker Template Language (FTL), which is a simple, specialized
      language (not a full-blown programming language). Usually, a general-purpose programming language
      (like Java) is used to prepare the data (issue database queries, do business calculations). Then,
      Apache FreeMarker displays that prepared data using templates. In the template you are focusing
      on how to present the data, and outside the template you are focusing on what data to present.'
    languages: *id017
testing:
- Apache AntUnit:
    description: The Ant Library provides Ant tasks for testing Ant task, it can also be used to drive
      functional and integration tests of arbitrary applications with Ant.
    languages: *id066
- Apache Gump:
    description: Gump provides large scale continuous integration for various open source projects.
    languages: *id067
- Apache JMeter:
    description: Apache JMeter may be used to test performance both on static and dynamic resources (files,
      Servlets, Perl scripts, Java Objects, Data Bases and Queries, FTP Servers and more). It can be used
      to simulate a heavy load on a server, network or object to test its strength or to analyze overall
      performance under different load types. You can use it to make a graphical analysis of performance
      or to test your server/script/object behavior under heavy concurrent load.
    languages:
    - Java
- Apache Yetus:
    description: A collection of libraries and tools that enable contribution and release processes for
      software projects.
    languages: *id047
web-framework:
- Apache Causeway:
    description: Apache Causeway is a framework for rapidly developing domain-driven apps in Java. Write
      your business logic in entities, domain services and repositories, and the framework dynamically
      (at runtime) generates a representation of that domain model as a webapp, RESTful or GraphQL API.
      For prototyping or production.
    languages:
    - Java
- Apache Cayenne:
    description: Cayenne is a powerful, full-featured, opensource framework created for developers working
      with relational databases. it seamlessly maps any relational database to Java objects, reducing
      development time and adding considerable functionality to any application which requires a database.
      Developers using Cayenne will be able to concentrate on the core business requirements and the data
      model instead of the SQL details. The application can then be easily moved to any JDBC-capable database.
      In addition to management of persistent Java objects mapped to relational databases, Cayenne provides
      a plethora of features including single method call queries and updates (including atomic updates
      of all modified objects), seamless integration of multiple databases into a single virtual data
      source, three tier persistence with caching on the remote client, paging of results, record locking,
      and many more features.
    languages: *id029
- Apache Flex:
    description: Apache Flex® is a highly productive, open source application framework for building and
      maintaining expressive web applications that deploy consistently on all major browsers, desktops
      and devices (including smartphones, tablets and tv). It provides a modern, standards-based language
      and programming model that supports common design patterns suitable for developers from many backgrounds.
      Flex applications can be deployed to the ubiquitous Adobe® Flash® Player in the browser, Adobe®
      AIR™ on desktop and mobile or to native Android™, IOS™, QNX®, Windows® or Mac® applications.
    languages:
    - ActionScript
- Apache Geronimo:
    description: Apache Geronimo is an open source server runtime that integrates the best open source
      projects to create Java/OSGi server runtimes that meet the needs of enterprise developers and system
      administrators. Our most popular distribution is a fully certified Java EE 5 application server
      runtime.
    languages: *id025
- Apache Grails:
    description: Grails is a powerful Groovy-based web application framework for the JVM built on top
      of Spring Boot that has many plugins to further extend its functionality.
    languages:
    - Groovy
- Apache MyFaces:
    description: MyFaces is the free open source implementation of Jakarta Server Faces, a web application
      framework that accomplishes the MVC paradigm. It is comparable to the well-known Struts Framework
      but has features and concepts that are beyond those of Struts - especially the component orientation.
    languages: *id068
- Apache Nutch:
    description: 'Apache Nutch is a highly extensible and scalable open source web crawler software project.
      Stemming from Apache Lucene, Nutch is a well matured, production ready batch crawler relying on
      Apache Hadoop data structures, which are great for batch processing. Nutch has a modular architecture
      and provides pluggable and extensible interfaces such as Parse, Index and ScoringFilter''s for custom
      implementations e.g. Apache Tika for parsing. Additionally, pluggable indexers exists for Apache
      Solr, Elastic Search, etc. Nutch can run on a single machine, but gains a lot of its strength from
      running in a Hadoop cluster. The now retired branch Nutch 2.x differed from 1.x in one key area:
      storage is abstracted away from any specific underlying data store by using Apache Gora for handling
      object to persistent mappings and to store fetch time, status, content, parsed text, outlinks, inlinks,
      etc. into a number of NoSQL storage solutions.'
    languages:
    - Java
- Apache OFBiz:
    description: Apache OFBiz is an open source product for the automation of enterprise processes that
      includes framework components and business applications for ERP (Enterprise Resource Planning),
      CRM (Customer Relationship Management), E-Business / E-Commerce, SCM (Supply Chain Management),
      MRP (Manufacturing Resource Planning), MMS/EAM (Maintenance Management System/Enterprise Asset Management).
      Apache OFBiz provides a foundation and starting point for reliable, secure and scalable enterprise
      solutions, see https://ofbiz.apache.org/ for more.
    languages: *id012
- Apache Royale:
    description: Apache Royale implements the principles of Apache Flex to support development of applications
      designed for JavaScript instead of Adobe Flash/AIR runtimes. Apache Royale improves developer productivity
      in creating applications to run wherever JavaScript runs, including on browsers, in Apache Cordova
      applications, on Node, and on other platforms.
    languages:
    - ActionScript
- Apache Shiro:
    description: Apache Shiro is a powerful and flexible open-source security framework that cleanly handles
      authentication, authorization, enterprise session management, single sign-on and cryptography services.
    languages: *id069
- Apache Solr:
    description: Solr is an open source enterprise search server based on the Lucene Java search library,
      with Rest-like JSON/HTTP APIs, high performance, high availability, powerful analytics, hit highlighting,
      faceted search, caching, replication, and a web administration interface.
    languages: *id062
- Apache Struts:
    description: The Apache Struts Project offers the Apache Struts 2 web framework which is a comprehensive
      and modular tooling stack for creating web-based Java applications. Struts 2, emerged from the WebWork
      2 framework, is an excellent choice for teams who value elegant solutions to difficult problems.
    languages:
    - Java
- Apache Tapestry:
    description: Tapestry is a component-oriented Java web application framework. Its design emphasizes
      ease of use and developer productivity. Component classes are simple POJOs, with Tapestry using
      byte code manipulation to enhance classes at runtime. Configuration is via annotations and naming
      conventions rather than XML. Web page and component templates use regular (X)HTML that can be edited
      by any web designer. Live Class Reloading enables you to edit Java code and immediately see results
      by reloading the page in the web browser, resulting in a very fast "code it - see it - fix it" loop.
    languages:
    - Java
- Apache Tobago:
    description: The goal of Tobago is to provide the community with a well designed set of user interface
      components based on JSF.
    languages:
    - Java
    - TypeScript
- Apache Turbine:
    description: Turbine is a servlet based framework that allows experienced Java developers to quickly
      build web applications. Turbine allows you to use personalize the web sites and to use user logins
      to restrict access to parts of your application. Turbine is a matured and well established framework
      that is used as the base of many other projects (like e.g. the excellent Jetspeed 1 Portals framework.
      Turbine is an excellent choice for developing applications that make use of a services-oriented
      architecture. Some of the functionality provided with Turbine includes a security management system,
      a scheduling service, XML-defined form validation server, and an XML-RPC service for web services.
      It is a simple task to create new services particular to your application. The Turbine core is free
      of any dependency on a presentation layer technology. Both JavaServer Pages (JSP) and Velocity are
      supported inside Turbine. For developers already familiar with JSP, or have existing JSP tag libraries,
      Turbine offers support for the Sun standard. Velocity is the favorite view technology of most users
      of the Turbine framework; try it out and see if Velocity can help you develop your web applications
      faster and work more easily with non-programming designers. Turbine is developed in an open, participatory
      environment and released under the Apache Software License. Turbine is intended to be a collaboration
      of the best-of-breed developers from around the world. We invite you to participate in this open
      development project. To learn more about getting involved, look at our "How to Help" pages.
    languages:
    - Java
- Apache Websh:
    description: Websh is a rapid development environment for building powerful, fast, and reliable web
      applications in Tcl. Websh is versatile and handles everything from HTML generation to data-base
      driven one-to-one page customization. Websh can be run in CGI environments and as Apache module.
    languages: *id070
- Apache Wicket:
    description: Write maintainable, secure and scalable web applications using just Java and HTML. Invented
      in 2004, Wicket is one of the few survivors of the Java serverside web framework wars of the mid
      2000's, and a proud member of the Apache Software Foundation.
    languages:
    - Java
xml:
- Apache Axiom:
    description: Apache Axiom is a StAX-based, XML Infoset compliant object model which supports on-demand
      building of the object tree. It supports a novel "pull-through" model which allows one to turn off
      the tree building and directly access the underlying pull event stream. It also has built in support
      for XML Optimized Packaging (XOP) and MTOM, the combination of which allows XML to carry binary
      data efficiently and in a transparent manner. The combination of these is an easy to use API with
      a very high performant architecture!
    languages: *id071
- Apache Axis2:
    description: Apache Axis2 is a toolkit for creating and using Web Services, including SOAP, MTOM,
      XML/HTTP and advanced WS-* standards such as WSRM and WSSecurity. Axis2 includes a very fast runtime
      engine, together with tooling support for WSDL and WS-Policy, and plugin support for WS-Addressing,
      WS-ReliableMessaging, WS-Security, WS-Eventing, WS-Transactions, WS-Trust and WS-SecureConversation.
      Axis2 runs either standalone or hosted in Tomcat or other servlet containers.
    languages: *id050
- Apache Batik:
    description: Batik is a Java-based toolkit for applications or applets to use images in the Scalable
      Vector Graphics (SVG) format for various purposes, such as display, generation and manipulation.
    languages: *id072
- Apache Cayenne:
