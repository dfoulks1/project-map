- Apache Celix:
    description: Apache Celix is a framework for C, C++14 and C++17 to develop dynamic modular software
      applications using component and in-process service-oriented programming. Apache Celix is inspired
      by the OSGi specification adapted for C and C++.
    languages:
    - C
    - C++
- Apache CouchDB:
    description: Apache CouchDB is a database that completely embraces the web. Store your data with JSON
      documents. Access your documents with your web browser, via HTTP. Query, combine, and transform
      your documents with JavaScript. Apache CouchDB works well with modern web and mobile apps. CouchDB's
      killer feature is its ability to distribute data efficiently using Apache CouchDB’s incremental
      replication. Apache CouchDB supports master-master setups with automatic conflict detection.
    languages: *id002
- Apache CXF:
    description: Apache CXF is an open source services framework. CXF helps you build and develop services
      using frontend programming APIs like JAX-WS and JAX-RS. These services can speak a variety of protocols
      such as SOAP, XML/HTTP, RESTful HTTP, or CORBA and work over a variety of transports such as HTTP,
      JMS or JBI.
    languages: *id051
- Apache Directory Server:
    description: ApacheDS is an extensible and embeddable directory server entirely written in Java, which
      has been certified LDAPv3 compatible by the Open Group. It has been designed to introduce triggers,
      stored procedures, queues and views to the world of LDAP which has lacked these rich constructs.
    languages:
    - Java
- Apache Felix:
    description: OSGi framework implementation and related technologies.
    languages:
    - Java
- Apache FtpServer:
    description: The Apache FtpServer application is a 100% pure Java FTP server. It's designed to be
      a complete and portable FTP server engine solution based on currently available open protocols.
      FtpServer can be run standalone as a Windows service or Unix/Linux daemon, or embedded into a Java
      application. We also provide support for integration within Spring applications and provide our
      releases as OSGi bundles.
    languages:
    - Java
- Apache Geronimo:
    description: Apache Geronimo is an open source server runtime that integrates the best open source
      projects to create Java/OSGi server runtimes that meet the needs of enterprise developers and system
      administrators. Our most popular distribution is a fully certified Java EE 5 application server
      runtime.
    languages: *id025
- Apache Guacamole:
    description: Apache Guacamole is a clientless remote desktop gateway which supports standard protocols
      like VNC, RDP, and SSH. We call it "clientless" because no plugins or client software are required.
      Once Guacamole is installed on a server, all you need to access your desktops is a web browser.
    languages: *id054
- Apache HTTP Server:
    description: The Apache HTTP Server is an open-source HTTP server for modern operating systems including
      UNIX, Microsoft Windows, Mac OS/X and Netware. The goal of this project is to provide a secure,
      efficient and extensible server that provides HTTP services observing the current HTTP standards.
      Apache has been the most popular web server on the Internet since April of 1996.
    languages: *id018
- Apache HttpComponents Core:
    description: 'HttpCore is a set of low level HTTP transport components that can be used to build custom
      client and server side HTTP services with a minimal footprint. HttpCore supports two I/O models:
      blocking I/O model based on the classic Java I/O and non-blocking, event driven I/O model based
      on Java NIO.'
    languages: *id038
- Apache Ignite:
    description: Apache Ignite is a distributed database for high-performance computing with in-memory
      speed.
    languages: *id004
- Apache Jackrabbit:
    description: Apache Jackrabbit is a fully conforming implementation of the Content Repository for
      Java Technology API (JCR). A content repository is a hierarchical content store with support for
      structured and unstructured content, full text search, versioning, transactions, observation, and
      more. Typical applications that use content repositories include content management, document management,
      and records management systems.
    languages: *id039
- Apache JAMES:
    description: The Apache Java Enterprise Mail Server (a.k.a. Apache James) is a 100% pure Java SMTP
      and POP3 Mail server and NNTP News server. We have designed James to be a complete and portable
      enterprise mail engine solution based on currently available open protocols. James is also a mail
      application platform. We have developed a Java API to let you write Java code to process emails
      that we call the mailet API. A mailet can generate an automatic reply, update a database, prevent
      spam, build a message archive, or whatever you can imagine. A matcher determines whether your mailet
      should process an email in the server. The James project hosts the Mailet API, and James provides
      an implementation of this mail application platform API.
    languages: *id055
- Apache Karaf:
    description: Apache Karaf is a small OSGi based runtime which provides a lightweight container onto
      which various components and applications can be deployed.
    languages: &id060
    - Java
- Apache Kerby:
    description: Apache Kerby, as an Apache Directory sub project, is a Java Kerberos binding. It provides
      a rich, intuitive and interoperable implementation, library, KDC and various facilities that integrates
      PKI, OTP and token (OAuth2) as desired in modern environments such as cloud, Hadoop and mobile.
    languages: *id056
- Apache MINA:
    description: Apache MINA is a network application framework which helps users develop high performance
      and high scalability network applications easily. It provides an abstract, event-driven, asynchronous
      API over various transports such as TCP/IP and UDP/IP via Java NIO.
    languages: *id057
- Apache mod_ftp:
    description: mod_ftp is an FTP Protocol module to serve httpd content over the FTP protocol (whereever
      the HTTP protocol could also be used). It provides both RETR/REST retrieval and STOR/APPE upload,
      using the same user/permissions model as httpd (so it shares the same security considerations as
      mod_dav plus mod_dav_fs).
    languages: *id019
- Apache OFBiz:
    description: Apache OFBiz is an open source product for the automation of enterprise processes that
      includes framework components and business applications for ERP (Enterprise Resource Planning),
      CRM (Customer Relationship Management), E-Business / E-Commerce, SCM (Supply Chain Management),
      MRP (Manufacturing Resource Planning), MMS/EAM (Maintenance Management System/Enterprise Asset Management).
      Apache OFBiz provides a foundation and starting point for reliable, secure and scalable enterprise
      solutions, see https://ofbiz.apache.org/ for more.
    languages: *id012
- Apache OpenMeetings:
    description: The Apache OpenMeetings provides video conferencing, instant messaging, white board,
      collaborative document editing and other groupware tools. Kurento Media Server is used or audio/video
      communication.
    languages: *id058
- Apache Qpid:
    description: Apache Qpid implements the latest AMQP specification, the first open standard for enterprise
      messaging, and provides transaction management, queuing, distribution, security, management, clustering,
      federation and heterogeneous multi-platform support and a lot more.
    languages: *id059
- Apache Solr:
    description: Solr is an open source enterprise search server based on the Lucene Java search library,
      with Rest-like JSON/HTTP APIs, high performance, high availability, powerful analytics, hit highlighting,
      faceted search, caching, replication, and a web administration interface.
    languages: &id062
    - Java
- Apache SSHD:
    description: Apache SSHD is a 100% pure java library to support the SSH protocols on both the client
      and server side. This library is based on Apache MINA, a scalable and high performance asynchronous
      IO library. SSHD does not really aim at being a replacement for the SSH client or SSH server from
      Unix operating systems, but rather provides support for Java based applications requiring SSH support.
    languages:
    - Java
- Apache Synapse:
    description: Apache Synapse is a simple and highly effective ESB, Web Services intermediary and SOA
      framework. It can be added to your existing network very simply either as a services gateway or
      as an HTTP proxy. Once Apache Synapse is mediating your service requests it can perform many functions
      including routing, load-balancing, transformation and protocol switching. Apache Synapse can be
      used to build an Enterprise Service Bus (ESB) or Service Oriented Architecture (SOA). Apache Synapse
      has been designed to support very fast XML routing with a streaming XML design based upon Apache
      Axiom. in addition, the use of a completely asynchronous architecture and non-blocking IO based
      on Java NIO ensures that Synapse has very low overhead and can scale to support thousands of concurrent
      clients without dropping messages.
    languages: *id052
- Apache Thrift:
    description: Apache Thrift allows you to define data types and service interfaces in a simple definition
      file. Taking that file as input, the compiler generates code to be used to easily build RPC clients
      and servers that communicate seamlessly across programming languages. Instead of writing a load
      of boilerplate code to serialize and transport your objects and invoke remote methods, you can get
      right down to business.
    languages: *id045
- Apache Tomcat:
    description: Apache Tomcat is a web server that is an open source software implementation of the Java
      Servlet, JavaServer Pages, Java Expression Language and Java WebSocket technologies. The Java Servlet,
      JavaServer Pages, Java Expression Language and Java WebSocket specifications are developed under
      the Java Community Process. Apache Tomcat is developed in an open and participatory environment
      and released under the Apache License version 2. Apache Tomcat is intended to be a collaboration
      of the best-of-breed developers from around the world. We invite you to participate in this open
      development project. Apache Tomcat powers numerous large-scale, mission-critical web applications
      across a diverse range of industries and organizations. Some of these users and their stories are
      listed on the PoweredBy wiki page.
    languages: *id027
- Apache TomEE:
    description: Apache TomEE Web Profile delivers Servlets, JSP, JSF, JTA, JPA, CDI, Bean Validation
      and EJB Lite. Apache TomEE Plus has all the features of TomEE with the addition of JAX-RS (RESTfull
      Services), JAX-WS (Web Services), JMS (Java Message Service) and JCA (the Java Connector Architecture).
      The additional functionality is delivered via Apache CXF, Apache ActiveMQ and the Geronimo Connector
      library
    languages:
    - Java
- Apache Vysper:
    description: Apache Vysper aims to be a modular, full featured XMPP (Jabber) server. Vysper is implemented
      in Java.
    languages:
    - Java
observability:
- Apache SkyWalking:
    description: Use Apache SkyWalking when you need an application performance monitor tool for distributed
      systems, especially designed for microservices, cloud native and container-based (Docker, K8s, Mesos)
      architectures.
    languages:
    - Java
